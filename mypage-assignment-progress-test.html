<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST マイページ進捗連携検証</title><style>body{font:16px system-ui;background:#f3f7f5;color:#243b34;margin:0}main{max-width:520px;margin:auto;padding:20px}input,button{box-sizing:border-box;padding:12px;margin:6px 0;width:100%;font:inherit}button{background:#176b55;color:white;border:0;border-radius:8px}.muted{color:#64756f;font-size:13px}</style><main><h2>GOLD FIRST マイページ</h2><p>検証専用・ダミードライバーのみ（LINE認証の代わりに検証スタッフ認証）</p><form id="login"><input id="email" type="email" required placeholder="検証用メール"><input id="pw" type="password" required placeholder="パスワード"><button>ログイン</button></form><button id="refresh" hidden>申込・車両進捗を更新</button><p id="msg"></p><section id="out"></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://zwprphmfgobkektzsuti.supabase.co',key='sb_publishable__wtlccECQwOVd3-LvRVFYQ_2dCUlPVR',client=createClient(url,key,{auth:{persistSession:false}});
const el=id=>document.getElementById(id),msg=el('msg'),out=el('out');
async function load(){out.replaceChildren();msg.textContent='取得中…';try{const {data:{session}}=await client.auth.getSession();if(!session)throw Error('ログインしてください');const r=await fetch(url+'/functions/v1/gf-assignment-progress-read-test',{method:'POST',headers:{authorization:'Bearer '+session.access_token,apikey:key,'content-type':'application/json'},body:'{}'});if(!r.ok)throw Error('取得失敗 HTTP '+r.status);const result=await r.json();const a=result.application;if(!a){msg.textContent='割当進捗はありません';return;}
   msg.textContent='';
   const status=document.createElement('div');status.style.cssText='background:#e9f3ee;color:#176b55;border-radius:10px;padding:14px;font-weight:700;margin-bottom:12px';status.textContent='現在：'+(a.stage||'確認中');out.append(status);
   const steps=['申込受付','契約締結','車両準備中','車両手配済み','名義変更前','名義変更中','名義変更済み'];
   const stage=a.stage==='名義変更'?'名義変更中':a.stage==='引渡可能'?'名義変更済み':a.stage;
   const current=Math.max(0,steps.indexOf(stage));
   const stageDates=a.vehicle_progress?.stage_dates||{};
   const displayDate=v=>{
     if(!v)return '';
     const date=new Date(String(v));
     return Number.isNaN(date.getTime())?'':date.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Tokyo'});
   };
   for(let i=0;i<steps.length;i++){
     const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #dce5e1';
     const dot=document.createElement('span');dot.style.cssText='display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:'+(i<current?'#a2cdb6':i===current?'#166b56':'#e5ebea')+';color:'+(i===current?'white':'#28483f');dot.textContent=i<current?'✓':String(i+1);
     const label=document.createElement('span');label.textContent=steps[i];
     row.append(dot,label);
     const value=i===0?a.received_at:i===1?a.contract_updated_at:stageDates[steps[i]];
     if(i<=current&&value){const date=document.createElement('span');date.style.cssText='font-size:12px;color:#64756f;margin-left:auto;white-space:nowrap';date.textContent=displayDate(value);if(date.textContent)row.append(date);}
     out.append(row);
   }
   const info=document.createElement('div');info.style.cssText='background:white;border-radius:10px;padding:14px;margin-top:16px';
   for(const [label,key] of [['申込番号','receipt_id'],['受付状況','reception_status'],['受付日時','received_at'],['納車希望','delivery_wish'],['稼働開始希望','start_wish'],['契約状況','contract_status']]){const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0ef;padding:10px 0;font-size:14px';const left=document.createElement('span');left.textContent=label;const right=document.createElement('strong');right.style.cssText='text-align:right;overflow-wrap:anywhere';right.textContent=a[key]||'未定';row.append(left,right);info.append(row);}out.append(info);
   for(const [label,key] of [['納車可能日','delivery_available_date'],['納車確定日','delivery_confirmed_date']]){
     const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0ef;padding:10px 0;font-size:14px';
     const name=document.createElement('span');name.textContent=label;
     const val=document.createElement('strong');const rawDate=a.vehicle_progress?.[key]||'';const matched=/^(\d{4})-(\d{2})-(\d{2})$/.exec(rawDate);val.textContent=matched?(Number(matched[1])+'年'+Number(matched[2])+'月'+Number(matched[3])+'日'):(rawDate||'未定');val.style.cssText='text-align:right;overflow-wrap:anywhere';row.append(name,val);info.append(row);
   }
   const note=document.createElement('p');note.className='muted';note.textContent='車両進捗はスタッフが登録した内容を表示します。未登録の場合は申込・契約情報のみから表示しています。';out.append(note);
}catch(e){msg.textContent=e.message;}}
el('login').onsubmit=async e=>{e.preventDefault();const r=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('pw').value});el('pw').value='';if(r.error){msg.textContent='ログイン失敗';return;}el('login').hidden=true;el('refresh').hidden=false;await load();};el('refresh').onclick=load;
</script></html>
