<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 割当テスト</title><style>body{font:16px system-ui;background:#f4f6f8;color:#172332;margin:0;padding:20px}main{max-width:600px;margin:auto;background:white;padding:24px;border-radius:16px}label{display:block;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;margin:6px 0;border:1px solid #aab4bf;border-radius:8px}button{background:#174c75;color:white}small{color:#596775}</style><main><h1>車両割当テスト</h1><p>デモ専用・本番への書き込みなし</p><h2>名変待ち</h2><p>テストドライバー B ／ サンプル物流 ／ 千葉</p><label>割当車両<select id="car"><option value="">選択してください</option><option value="DEMO-V02">テスト 02（DEMO-V02）</option></select></label><button id="start">この車両を割り当てる</button><div id="save"></div><p id="result" role="status"></p><small>保存完了はGASによる読み取り照合後に表示されます。</small></main><script type="module">import {mountAssignment} from './mobile-management/assignment-save.demo.mjs';document.getElementById('start').onclick=async()=>{if(!document.getElementById('car').value){alert('車両を選択してください');return}document.getElementById('start').disabled=true;try{await mountAssignment(document.getElementById('save'),{vehicle_id:'DEMO-V02',waiting_id:'DEMO-R01',driver_id:'DEMO-D02'},()=>{document.getElementById('result').textContent='割当完了：車両準備中';})}catch(e){document.getElementById('result').textContent='画面を開けませんでした';document.getElementById('start').disabled=false}};</script></html>
