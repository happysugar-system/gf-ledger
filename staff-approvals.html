<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLD FIRST 申請承認・法人管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#243748;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{padding:16px;background:white;border-bottom:1px solid #e5eaf0}header a{color:#176d9a;text-decoration:none}h1{font-size:20px;margin:10px 0 0}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;background:white;border-bottom:1px solid #e5eaf0}.tabs button{flex-shrink:0;border:0;border-radius:9px;background:#e9eff5;color:#284a60;padding:12px;font-size:14px;font-weight:700}.tabs button.active{background:#176d9a;color:white}main{padding:12px}.notice{font-size:13px;color:#536b7b;margin:0 0 10px}.open{display:inline-block;padding:9px 12px;margin-bottom:10px;background:#fff;border:1px solid #ccd8e0;border-radius:8px;color:#176d9a;text-decoration:none;font-weight:700;font-size:13px}iframe{display:block;width:100%;height:calc(100dvh - 195px);min-height:520px;border:1px solid #e1e6ed;border-radius:12px;background:white}#fallback{font-size:13px;color:#657987}</style></head><body><header><a href="./index.html">‹ 業務システムへ戻る</a><h1>申請承認・法人管理</h1></header><nav class="tabs" aria-label="管理メニュー"><button data-view="drivers">ドライバー申請</button><button data-view="companies">法人管理</button><button data-view="representatives">法人担当者承認</button></nav><main><p class="notice" id="description"></p><div id="panel" style="background:#fff;padding:18px;border-radius:12px;line-height:1.8"></div></main><script>
const views={
 drivers:{description:"ドライバー本人確認・DriverID照合・承認",url:null},
 companies:{description:"法人一覧・車両台数・除外と復元",url:"./company-admin/?entry=approvals-20261117"},
 representatives:{description:"法人担当者の登録申請・承認",url:"./company-admin/?tab=requests&entry=approvals-20261117"}
};
const panel=document.getElementById("panel"),desc=document.getElementById("description");
function show(view){
 if(!views[view])view="companies";
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 desc.textContent=views[view].description;
 history.replaceState(null,"","#"+view);
 panel.replaceChildren();
 if(views[view].url){
  const p=document.createElement("p");p.textContent="スタッフのメール認証で管理します。LINEログインは必要ありません。";
  const a=document.createElement("a");a.href=views[view].url;a.textContent="管理画面を開く";a.className="open";a.removeAttribute("target");panel.append(p,a);
  location.assign(views[view].url);return;
 }
 const p=document.createElement("p");p.textContent="ドライバー申請の旧リンクは法人担当者のLINE認証画面へ転送されるため、誤った画面が開かないよう停止しています。ドライバー申請の管理機能は接続先を確認してから統合します。";
 panel.append(p);
}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));
show(location.hash.slice(1)||"companies");
</script></body></html>
