<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLD FIRST 申請承認・法人管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#243748;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{padding:16px;background:white;border-bottom:1px solid #e5eaf0}header a{color:#176d9a;text-decoration:none}h1{font-size:20px;margin:10px 0 0}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;background:white;border-bottom:1px solid #e5eaf0}.tabs button{flex-shrink:0;border:0;border-radius:9px;background:#e9eff5;color:#284a60;padding:12px;font-size:14px;font-weight:700}.tabs button.active{background:#176d9a;color:white}main{padding:12px}.notice{font-size:13px;color:#536b7b;margin:0 0 10px}.open{display:inline-block;padding:9px 12px;margin-bottom:10px;background:#fff;border:1px solid #ccd8e0;border-radius:8px;color:#176d9a;text-decoration:none;font-weight:700;font-size:13px}iframe{display:block;width:100%;height:calc(100dvh - 195px);min-height:520px;border:1px solid #e1e6ed;border-radius:12px;background:white}#fallback{font-size:13px;color:#657987}</style></head><body><header><a href="./index.html">‹ 業務システムへ戻る</a><h1>申請承認・法人管理</h1></header><nav class="tabs" aria-label="管理メニュー"><button data-view="drivers">ドライバー申請</button><button data-view="companies">法人管理</button><button data-view="representatives">法人担当者承認</button></nav><main><p class="notice" id="description"></p><a id="open" class="open" target="_blank" rel="noopener noreferrer">別画面で開く ↗</a><iframe id="content" title="管理画面" referrerpolicy="strict-origin-when-cross-origin"></iframe><p id="fallback">法人管理はスタッフのメール認証を利用します。ドライバー申請は別アプリのため、認証方式の統一はまだ対応中です。</p></main><script>
const driver="https://happysugar-system.github.io/gf-mypage-demo/admin-registrations.html";
const company="./company-admin/index.html";
const views={drivers:{url:driver,description:"ドライバー本人確認・DriverID照合・承認"},companies:{url:company,description:"法人一覧・車両台数・除外と復元"},representatives:{url:company+"?tab=requests",description:"法人担当者の登録申請・承認"}};
const buttons=[...document.querySelectorAll("[data-view]")],frame=document.getElementById("content"),open=document.getElementById("open"),desc=document.getElementById("description");
function show(view){if(!views[view])view="drivers";buttons.forEach(b=>{b.classList.toggle("active",b.dataset.view===view);b.setAttribute("aria-selected",String(b.dataset.view===view))});desc.textContent=views[view].description;open.href=views[view].url;if(view==="companies"||view==="representatives"){window.location.assign(views[view].url);return;}frame.src=views[view].url;history.replaceState(null,"","#"+view)}
buttons.forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));show(location.hash.slice(1)||"drivers");
</script></body></html>
