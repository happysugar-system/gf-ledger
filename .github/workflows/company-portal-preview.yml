name: Deploy GOLD FIRST site and company portal
# Publish demo company member self-reset control (2026-11-16)
on:
  push:
    branches: [feature/company-portal-20261113]
    paths:
      - 'company-portal/**'
      # Publish Chrome pairing return navigation and clearer instructions; preserve existing site layout
      - '.github/workflows/company-portal-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: company-portal-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing production site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout new company portal
        uses: actions/checkout@v4
        with:
          ref: feature/company-portal-20261113
          sparse-checkout: company-portal
          path: portal-source
      - name: Checkout isolated PWA preview pages
        uses: actions/checkout@v4
        with:
          ref: feature/company-admin-pwa-auth-20261114
          sparse-checkout: company-admin
          path: pwa-source
      - name: Assemble site without replacing the existing homepage
        run: |
          mkdir -p public/company-portal
          cp site/index.html public/index.html
          # Rename the fourth menu and route it to the PWA-authenticated review preview.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/index.html")
          s=p.read_text()
          old="ドライバー登録申請"
          assert old in s
          s=s.replace(old,"法人担当者登録管理",1)
          s=s.replace("本人確認・DriverID照合・承認","法人担当者の申請確認・承認",1)
          s=s.replace("window.location.href = REGISTRATION_URL;","window.location.href = './company-admin/pwa-review-preview.html?v=20261115-pwa9';",1)
          # The legacy registration badge counts DRIVER applications, not company members.
          # Hide only this incorrect badge until a company-specific count is wired.
          s=s.replace('id="registrationBadge"', 'id="registrationBadge" data-company-count-unavailable="true"',1)
          s=s.replace('    updateBadge(count);\n    currentRegistrationCount = count;', '    updateBadge(0);\n    currentRegistrationCount = 0;',1)
          s=s.replace("      count === 0\n        ? '現在、承認待ちの申請はありません。'\n        : '承認待ち：' + count + '件'", "      '法人担当者の申請件数は「法人担当者登録管理」で確認してください。'",1)

          # Company badge: authenticated, exact pending count from the company database.
          # The old driver registration badge remains disabled.
          badge_script = """<script>
(function(){
 const endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-api-pwa-preview";
 const tokenKey="gf_admin_pwa_session_v1";
 let busy=false,last=0;
 async function refreshCompanyBadge(force=false){
   if(busy||(!force&&Date.now()-last<30000))return;
   busy=true;last=Date.now();
   const token=localStorage.getItem(tokenKey);
   if(!token){updateBadge(0);currentRegistrationCount=0;busy=false;return;}
   try{
     const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"pending_count",device_session_token:token}),cache:"no-store"});
     if(!response.ok)throw Error("company count unavailable");
     const data=await response.json();
     if(!Number.isInteger(data.pending_count)||data.pending_count<0)throw Error("invalid count");
     updateBadge(data.pending_count);
     currentRegistrationCount=data.pending_count;
     await updateAppIconBadge();
   }catch(e){updateBadge(0);currentRegistrationCount=null;}
   finally{busy=false;}
 }
 document.addEventListener("DOMContentLoaded",()=>refreshCompanyBadge(true));
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshCompanyBadge(true)});
 window.addEventListener("focus",()=>refreshCompanyBadge());
 setInterval(()=>{if(!document.hidden)refreshCompanyBadge()},60000);
})();
</script>"""
          assert "</body>" in s
          s=s.replace("</body>",badge_script+"</body>",1)
          p.write_text(s)
          PY
          cp site/manifest.webmanifest public/manifest.webmanifest
          cp site/icon.png public/icon.png
          # Keep the existing LINE vehicle-request form available on GitHub Pages.
          cp site/vehicle-request.html public/vehicle-request.html
          cp portal-source/company-portal/index.html public/company-portal/index.html
          cp portal-source/company-portal/vehicle-request-complete.html public/vehicle-request-complete.html
          mkdir -p public/company-admin
          cp -R site/company-admin/. public/company-admin/
          # Keep the existing admin review screen; add only the pairing mode and preview pages.
          cp pwa-source/company-admin/enroll.html public/company-admin/enroll.html
          cp pwa-source/company-admin/member-apply.html public/company-admin/member-apply.html
          cp pwa-source/company-admin/pwa-login-preview.html public/company-admin/pwa-login-preview.html
          cp pwa-source/company-admin/pwa-review-preview.html public/company-admin/pwa-review-preview.html
          python3 - <<'PY'
          from pathlib import Path
          for name in ("pwa-login-preview.html","pwa-review-preview.html"):
              p=Path("public/company-admin")/name
              s=p.read_text()
              marker="<main"
              assert marker in s
              s=s.replace(marker,'<nav style="padding:12px 20px"><a href="../" style="color:#12334d;font-weight:700;text-decoration:none">← 業務システムへ戻る</a></nav><main',1)
              p.write_text(s)
          PY
          test -f public/index.html
          test -f public/vehicle-request.html
          test -f public/vehicle-request-complete.html
          test -f public/company-portal/index.html
          test -f public/company-admin/enroll.html
          grep -q 'demoResetCompany' public/company-admin/member-apply.html
          grep -q 'pageMode==="pair"' public/company-admin/enroll.html
          grep -q 'gf-company-admin-api-demo' public/company-admin/enroll.html
          grep -q 'gf-company-admin-api-pwa-preview' public/company-admin/pwa-review-preview.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
