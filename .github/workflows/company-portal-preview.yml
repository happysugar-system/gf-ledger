name: Deploy company portal preview
on:
  push:
    branches: [feature/company-portal-20261113]
    paths:
      - 'company-portal/**'
      - '.github/workflows/company-portal-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: company-portal-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: company-portal
      - id: deployment
        uses: actions/deploy-pages@v4
