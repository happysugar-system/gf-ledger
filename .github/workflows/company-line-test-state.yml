name: Company LINE test state (offline)
on:
  push:
    paths:
      - 'company-admin/test-link-state.mjs'
      - 'company-admin/test-link-state.test.mjs'
      - '.github/workflows/company-line-test-state.yml'
  pull_request:
    paths:
      - 'company-admin/test-link-state.mjs'
      - 'company-admin/test-link-state.test.mjs'
      - '.github/workflows/company-line-test-state.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test company-admin/test-link-state.test.mjs
