name: Deploy GOLD FIRST site and company portal
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.jpg'
      - '*.png'
      - '*.svg'
      - '*.webmanifest'
      - 'company-admin/**'
      - 'portal/**'
      - '.github/workflows/deploy-gold-first-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.jpg' -o -name '*.png' -o -name '*.svg' -o -name '*.webmanifest' \) -exec cp {} _site/ \;
          cp -R company-admin _site/company-admin
          cp -R portal _site/portal
          test -f _site/index.html
          test -f _site/company-admin/index.html
          test -f _site/company-admin/ledger.html
          test -f _site/portal/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
