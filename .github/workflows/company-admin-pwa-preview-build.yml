name: Build GOLD FIRST PWA auth preview artifact (no deployment)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/company-admin-pwa-auth-20261114
    paths:
      - 'company-admin/**'
      - '.github/workflows/company-admin-pwa-preview-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout isolated PWA preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/company-admin-pwa-auth-20261114
          path: preview
      - name: Assemble preview without changing production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/company-admin
          cp -a production/. artifact/
          cp preview/company-admin/pwa-login-preview.html artifact/company-admin/
          cp preview/company-admin/pwa-review-preview.html artifact/company-admin/
          # Preview artifact only: use the branch version of enroll.html so ?mode=pair works.
          # The live file in production/ is unchanged and no Pages deploy occurs.
          cp preview/company-admin/enroll.html artifact/company-admin/enroll.html
          test -f artifact/index.html
          test -f artifact/company-admin/enroll.html
          test -f artifact/company-admin/pwa-login-preview.html
          test -f artifact/company-admin/pwa-review-preview.html
          cmp preview/company-admin/enroll.html artifact/company-admin/enroll.html
          grep -q 'pageMode==="pair"' artifact/company-admin/enroll.html
          grep -q 'device_session_token:token' artifact/company-admin/pwa-review-preview.html
      - name: Validate JavaScript syntax and pairing integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("enroll.html", "pwa-login-preview.html", "pwa-review-preview.html"):
              html = Path("artifact/company-admin", name).read_text()
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
              if not scripts:
                  raise SystemExit(f"No inline script in {name}")
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts))
          PY
          for page in enroll.html pwa-login-preview.html pwa-review-preview.html; do
            node --check "/tmp/$page.js"
          done
          grep -q 'gf-company-admin-pwa-pairing' artifact/company-admin/pwa-login-preview.html
          grep -q 'gf-company-admin-pwa-pairing' artifact/company-admin/enroll.html
          grep -q 'gf-company-admin-api-pwa-preview' artifact/company-admin/pwa-review-preview.html
      - name: Smoke-test deployed pairing API from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, secrets, urllib.request, urllib.error, os
          url = "https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-pwa-pairing"
          origin = "https://happysugar-system.github.io"
          def call(body):
              request = urllib.request.Request(url,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json", "Origin":origin},
                  method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.loads(error.read())
          def record(label, status, response):
              safe = {"http_status": status, "error": str(response.get("error", ""))[:180], "fields": sorted(response)}
              line = f"{label}: {json.dumps(safe, ensure_ascii=False)}"
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(line + "\\n\\n")
              if status >= 400:
                  print(f"::error title=Pairing API {label} HTTP {status}::{safe['error'] or 'API request failed'}")
              print(line, flush=True)
          verifier = secrets.token_hex(32)
          status, response = call({"action":"begin","verifier":verifier})
          record("begin", status, response)
          if status != 200 or not isinstance(response.get("code"), str) or len(response["code"]) != 12:
              raise SystemExit("Pairing begin API failed; inspect deployed function and trusted IP header")
          status, response = call({"action":"poll","verifier":verifier})
          record("poll", status, response)
          if status != 200 or response.get("status") != "pending":
              raise SystemExit("Pairing poll API failed")
          status, response = call({"action":"check","session_token":secrets.token_hex(32)})
          record("invalid-session", status, response)
          if status != 401:
              raise SystemExit("Invalid session was not rejected")
          print("Smoke tests passed. No LINE credentials or production admin data used.")
          PY
      - name: Upload preview for review only (NOT GitHub Pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf-company-admin-pwa-preview
          path: artifact/
          retention-days: 7
