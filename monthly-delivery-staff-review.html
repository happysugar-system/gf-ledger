<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 月別納車管理（検証）</title><style>body{font:16px system-ui,sans-serif;background:#eef3f7;color:#213047;margin:0}main{max-width:760px;margin:auto;padding:20px}section,form{background:white;padding:16px;border-radius:12px;margin:12px 0}button,input,select{font:inherit;padding:10px;margin:5px;border:1px solid #bbc9d7;border-radius:8px}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}</style><main><a href="./vehicle-driver-management-integration-live-test.html">車両管理に戻る</a><h2>スタッフ専用・検証台帳</h2><form id="login"><label>メール <input type="email" id="email" required autocomplete="username"></label><label>パスワード <input type="password" id="pw" required autocomplete="current-password"></label><button>ログイン</button><button type="button" id="reset">パスワードを忘れた方はこちら</button></form><form id="recovery" hidden><label>新しいパスワード <input id="newpw" type="password" minlength="12" required autocomplete="new-password"></label><button>パスワードを更新</button></form><button id="logout" hidden>ログアウト</button><p id="status" role="status"></p><div id="report"></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
function mountMonthlyDelivery(root,fetchData,completeDelivery){if(typeof fetchData!=="function")throw Error("Authenticated data adapter required");root.innerHTML="<h1>月別納車管理</h1><p>車両台帳・実績履歴から集計します。実績は集計元の定義に従います。</p><button id=\"reload\">最新情報を取得</button><p id=\"msg\" role=\"status\"></p><section><h2>月別集計</h2><div class=\"scroll\"><table id=\"summary\"></table></div></section><section><h2>納車明細</h2><label>対象月 <select id=\"month\"></select></label><label>区分 <select id=\"kind\"><option value=\"\">すべて</option><option value=\"予定\">予定</option><option value=\"貸出開始実績（暫定）\">実績（暫定）</option></select></label><p id=\"count\"></p><div class=\"scroll\"><div id=\"details\"></div></div></section>";
const $=id=>root.querySelector('[id="'+id+'"]');let data=null,request=0,busy=false,disposed=false;
function table(el,rows,click){el.replaceChildren();for(const [i,row] of rows.entries()){const tr=document.createElement('tr');for(const [j,v] of row.entries()){const cell=document.createElement(i===0?'th':'td');if(i&&click&&j>0){const b=document.createElement('button');b.textContent=String(v);b.onclick=()=>click(row[0],j);cell.append(b);}else cell.textContent=String(v??'');tr.append(cell);}el.append(tr);}}
function render(){if(!data)return;const month=$('month').value,kind=$('kind').value;const rows=data.details.slice(1).filter(r=>(!month||r[0]===month)&&(!kind||r[1]===kind));const out=$('details');out.replaceChildren();for(const r of rows){const line=document.createElement('div');line.style.cssText='display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #ddd';const left=document.createElement('div');left.style.flex='1';for(const [i,value] of [r[2],r[5]||'未記録',r[3]].entries()){const t=document.createElement('div');t.textContent=String(value??'');t.style.cssText=i===0?'font-weight:700':i===1?'font-weight:500;margin:3px 0':'color:#666;font-size:14px';left.append(t);}const status=document.createElement('span');status.textContent=r[1]==='予定'?'予定':r[1]==='納車完了'?'納車完了':'実績（暫定）';status.style.cssText='color:#666;font-size:14px';line.append(left,status);
const eligible=Array.isArray(data.completionCandidates)?data.completionCandidates.filter(c=>c.vehicleId===r[2]&&c.plannedDate===r[3]&&c.receiptId&&c.driverId):[];
if(r[1]==='予定'&&typeof completeDelivery==='function'&&eligible.length===1){
 const c=eligible[0],date=document.createElement('input');date.type='date';date.value=c.deliveryDate||new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const btn=document.createElement('button');btn.textContent='納車完了';btn.disabled=busy;
 btn.onclick=async()=>{if(busy||disposed||!date.value)return;if(!confirm('納車完了を登録しますか？'))return;busy=true;btn.disabled=true;$('reload').disabled=true;$('msg').textContent='登録中…';
 try{const result=await completeDelivery({action:'delivery_complete',receiptId:c.receiptId,vehicleId:c.vehicleId,driverId:c.driverId,date:date.value});if(disposed)return;if(result?.status!=='verified')throw Error('登録結果を確認できません。再取得してください');load();}
 catch(e){if(!disposed){$('msg').textContent='登録結果を確認できません。最新情報を取得してから再操作してください。';$('reload').disabled=false;btn.dataset.unconfirmed='1';}}
 finally{busy=false;if(!disposed)btn.disabled=btn.dataset.unconfirmed==='1';}};
 line.append(date,btn);
}out.append(line);} $('count').textContent=rows.length+'件';}
function load(){if(disposed)return;const seq=++request;$('reload').disabled=true;$('msg').textContent='取得中…';Promise.resolve().then(fetchData).then(r=>{if(seq!==request)return;data=r;const prev=$('month').value;$('month').replaceChildren(new Option('すべて',''));for(const row of r.summary.slice(1))$('month').append(new Option(row[0],row[0]));if([...$('month').options].some(o=>o.value===prev))$('month').value=prev;table($('summary'),r.summary,(m,j)=>{$('month').value=m;$('kind').value=j===1?'予定':$('kind').options[2].value;render();$('details').scrollIntoView({block:'nearest'});});const confirmed=r.summary[0]?.[2]==='納車完了台数';$('kind').options[2].value=confirmed?'納車完了':'貸出開始実績（暫定）';$('kind').options[2].textContent=confirmed?'納車完了':'実績（暫定）';render();$('msg').textContent='取得完了';$('reload').disabled=false;}).catch(e=>{if(seq!==request)return;data=null;$('summary').replaceChildren();$('details').replaceChildren();$('count').textContent='';$('msg').textContent=e.message||'取得失敗';$('reload').disabled=false;});}
$('reload').onclick=load;$('month').onchange=render;$('kind').onchange=render;load();

return ()=>{disposed=true;request++;root.replaceChildren();};}
const url='https://tgxrnrqxafytyqfwwsag.supabase.co',key='sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW',client=createClient(url,key,{auth:{persistSession:false}});const el=id=>document.getElementById(id);let dispose;let recovering=false;client.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){recovering=true;el("login").hidden=true;el("recovery").hidden=false;el("status").textContent="新しいパスワードを設定してください";}});
async function read(){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('ログインしてください');const r=await fetch(url+'/functions/v1/gf-monthly-delivery-review',{method:'POST',headers:{authorization:'Bearer '+session.access_token,apikey:key,'content-type':'application/json'},body:JSON.stringify({action:'read'}),signal:AbortSignal.timeout(65000)});if(!r.ok)throw Error('納車情報取得エラー HTTP '+r.status);return r.json();}
el('login').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{const r=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('pw').value});el('pw').value='';if(r.error){const code=String(r.error.code||'');const status=Number(r.error.status)||0;const reason=code==='invalid_credentials'?'メールアドレスまたはパスワードが一致しません':code==='over_request_rate_limit'||status===429?'試行回数制限です。時間をおいて再試行してください':status===401?'認証設定を確認してください':'認証通信に失敗しました';throw Error(reason+'（'+(code.replace(/[^a-z0-9_]/gi,'')||'HTTP '+status)+'）');}el('login').hidden=true;el('logout').hidden=false;el('status').textContent='読み取り専用';dispose=mountMonthlyDelivery(el('report'),read);}catch(e){el('status').textContent=e.message;}finally{b.disabled=false;}};
el('logout').onclick=async()=>{dispose?.();await client.auth.signOut();el('login').hidden=false;el('logout').hidden=true;el('status').textContent='ログアウトしました';};
el('reset').onclick=async()=>{const email=el('email').value.trim();if(!el('email').checkValidity()){el('email').reportValidity();return;}const b=el('reset');b.disabled=true;try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:'https://happysugar-system.github.io/gf-ledger/monthly-delivery-staff-review.html'});if(error)throw Error('再設定メールを送信できませんでした。時間をおいて再試行してください。');el('status').textContent='登録済みの場合、再設定メールが届きます。';}catch(e){el('status').textContent=e.message;}finally{b.disabled=false;}};
el('recovery').onsubmit=async e=>{e.preventDefault();if(!recovering)return;const b=e.currentTarget.querySelector('button');b.disabled=true;try{const {error}=await client.auth.updateUser({password:el('newpw').value});if(error)throw Error('更新できませんでした。再設定リンクを確認してください。');el('newpw').value='';await client.auth.signOut();recovering=false;history.replaceState(null,'',location.pathname);el('recovery').hidden=true;el('login').hidden=false;el('status').textContent='更新完了。新しいパスワードでログインしてください。';}catch(e){el('status').textContent=e.message;}finally{b.disabled=false;}};
</script></html>
