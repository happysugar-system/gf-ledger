<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLDFIRST 保険相談</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#1e293b;margin:0}
main{max-width:560px;margin:auto;padding:24px 18px 56px}
h1{font-size:23px;margin:8px 0 5px}.sub{color:#64748b;font-size:14px;margin:0 0 24px}
.panel{background:white;padding:20px;border-radius:15px;box-shadow:0 2px 16px #13243b0d}
label{display:block;font-weight:650;font-size:14px;margin:17px 0 7px}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:13px;font:inherit;background:white;color:#1e293b}
textarea{min-height:128px;resize:vertical}
button{border:0;background:#06c755;color:#fff;font-size:16px;font-weight:700;border-radius:10px;padding:16px;width:100%;margin-top:22px}
button:disabled{background:#a4b3ba}
#status{font-size:14px;white-space:pre-wrap;line-height:1.6;margin-top:14px}
.success{color:#087f5b}.error{color:#b42318}.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>保険について</h1>
<p class="sub">担当者への相談受付フォーム</p>
<div class="panel">
<form id="f" method="post" target="resultFrame" action="https://script.google.com/macros/s/AKfycbx90uDpmZUquizH10Uq93g9rt5GGT5UDAEjKtcbIEYg05uWdOzATyLAe-D5POfsrmGO_A/exec">
<input type="hidden" name="action" value="gf195_liff_submit">
<input type="hidden" name="idToken" id="idToken">
<input type="hidden" name="sendKey" id="sendKey">
<label for="intent">ご相談内容</label>
<select id="intent" name="intent" required>
<option value="">選択してください</option>
<option value="consult_join">加入手続きを希望する</option>
<option value="consult_switch">切り替えについて相談する</option>
<option value="consult_price">加入前に保険料を知りたい</option>
<option value="consult_cover">加入前に補償内容を知りたい</option>
<option value="consult_contract">契約中の保険内容を確認したい</option>
<option value="consult_paydate">支払日・支払い方法を確認したい</option>
<option value="consult_failed">引き落としができなかった</option>
<option value="consult_unpaid">未納の案内が届いた</option>
<option value="consult_accident">事故の報告・対応の相談</option>
<option value="consult_progress">報告済みの事故の進捗確認</option>
<option value="consult_general">担当者に相談する</option>
</select>
<label for="name">お名前 *</label>
<input id="name" name="name" maxlength="80" autocomplete="name" required placeholder="例：山田 太郎">
<div id="monthWrap" class="hidden"><label for="month">対象のお支払い月 *</label><input id="month" name="month" type="month"></div>
<label for="details" id="detailsLabel">相談内容・補足事項</label>
<textarea id="details" name="details" maxlength="1000" placeholder="担当者に伝えたい内容を入力してください"></textarea>
<button id="submit" disabled type="submit">LINE認証を確認しています…</button>
<div id="status" role="status" aria-live="polite"></div>
</form>
<iframe title="受付通信" name="resultFrame" id="resultFrame" hidden></iframe>
</div>
</main>
<script>
const LIFF_ID='2012058414-X38FJPaP';
const form=document.getElementById('f');
const intent=document.getElementById('intent');
const monthWrap=document.getElementById('monthWrap');
const month=document.getElementById('month');
const detailsLabel=document.getElementById('detailsLabel');
const button=document.getElementById('submit');
const status=document.getElementById('status');
let ready=false,pending=false,currentKey='',pollTimer=null,attempts=0,checkFrame=null;
function show(message,error=false){status.textContent=message;status.className=error?'error':'success';}
function update(){
 const v=intent.value;
 const pay=['consult_paydate','consult_failed','consult_unpaid'].includes(v);
 monthWrap.classList.toggle('hidden',!pay);
 month.required=pay;
 detailsLabel.textContent=v==='consult_accident'?'事故の日時・場所・現在の状況':v==='consult_progress'?'事故日・確認したい内容':'相談内容・補足事項';
 document.getElementById('details').required=v==='consult_accident'||v==='consult_progress';
}
intent.addEventListener('change',update);
function queryIntent(){
 const qs=new URLSearchParams(location.search);
 let v=qs.get('intent');
 if(!v&&qs.get('liff.state')){
  try{v=new URLSearchParams(qs.get('liff.state').replace(/^\?/, '')).get('intent');}catch(e){}
 }
 return v;
}
(async()=>{
 try{
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
  const idToken=liff.getIDToken();
  if(!idToken)throw new Error('LINE認証情報が取得できません。LINEから開き直してください。');
  document.getElementById('idToken').value=idToken;
  const v=queryIntent();
  if(v&&[...intent.options].some(o=>o.value===v))intent.value=v;
  update();ready=true;button.disabled=false;button.textContent='この内容で受付する';
  show('');
 }catch(e){show('フォームを開けませんでした：'+e.message,true);button.textContent='利用できません';}
})();
function makeKey(){
 const a=new Uint8Array(16);crypto.getRandomValues(a);
 return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');
}
function finishSuccess(receipt){
 pending=false;clearTimeout(pollTimer);
 if(checkFrame){checkFrame.remove();checkFrame=null;}
 show('受付完了！\n受付番号：'+receipt+'\n担当者が内容を確認します。');
 button.textContent='受付完了';button.disabled=true;
 try{sessionStorage.removeItem('gf195_pending_key');}catch(e){}
 form.querySelectorAll('input,select,textarea').forEach(x=>x.disabled=true);
}
// 保存済み受付を照会する内部処理。診断情報は画面に表示しない。
function pollStatus(){
 if(!pending||!currentKey)return;
 attempts++;
 if(checkFrame){checkFrame.remove();checkFrame=null;}
 const frame=document.createElement('iframe');checkFrame=frame;
 frame.hidden=true;frame.title='保存状況確認';
 frame.src='insurance-status-check.html?auto=1&key='+encodeURIComponent(currentKey)+'&n='+Date.now();
 document.body.appendChild(frame);
 if(attempts<8){pollTimer=setTimeout(pollStatus,5500);}
 else{
  pollTimer=setTimeout(()=>{
   if(pending){
    pending=false;
    button.disabled=true;
    button.textContent='受付状況を確認中';
    show('受付番号を確認できませんでした。受付済みの可能性があるため、もう一度送信せず担当者へお問い合わせください。',true);
   }
  },6500);
 }
}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||!e.data||e.data.source!=='GF195_CHECK')return;
 if(e.data.key!==currentKey)return;
 if(e.data.found&&e.data.receipt)finishSuccess(e.data.receipt);
});
form.addEventListener('submit',e=>{
 if(!ready||pending){e.preventDefault();return;}
 currentKey=makeKey();
 document.getElementById('sendKey').value=currentKey;
 try{sessionStorage.setItem('gf195_pending_key',currentKey);}catch(e){}
 pending=true;button.disabled=true;button.textContent='送信中…';
 show('受付内容を送信しています。少々お待ちください。');
 attempts=0;pollTimer=setTimeout(pollStatus,4000);
});
// 保存後の画面更新に備え、送信済みキーが残っていれば再送信せず確認する。
try{
 const saved=sessionStorage.getItem('gf195_pending_key');
 if(saved&&/^[a-f0-9]{32}$/i.test(saved)){
  currentKey=saved;pending=true;button.disabled=true;
  button.textContent='受付状況を確認中';
  show('前回の受付状況を確認しています。');
  pollTimer=setTimeout(pollStatus,1000);
 }
}catch(e){}
window.addEventListener('message',e=>{
 if(!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin))return;
 const d=e.data;
 if(!d||d.source!=='GF195_LIFF'||!pending)return;
 if(d.ok&&d.receipt)finishSuccess(d.receipt);
 else if(!d.ok){
  pending=false;clearTimeout(pollTimer);
  button.disabled=true;
  button.textContent='受付状況を確認してください';
  show('受付結果を確認できませんでした。再送信せず、担当者へお問い合わせください。',true);
 }
});
</script>
</body>
</html>
