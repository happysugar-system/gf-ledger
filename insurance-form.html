<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLDFIRST 保険相談（DEMO）</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#1e293b;margin:0}main{max-width:560px;margin:auto;padding:24px 18px 56px}.tag{color:#07835b;font-size:12px;font-weight:700}h1{font-size:23px;margin:8px 0 5px}.sub{color:#64748b;font-size:14px;margin:0 0 24px}.panel{background:white;padding:20px;border-radius:15px;box-shadow:0 2px 16px #13243b0d}label{display:block;font-weight:650;font-size:14px;margin:17px 0 7px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:13px;font:inherit;background:white;color:#1e293b}textarea{min-height:128px;resize:vertical}button{border:0;background:#06c755;color:#fff;font-size:16px;font-weight:700;border-radius:10px;padding:16px;width:100%;margin-top:22px}button:disabled{background:#a4b3ba}#status{font-size:14px;white-space:pre-wrap;line-height:1.6;margin-top:14px}.success{color:#087f5b}.error{color:#b42318}.help{font-size:12px;color:#64748b;margin-top:8px}.hidden{display:none}</style></head><body><main><div class="tag">GOLDFIRST · DEMO · v5</div><h1>保険について</h1><p class="sub">担当者への相談受付フォーム</p><div class="panel"><form id="f" method="post" target="resultFrame" action="https://script.google.com/macros/s/AKfycbx90uDpmZUquizH10Uq93g9rt5GGT5UDAEjKtcbIEYg05uWdOzATyLAe-D5POfsrmGO_A/exec"><input type="hidden" name="action" value="gf195_liff_submit"><input type="hidden" name="idToken" id="idToken"><input type="hidden" name="sendKey" id="sendKey"><label for="intent">ご相談内容</label><select id="intent" name="intent" required><option value="">選択してください</option><option value="consult_join">加入手続きを希望する</option><option value="consult_switch">切り替えについて相談する</option><option value="consult_price">加入前に保険料を知りたい</option><option value="consult_cover">加入前に補償内容を知りたい</option><option value="consult_contract">契約中の保険内容を確認したい</option><option value="consult_paydate">支払日・支払い方法を確認したい</option><option value="consult_failed">引き落としができなかった</option><option value="consult_unpaid">未納の案内が届いた</option><option value="consult_accident">事故の報告・対応の相談</option><option value="consult_progress">報告済みの事故の進捗確認</option><option value="consult_general">担当者に相談する</option></select><label for="name">お名前 <span aria-hidden="true">*</span></label><input id="name" name="name" maxlength="80" autocomplete="name" required placeholder="例：山田 太郎"><div id="monthWrap" class="hidden"><label for="month">対象のお支払い月 *</label><input id="month" name="month" type="month"></div><label for="details" id="detailsLabel">相談内容・補足事項</label><textarea id="details" name="details" maxlength="1000" placeholder="担当者に伝えたい内容を入力してください"></textarea><p class="help">送信内容はデモ用の受付管理シートに記録されます。緊急の事故対応は、このフォームの返信を待たずに119・110などへ連絡してください。</p><button id="submit" disabled type="submit">LINE認証を確認しています…</button><div id="status" role="status" aria-live="polite"></div><button id="checkStatus" type="button" style="display:none;background:#2463a6;margin-top:12px">保存済みの受付を確認</button><div id="diagnostics" style="font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#475569;margin-top:12px"></div></form><iframe title="受付通信" name="resultFrame" id="resultFrame" hidden></iframe></div></main><script>
const LIFF_ID='2012058414-X38FJPaP';
const form=document.getElementById('f'),intent=document.getElementById('intent'),monthWrap=document.getElementById('monthWrap'),month=document.getElementById('month'),detailsLabel=document.getElementById('detailsLabel'),button=document.getElementById('submit'),status=document.getElementById('status');
let ready=false,pending=false,sendTimer=null;
const checkButton=document.getElementById('checkStatus'),diagnostics=document.getElementById('diagnostics');
let currentKey='', pollInFlight=false;
function logStatus(s){diagnostics.textContent=(new Date().toLocaleTimeString()+' ' +s+'\n'+diagnostics.textContent).slice(0,1800)}
const resultFrame=document.getElementById('resultFrame');
let frameLoaded=false;
resultFrame.addEventListener('load',()=>{if(!pending)return;frameLoaded=true;show('送信先から画面応答がありました。受付結果を確認しています。');});
function show(message,error=false){status.textContent=message;status.className=error?'error':'success'}
function update(){const v=intent.value,pay=['consult_paydate','consult_failed','consult_unpaid'].includes(v);monthWrap.classList.toggle('hidden',!pay);month.required=pay;detailsLabel.textContent=v==='consult_accident'?'事故の日時・場所・現在の状況':v==='consult_progress'?'事故日・確認したい内容':'相談内容・補足事項';document.getElementById('details').required=v==='consult_accident'||v==='consult_progress'}
intent.addEventListener('change',update);
function queryIntent(){const qs=new URLSearchParams(location.search);let v=qs.get('intent');if(!v&&qs.get('liff.state')){try{v=new URLSearchParams(qs.get('liff.state').replace(/^\?/, '')).get('intent')}catch(e){}}return v}
(async()=>{try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}const idToken=liff.getIDToken();if(!idToken)throw new Error('LINE認証情報が取得できません。LIFFの権限設定でopenidを有効にしてください。');document.getElementById('idToken').value=idToken;const v=queryIntent();if(v&&[...intent.options].some(o=>o.value===v))intent.value=v;update();ready=true;button.disabled=false;button.textContent='この内容で受付する';show('LINE認証済み。内容を入力してください。')}catch(e){show('初期化できませんでした：'+e.message,true);button.textContent='利用できません'}})();
const GAS_URL=form.action;
let pollCount=0,pollTimer=null;
function makeKey(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function finishSuccess(receipt){
 pending=false;if(sendTimer)clearTimeout(sendTimer);if(pollTimer)clearInterval(pollTimer);
 show('受付完了！\n受付番号：'+receipt+'\n担当者が内容を確認します。');
 logStatus('保存済みを確認：'+receipt);button.textContent='受付完了';button.disabled=true;
 checkButton.style.display='none';try{sessionStorage.removeItem('gf195_pending_key')}catch(e){}
 form.querySelectorAll('input,select,textarea').forEach(x=>x.disabled=true);
}
window.GF195_statusCallback=function(d){
 logStatus('照会応答：'+JSON.stringify(d));pollInFlight=false;
 if(d&&d.found&&d.receipt){finishSuccess(d.receipt)}
 else if(d&&d.found===false){show('保存結果を確認しています。しばらくお待ちください。')}
};
function pollStatus(){
 if(!currentKey||(!pending&&checkButton.style.display==='none'))return;
 if(pollInFlight){logStatus('前の照会が処理中');return}
 pollCount++;pollInFlight=true;
 const script=document.createElement('script');
 const url=GAS_URL+'?action=gf195_status&key='+encodeURIComponent(currentKey)+'&_='+Date.now();
 script.src=url;script.async=true;
 logStatus('照会 '+pollCount+' 回目を開始');
 let finished=false;
 const guard=setTimeout(()=>{if(finished)return;finished=true;pollInFlight=false;logStatus('照会タイムアウト（8秒）');script.remove()},8000);
 script.onerror=()=>{if(finished)return;finished=true;clearTimeout(guard);pollInFlight=false;logStatus('照会スクリプトの読み込みエラー');script.remove()};
 script.onload=()=>{if(finished)return;finished=true;clearTimeout(guard);pollInFlight=false;logStatus('照会スクリプト読込完了');script.remove()};
 document.head.appendChild(script);
}
function startPolling(){
 if(pollTimer)clearInterval(pollTimer);
 pollStatus();pollTimer=setInterval(()=>{if(!pending){clearInterval(pollTimer);return}pollStatus()},3000);
}
checkButton.addEventListener('click',()=>{
 if(!currentKey)return;
 logStatus('手動で照会');pollStatus();
});
form.addEventListener('submit',e=>{
 if(!ready||pending){e.preventDefault();return}
 currentKey=makeKey();document.getElementById('sendKey').value=currentKey;
 try{sessionStorage.setItem('gf195_pending_key',currentKey)}catch(e){}
 pending=true;button.disabled=true;button.textContent='送信中…';frameLoaded=false;
 checkButton.style.display='block';show('送信しました。受付状況を確認しています。');
 logStatus('送信開始（識別キー末尾：'+currentKey.slice(-6)+'）');
 pollCount=0;pollInFlight=false;
 setTimeout(startPolling,3000);
 sendTimer=setTimeout(()=>{
  if(!pending)return;pending=false;if(pollTimer)clearInterval(pollTimer);
  button.textContent='再送信せず受付を確認してください';
  show('完了を自動確認できませんでした。保存済みの可能性があります。下の「保存済みの受付を確認」を押してください。再送信はしないでください。',true);
  logStatus('自動確認は時間切れ（35秒）');
 },35000);
});
// 保存済みの送信キーで、追加登録せず確認できる。
const checkKey=new URLSearchParams(location.search).get('checkKey');
if(checkKey&&/^[a-f0-9]{32}$/i.test(checkKey)){
 currentKey=checkKey;checkButton.style.display='block';
 logStatus('診断モード：既存の送信キーで照会');
 setTimeout(pollStatus,1000);
}
window.addEventListener('message',e=>{if(!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin))return;const d=e.data;if(!d||d.source!=='GF195_LIFF'||!pending)return;if(d.ok&&d.receipt){finishSuccess(d.receipt)}else if(!d.ok){show('送信先からエラーが返りました：'+d.message+'\n重複防止のため再送信せず確認してください。',true)}});
</script></body></html>
