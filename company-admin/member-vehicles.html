<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 法人LINEマイページ</title><style>body{margin:0;background:#f3f7fa;color:#18384d;font:16px system-ui,sans-serif}header{background:#12344d;color:white;padding:20px}main{max-width:860px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:20px;margin-bottom:14px}button{border:0;background:#146e9c;color:white;border-radius:9px;padding:12px 18px;font:inherit}.muted{color:#617789}input{padding:12px;border:1px solid #c3d1dc;border-radius:8px;width:100%;box-sizing:border-box;font:inherit}.vehicle{border:1px solid #dbe5ee;border-radius:10px;padding:14px;margin:10px 0}.vehicle summary{cursor:pointer}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.fields div{background:#f4f8fa;padding:9px;border-radius:7px}.fields small{display:block;color:#60768a}.status{white-space:pre-wrap;background:#eaf3f9;padding:12px;border-radius:8px}@media(max-width:600px){.fields{grid-template-columns:1fr}}</style><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><header><strong>GOLD FIRST</strong><div>法人LINEマイページ｜閲覧専用</div></header><main><div class="card"><button id="login">LINEでログイン</button><p id="status" class="status" role="status">本人確認を開始してください。</p><p class="muted">承認済み担当者だけが、自分の法人に紐づく車両を閲覧できます。</p></div><div id="portal" hidden><div class="card"><small class="muted">所属法人</small><h2 id="company"></h2><p id="count"></p><input id="search" placeholder="車番・利用者名で検索"></div><div class="card"><h2>車両一覧</h2><div id="vehicles"></div></div></div></main><script>
const liffId="2012058414-jYEPzMww",endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-line-vehicles-demo";
const status=document.getElementById("status");let rows=[];
const text=(tag,value)=>{const e=document.createElement(tag);e.textContent=value??"—";return e};
function render(){const root=document.getElementById("vehicles");root.replaceChildren();const q=document.getElementById("search").value.toLowerCase().trim();const selected=rows.filter(v=>[v.vehicle_number,v.driver_display_name].some(s=>String(s||"").toLowerCase().includes(q)));document.getElementById("count").textContent="対象車両："+rows.length+"台 ／ 表示："+selected.length+"台";selected.forEach(v=>{const d=document.createElement("details");d.className="vehicle";const s=text("summary",(v.vehicle_number||v.vehicle_id)+"　"+(v.status||""));d.append(s);const fields=document.createElement("div");fields.className="fields";[["利用者",v.driver_display_name],["車両ID",v.vehicle_id],["管理区分",v.status],["名変予定日",v.name_change_scheduled],["納車予定日",v.delivery_scheduled],["利用開始日",v.usage_start],["返却予定日",v.return_scheduled]].forEach(([label,value])=>{const div=document.createElement("div");div.append(text("small",label),text("span",value));fields.append(div)});d.append(fields);root.append(d)});if(!selected.length)root.append(text("p","該当する車両はありません。"))}
async function load(){status.textContent="LINE本人確認・閲覧権限を確認しています…";await liff.init({liffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.origin+location.pathname});return;}const token=liff.getIDToken();if(!token)throw Error("LINEのIDトークンが取得できません");const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({line_id_token:token})});const data=await r.json();if(!r.ok)throw Error(data.error||"閲覧できません");document.getElementById("company").textContent=data.company_name;rows=data.vehicles;document.getElementById("portal").hidden=false;status.textContent="LINE認証済み："+data.representative_name;render()}
document.getElementById("login").addEventListener("click",()=>load().catch(e=>status.textContent="エラー："+e.message));document.getElementById("search").addEventListener("input",render);
load().catch(e=>status.textContent="エラー："+e.message);
</script></body></html>
