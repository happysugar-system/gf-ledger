<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法人LINE紐づけ｜テスト操作プレビュー</title><style>body{font:16px system-ui;background:#f2f6fa;color:#18354c;margin:0}header{background:#173c58;color:white;padding:20px}main{max-width:620px;margin:24px auto;padding:0 16px}.card{background:white;padding:22px;border-radius:14px;margin:15px 0}select,button{font:inherit;padding:12px;border-radius:8px}select{width:100%;border:1px solid #b8cad8}button{border:0;background:#126a9d;color:white;margin:8px 6px 8px 0}button:disabled{opacity:.4}.danger{background:#a34242}.muted{color:#5e7282}#history{white-space:pre-wrap}</style><header><h2>GOLD FIRST｜LINEテスト紐づけ</h2></header><main><section class="card"><strong>操作プレビュー（データ保存なし）</strong><p class="muted">この画面は画面操作を確認するための模擬版です。LINE認証・Supabase・法人車両データには接続していません。</p></section><section class="card"><h3>テスト用LINE</h3><p>テストアカウント（画面内のみ）</p><h3>現在の法人</h3><strong id="current">未紐づけ</strong><label><p>切替先のテスト法人</p><select id="company"><option value="TEST-A">テスト法人A</option><option value="TEST-B">テスト法人B</option></select></label><button id="link">紐づけ・切替</button><button class="danger" id="unlink">解除</button><p id="message" role="status"></p></section><section class="card"><h3>操作履歴（この画面内）</h3><p id="history" class="muted">操作履歴なし</p></section></main><script type="module">import {createState,transition} from "./test-link-state.mjs";let state=createState();const $=id=>document.getElementById(id);function render(){const names={"TEST-A":"テスト法人A","TEST-B":"テスト法人B"};$("current").textContent=names[state.companyId]||"未紐づけ";$("unlink").disabled=!state.companyId;$("history").textContent=state.history.map((x,i)=>(i+1)+". "+({link:"紐づけ",switch:"法人切替",unlink:"解除"}[x.action])+"："+names[x.companyId]).join("\n")||"操作履歴なし"}$("link").onclick=()=>{try{state=transition(state,state.companyId?"switch":"link",$("company").value);$("message").textContent="模擬操作を反映しました（保存なし）";render()}catch(e){$("message").textContent=e.message}};$("unlink").onclick=()=>{try{state=transition(state,"unlink");$("message").textContent="模擬解除しました（保存なし）";render()}catch(e){$("message").textContent=e.message}};render();</script></html>
