<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜管理者ログイン検証</title><style>
[hidden]{display:none!important}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#172333;margin:0;padding:20px}.card{max-width:520px;margin:30px auto;background:white;border-radius:16px;padding:24px;box-shadow:0 4px 22px #1232}h1{font-size:1.4rem}button,a.action{display:inline-block;background:#1469c9;color:white;border:0;border-radius:8px;padding:13px 18px;font-size:1rem;margin:6px 0;text-decoration:none}button:disabled{opacity:.5}button,a.action{cursor:pointer}#dashboard{display:block;text-align:center;font-weight:700}#dashboard[hidden]{display:none}.secondary{background:#edf3fa;color:#23415d;border:1px solid #c9d7e6;font-size:.9rem}#logout{margin-top:14px}input{font-size:1.4rem;width:95%;padding:12px;letter-spacing:.12em}.code{font-size:2rem;font-weight:700;letter-spacing:.18em}small{color:#667}#status{white-space:pre-wrap}</style></head><body><main class="card"><h1>GOLD FIRST｜管理者ログイン検証</h1><p><small>検証専用。既存の承認画面は変更しません。</small></p><section id="pwa"><p>ホーム画面アプリから開始し、表示された12桁の番号をLINE認証画面で入力してください。</p><button id="begin">LINEでログインする</button><p class="code" id="code"></p><p id="expires"></p><p><a class="action" id="openAuth" href="enroll.html?mode=pair" target="_blank" rel="noopener" hidden>LINE認証画面を開く</a></p><button class="secondary" id="pollNow" hidden>LINE認証の完了を確認</button><button class="secondary" id="check" hidden>ログイン状態を再確認</button><p><a class="action" id="dashboard" href="pwa-review-preview.html" hidden>法人担当者の承認管理を開く</a></p><button class="secondary" id="logout" hidden>ログアウト</button></section><p id="status" role="status"></p></main>
<script>
"use strict";
const API="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-pwa-pairing";
const TOKEN_KEY="gf_admin_pwa_session_v1",VERIFIER_KEY="gf_admin_pwa_verifier_v1";
const el=id=>document.getElementById(id);
const status=s=>el("status").textContent=s;
const BUILD="20261115-pwa3";
const post=async body=>{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"通信エラー");return d};
const randomHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");
const session=()=>localStorage.getItem(TOKEN_KEY);
// PWA can be suspended or relaunched when LINE opens another browser.
// Keep the one-time verifier across app restarts (never place it in a URL).
const verifierExpiryKey="gf_admin_pwa_verifier_expires_v1";
let polling=false, checking=false;
function view(mode){
 const signedIn=mode==="signed-in", waiting=mode==="waiting";
 el("begin").hidden=signedIn||waiting;
 el("code").hidden=!waiting;
 el("expires").hidden=!waiting;
 el("openAuth").hidden=!waiting;
 el("check").hidden=!signedIn;
 el("pollNow").hidden=!waiting;
 el("logout").hidden=!signedIn;
 el("dashboard").hidden=!signedIn;
}
async function check(){
 const token=session();
 if(!token){view("signed-out");status("ログインしていません");return}
 if(checking)return;
 checking=true;
 el("check").disabled=true;
 status("ログイン状態を確認しています…");
 try{
  await post({action:"check",session_token:token});
  view("signed-in");
  status("✓ ログイン中です。承認管理画面を開けます。");
 }catch(e){
  localStorage.removeItem(TOKEN_KEY);
  view("signed-out");
  status("ログインの有効期限が切れました。再度LINEでログインしてください。");
 }finally{checking=false;el("check").disabled=false}
}
async function poll(){
 if(polling)return;
 const verifier=localStorage.getItem(VERIFIER_KEY);
 if(!verifier){status("認証待ち情報がありません。新しく12桁コードを発行してください。");view("signed-out");return}
 if(Number(localStorage.getItem(verifierExpiryKey))<=Date.now()){localStorage.removeItem(VERIFIER_KEY);localStorage.removeItem(verifierExpiryKey);view("signed-out");status("認証コードが5分で期限切れになりました。新しく発行してください。");return}
 polling=true;
 try{
  const d=await post({action:"poll",verifier});
  if(d.status==="approved"&&d.session_token){
   localStorage.setItem(TOKEN_KEY,d.session_token);
   localStorage.removeItem(VERIFIER_KEY);
   localStorage.removeItem(verifierExpiryKey);
   el("code").textContent="";
   await check();
  }else if(d.status==="pending"){
   view("waiting");
   status("LINEでの本人確認を待っています…");
  }else{
   localStorage.removeItem(VERIFIER_KEY);
   localStorage.removeItem(verifierExpiryKey);
   view("signed-out");
   status("認証コードの期限が切れました。新しくログインしてください。");
  }
 }catch(e){status("認証結果を取得できませんでした："+e.message+"。アプリを閉じずに「LINE認証の完了を確認」を押してください。")}
 finally{polling=false}
}
el("begin").onclick=async()=>{
 el("begin").disabled=true;
 status("認証コードを発行しています…");
 try{
  const verifier=randomHex(32);
  const d=await post({action:"begin",verifier});
  localStorage.setItem(VERIFIER_KEY,verifier);
  localStorage.setItem(verifierExpiryKey,String(Date.now()+300000));
  el("code").textContent=d.code;
  el("expires").textContent="有効期限：5分";
  view("waiting");
  status("「LINE認証画面を開く」を押し、12桁の番号を入力してください。");
 }catch(e){view("signed-out");status("開始できませんでした："+e.message)}
 finally{el("begin").disabled=false}
};
el("check").onclick=check;
el("pollNow").onclick=async()=>{status("LINEの承認結果を確認しています…");if(polling){status("自動確認の通信中です。少し待ってから再確認してください。");return}await poll()};
el("logout").onclick=async()=>{
 const token=session();
 localStorage.removeItem(TOKEN_KEY);
 localStorage.removeItem(VERIFIER_KEY);
 localStorage.removeItem(verifierExpiryKey);
 view("signed-out");
 status("ログアウトしました");
 if(token)try{await post({action:"logout",session_token:token})}catch{status("この端末からはログアウトしました。通信できなかったためサーバー側の解除は未確認です。")}
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&localStorage.getItem(VERIFIER_KEY))poll()});
window.addEventListener("pageshow",()=>{if(localStorage.getItem(VERIFIER_KEY))poll()});
document.querySelector("h1").textContent="GOLD FIRST｜管理者ログイン（"+BUILD+"）";
if(session()){view("signed-in");check()}else if(localStorage.getItem(VERIFIER_KEY)&&Number(localStorage.getItem(verifierExpiryKey))>Date.now()){view("waiting");status("LINE本人確認の完了を確認しています…");poll()}else{localStorage.removeItem(VERIFIER_KEY);localStorage.removeItem(verifierExpiryKey);view("signed-out");status("LINEでログインしてください")}
setInterval(()=>{if(!document.hidden&&localStorage.getItem(VERIFIER_KEY))poll()},4000);
</script></body></html>
