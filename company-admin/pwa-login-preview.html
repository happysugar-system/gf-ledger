<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜管理者ログイン検証</title><style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;color:#172333;margin:0;padding:20px}.card{max-width:520px;margin:30px auto;background:white;border-radius:16px;padding:24px;box-shadow:0 4px 22px #1232}h1{font-size:1.4rem}button,a.action{display:inline-block;background:#1469c9;color:white;border:0;border-radius:8px;padding:13px 18px;font-size:1rem;margin:6px 0;text-decoration:none}button:disabled{opacity:.5}input{font-size:1.4rem;width:95%;padding:12px;letter-spacing:.12em}.code{font-size:2rem;font-weight:700;letter-spacing:.18em}small{color:#667}#status{white-space:pre-wrap}</style></head><body><main class="card"><h1>GOLD FIRST｜管理者ログイン検証</h1><p><small>検証専用。既存の承認画面は変更しません。</small></p><section id="pwa"><p>ホーム画面アプリから開始し、表示された12桁の番号をLINE認証画面で入力してください。</p><button id="begin">ログイン開始</button><p class="code" id="code"></p><p id="expires"></p><p><a class="action" id="openAuth" href="pwa-line-authorize.html" target="_blank" rel="noopener" hidden>LINE認証画面を開く</a></p><button id="check" hidden>ログイン状態を確認</button><button id="logout" hidden>ログアウト</button></section><p id="status" role="status"></p></main>
<script>
"use strict";
const API="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-pwa-pairing";
const TOKEN_KEY="gf_admin_pwa_session_v1",VERIFIER_KEY="gf_admin_pwa_verifier_v1";
const el=id=>document.getElementById(id);
const status=s=>el("status").textContent=s;
const post=async body=>{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"通信エラー");return d};
const randomHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");
const session=()=>localStorage.getItem(TOKEN_KEY);
let polling=false;
async function check(){const token=session();if(!token){status("未ログインです");return}try{await post({action:"check",session_token:token});el("check").hidden=false;el("logout").hidden=false;status("この端末のログイン状態は有効です（検証用）")}catch(e){localStorage.removeItem(TOKEN_KEY);el("logout").hidden=true;status("再認証が必要です："+e.message)}}
async function poll(){if(polling)return;polling=true;const verifier=sessionStorage.getItem(VERIFIER_KEY);if(!verifier){polling=false;return}try{const d=await post({action:"poll",verifier});if(d.status==="approved"&&d.session_token){localStorage.setItem(TOKEN_KEY,d.session_token);sessionStorage.removeItem(VERIFIER_KEY);el("code").textContent="";el("openAuth").hidden=true;status("本人確認が完了しました");await check()}else{status("LINE認証の完了を待っています…")}}catch(e){status(e.message)}finally{polling=false}}
el("begin").onclick=async()=>{try{const verifier=randomHex(32);const d=await post({action:"begin",verifier});sessionStorage.setItem(VERIFIER_KEY,verifier);el("code").textContent=d.code;el("expires").textContent="有効期限：5分";el("openAuth").hidden=false;status("LINE認証画面を開いて12桁の番号を入力してください")}catch(e){status(e.message)}};
el("check").onclick=check;
el("logout").onclick=async()=>{const token=session();localStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(VERIFIER_KEY);el("logout").hidden=true;el("check").hidden=true;if(token)try{await post({action:"logout",session_token:token})}catch{}status("ログアウトしました")};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sessionStorage.getItem(VERIFIER_KEY))poll()});
if(session())check();else status("ログインを開始してください");
setInterval(()=>{if(!document.hidden&&sessionStorage.getItem(VERIFIER_KEY))poll()},4000);
</script></body></html>
