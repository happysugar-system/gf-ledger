<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜LINE本人確認</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;padding:20px;color:#172333}.card{background:white;border-radius:14px;padding:22px;max-width:460px;margin:30px auto}input{font-size:1.5rem;letter-spacing:.18em;width:94%;padding:12px}button{background:#06c755;color:white;border:0;border-radius:9px;padding:14px 18px;font-size:1rem;margin-top:12px}</style></head><body><main class="card"><h1>LINE本人確認</h1><p>ホーム画面アプリに表示された12桁の番号を入力してください。</p><input id="code" inputmode="numeric" maxlength="12" pattern="[0-9]{12}" autocomplete="off" placeholder="12桁の番号"><button id="approve" disabled>本人確認して承認</button><p id="status" role="status">LINEログインを確認しています…</p><small>番号を他人に教えないでください。</small></main><script>
"use strict";
const LIFF_ID="2012058414-jYEPzMww",API="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-pwa-pairing";
const status=s=>document.getElementById("status").textContent=s;
const button=document.getElementById("approve");
(async()=>{try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){status("LINEでログインしてください");const login=document.createElement("button");login.textContent="LINEログイン";login.onclick=()=>liff.login({redirectUri:location.origin+location.pathname});document.querySelector(".card").append(login);return}button.disabled=false;status("番号を入力して承認してください")}catch(e){status("LINE認証の準備に失敗しました："+e.message)}})();
button.onclick=async()=>{const code=document.getElementById("code").value.trim();if(!/^[0-9]{12}$/.test(code)){status("12桁の数字を入力してください");return}const token=liff.getIDToken();if(!token){status("LINE認証情報がありません。再ログインしてください");return}button.disabled=true;try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"authorize",code,line_id_token:token}),cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"承認できませんでした");status("本人確認が完了しました。ホーム画面アプリに戻ってください")}catch(e){status(e.message);button.disabled=false}};
</script></body></html>
