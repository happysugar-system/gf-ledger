<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 法人担当者申請</title><style>body{margin:0;background:#f3f7fa;font:16px system-ui,sans-serif;color:#1b394c}header{background:#12344d;color:white;padding:20px}main{max-width:560px;margin:25px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:24px}label{display:block;margin:15px 0}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #b6c7d2;border-radius:8px;font:inherit}button{background:#176d9a;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit}button:disabled{opacity:.5}#status{white-space:pre-wrap;color:#305c7b;margin:14px 0}</style><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><header>GOLD FIRST｜法人担当者登録</header><main><div class="card"><h2>法人担当者の登録申請</h2><p>メールアドレス不要。LINEで本人確認して申請します。GOLD FIRSTの承認後に利用できます。</p><form id="form"><p>招待された法人：<strong id="company">確認中…</strong></p><label>担当者名<input id="representative" maxlength="100" required autocomplete="name"></label><label>電話番号<input id="phone" type="tel" maxlength="25" required autocomplete="tel"></label><button id="submit" type="submit">LINEで申請する</button></form><p id="status" role="status"></p></div></main><script>
const endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-member-apply-demo",liffId="2012058414-jYEPzMww";
const status=document.getElementById("status"),form=document.getElementById("form"),invite_token=new URLSearchParams(location.search).get("invite");
async function call(action,data={}){const token=liff.getIDToken();if(!token)throw Error("LINE認証トークンを取得できません");const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({line_id_token:token,action,...data})});const j=await r.json();if(!r.ok)throw Error(j.error||"処理に失敗しました");return j}
async function init(){await liff.init({liffId});if(!liff.isLoggedIn()){status.textContent="LINEでログインしてください。";return;}if(!invite_token)throw Error("GOLD FIRSTから発行された招待リンクで開いてください。");const d=await call("invite_info",{invite_token});document.getElementById("company").textContent=d.company_name;const state=await call("status");if(state.status!=="none")status.textContent={pending:"申請済みです。GOLD FIRSTの承認をお待ちください。",approved:"登録済みです。",rejected:"申請は承認されていません。",disabled:"利用停止中です。"}[state.status]||state.status}
form.addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("submit");button.disabled=true;try{if(!liff.isLoggedIn()){liff.login({redirectUri:location.origin+location.pathname});return;}const d=await call("apply",{invite_token,representative_name:document.getElementById("representative").value,phone:document.getElementById("phone").value});status.textContent=d.status==="pending"?"申請を受け付けました。管理者の承認をお待ちください。":"処理が完了しました"}catch(e){status.textContent="エラー："+e.message}finally{button.disabled=false}});
init().catch(e=>{status.textContent="エラー："+e.message;document.getElementById("submit").disabled=true;});
</script></body></html>
