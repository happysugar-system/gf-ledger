<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 法人担当者申請</title><style>body{margin:0;background:#f3f7fa;font:16px system-ui,sans-serif;color:#1b394c}header{background:#12344d;color:white;padding:20px}main{max-width:560px;margin:25px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:24px}label{display:block;margin:15px 0}input,select{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #b6c7d2;border-radius:8px;font:inherit}button{background:#176d9a;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit}button:disabled{opacity:.5}#status{white-space:pre-wrap;color:#305c7b;margin:14px 0}</style><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><header>GOLD FIRST｜法人担当者登録</header><main><div class="card"><h2>法人担当者の登録申請</h2><p>メールアドレス不要。会社名・担当者名・電話番号を入力し、LINEで申請します。所属法人はGOLD FIRSTが確認して承認します。</p><form id="form"><label>会社名<input id="company" maxlength="120" required placeholder="例：UP\u0027s" autocomplete="organization"></label><label>担当者名<input id="representative" maxlength="100" required autocomplete="name"></label><label>電話番号<input id="phone" type="tel" maxlength="25" required autocomplete="tel"></label><button id="submit" type="submit">LINEで申請する</button></form><p id="status" role="status"></p><div id="demoResetArea" hidden style="margin-top:30px;padding:18px;border:1px dashed #d6a5a5;border-radius:12px;background:#fff8f8"><p style="font-size:14px;line-height:1.8">【デモ・テスト専用】ログイン中のLINEアカウント自身の法人担当者紐づけと申請状態を解除します。解除後は別の法人へ再申請できます（管理者の承認が必要）。会社・車両情報、GF管理者権限は変更されません。</p><button id="demoResetCompany" type="button" style="background:#a33d3d">テスト用：法人の紐付けを解除する</button><p id="demoResetMessage" role="status"></p><p style="font-size:13px;line-height:1.7">解除後は上のフォームから別法人へ申請できます。承認されるまでは車両情報を閲覧できません。</p><button id="demoRefreshStatus" type="button" style="background:#536f82">登録状態を再確認</button></div></div></main><script>
const endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-member-apply-demo",liffId="2012058414-jYEPzMww";
const status=document.getElementById("status"),form=document.getElementById("form");
async function call(action,data={}){const token=liff.getIDToken();if(!token)throw Error("LINE認証トークンを取得できません");const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({line_id_token:token,action,...data})});const j=await r.json();if(!r.ok)throw Error(j.error||"処理に失敗しました");return j}
async function refreshStatus(){const state=await call("status");document.getElementById("demoResetArea").hidden=false;document.getElementById("demoResetCompany").disabled=state.status==="none";document.getElementById("demoResetMessage").textContent=state.status==="none"?"現在、このLINEアカウントに解除対象のデモ登録はありません。":"現在の登録状態："+({pending:"承認待ち",approved:"登録済み",rejected:"却下",disabled:"停止中"}[state.status]||state.status);if(state.status!=="none")status.textContent={pending:"申請済みです。GOLD FIRSTの承認をお待ちください。",approved:"登録済みです。",rejected:"申請は承認されていません。",disabled:"利用停止中です。"}[state.status]||state.status;else status.textContent="未登録です。上のフォームから申請できます。";}
async function init(){await liff.init({liffId});if(!liff.isLoggedIn()){status.textContent="LINEでログインしてください。";return;}await refreshStatus();}
document.getElementById("demoRefreshStatus").addEventListener("click",async()=>{const b=document.getElementById("demoRefreshStatus");b.disabled=true;try{await refreshStatus()}catch(e){status.textContent="状態確認エラー："+e.message}finally{b.disabled=false}});
document.getElementById("demoResetCompany").addEventListener("click",async()=>{if(!confirm("【デモ専用】このLINEアカウントの法人担当者登録・申請状態を解除します。再度初回登録が必要になります。実行しますか？"))return;const button=document.getElementById("demoResetCompany"),message=document.getElementById("demoResetMessage");button.disabled=true;message.textContent="解除しています…";try{if(!liff.isLoggedIn())throw Error("LINEでログインしてください");const token=liff.getIDToken();if(!token)throw Error("LINE認証情報を取得できません");const response=await fetch("https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-member-demo-reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset_demo_company_member",confirm:"RESET_DEMO_COMPANY_MEMBER",line_id_token:token})});const result=await response.json().catch(()=>({}));if(!response.ok||result.reset!==true)throw Error(result.error||"解除できませんでした");message.textContent="解除しました。初回登録画面に戻ります…";location.replace(location.pathname+"?reset="+Date.now());}catch(e){message.textContent="エラー："+e.message;button.disabled=false;}});
form.addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("submit");button.disabled=true;try{if(!liff.isLoggedIn()){liff.login({redirectUri:location.origin+location.pathname+location.search});return;}const d=await call("apply",{company_name:document.getElementById("company").value,representative_name:document.getElementById("representative").value,phone:document.getElementById("phone").value});status.textContent=d.status==="pending"?"申請を受け付けました。管理者の承認をお待ちください。":"処理が完了しました"}catch(e){status.textContent="エラー："+e.message}finally{button.disabled=false}});
init().catch(e=>{status.textContent="エラー："+e.message;document.getElementById("submit").disabled=true;});
</script></body></html>
