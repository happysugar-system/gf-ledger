<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜LINEテスト紐づけ</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>body{margin:0;background:#f3f7fb;color:#18364b;font:16px system-ui,sans-serif}header{background:#123650;color:white;padding:20px}main{max-width:580px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:22px;margin:16px 0}select,button{font:inherit;padding:12px;border-radius:8px}select{width:100%;border:1px solid #b8c9d5}button{background:#176e9b;color:white;border:0;margin:10px 8px 0 0}button:disabled{opacity:.45}.danger{background:#a84343}.muted{color:#5b7487}#message{white-space:pre-wrap}</style></head><body><header><h2>GOLD FIRST｜LINEテスト紐づけ</h2></header><main><section class="card"><strong>デモ専用・管理者本人のみ</strong><p class="muted">本番の法人担当者登録・車両閲覧権限は変更されません。テスト用の紐づけのみ保存します。</p><button id="login">LINEで本人確認</button><p id="message" role="status">認証待ち</p></section><section id="workspace" class="card" hidden><h3>現在のテスト法人</h3><p id="current">未紐づけ</p><label>テスト法人を選択<select id="company"><option value="TEST-A">テスト法人A</option><option value="TEST-B">テスト法人B</option></select></label><button id="link">紐づけ・切替</button><button id="unlink" class="danger">解除</button><button id="refresh">最新状態を確認</button><p class="muted">解除後、別法人への再紐づけを繰り返せます。実際の車両一覧には影響しません。</p></section></main><script>
const liffId="2012058414-jYEPzMww",endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-line-test-link";
const $=id=>document.getElementById(id);let busy=false;
async function call(action,company_code){const token=liff.getIDToken();if(!token)throw Error("LINEの認証情報を取得できません");const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,company_code,line_id_token:token})});const data=await res.json();if(!res.ok)throw Error(data.error||"処理に失敗しました");if(data.test_mode!==true)throw Error("テスト環境の確認に失敗しました");return data}
function render(data){$("workspace").hidden=false;$("current").textContent=data.company_name||"未紐づけ";$("unlink").disabled=!data.company_code;if(data.company_code)$("company").value=data.company_code;$("message").textContent="テスト専用APIに接続しました。"}
async function run(action){if(busy)return;busy=true;["link","unlink","refresh"].forEach(id=>$(id).disabled=true);$("message").textContent="確認中…";try{render(await call(action==="refresh"?"status":action,$("company").value))}catch(e){$("message").textContent="エラー："+e.message}finally{busy=false;$("link").disabled=false;$("refresh").disabled=false}}
async function login(){try{await liff.init({liffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.origin+location.pathname});return;}await run("refresh")}catch(e){$("message").textContent="認証エラー："+e.message}}
$("login").onclick=login;$("link").onclick=()=>run("link");$("unlink").onclick=()=>{if(confirm("テスト専用のLINE紐づけを解除しますか？"))run("unlink")};$("refresh").onclick=()=>run("refresh");login();
</script></body></html>
