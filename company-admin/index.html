<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 法人管理</title><style>body{margin:0;background:#f4f7fb;color:#183449;font:16px system-ui,sans-serif}header{background:#12344d;color:white;padding:20px}main{max-width:980px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:20px;margin:16px 0}h1{font-size:23px;margin:0}h2{font-size:19px}button{border:0;background:#176d9a;color:white;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5}input{padding:11px;border:1px solid #b9cbd8;border-radius:8px;font:inherit;max-width:420px;width:100%;box-sizing:border-box}form{display:flex;gap:8px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e6edf2}small,.muted{color:#62788a}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#e7eef5;color:#24516b}.tabs button.active{background:#176d9a;color:white}section[hidden]{display:none}.danger{background:#a53f3f}.status{padding:12px;background:#eef5fa;border-radius:9px;margin:12px 0;white-space:pre-wrap}.scroll{overflow:auto}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style id="gf-mobile-theme">
html,body{background:#fff;color:#303438;max-width:100%;overflow-x:hidden}
header{background:#fff;color:#333;border-bottom:2px solid #e9d9b2;padding:16px}
header a{color:#866628!important}header h1{color:#333;font-size:21px}

@media(max-width:700px){main{padding:0 10px 80px}.card{padding:13px;margin:12px 0}h1{font-size:21px}h2{font-size:18px}.tabs button{padding:10px 12px;font-size:14px}td,th{padding:9px 8px}button{font-size:14px}#emailAuth input{width:100%;max-width:none}#emailAuth button{margin-top:8px;width:100%}}
</style><script>
(function(){
  // Corporate LIFF endpoint shares this directory with staff administration.
  // Route the LIFF deep-link state BEFORE displaying staff-only login.
  const q=new URLSearchParams(location.search);
  const decode=(v)=>{try{return decodeURIComponent(v)}catch{return v}};
  const raw=[location.search,q.get('liff.state')||'',q.get('state')||''].map(decode).join('&');
  const stateQuery=new URLSearchParams((q.get('liff.state')||'').replace(/^\?/,''));
  let target=q.get('member')||stateQuery.get('member')||
    (/member-vehicles(?:\.html)?/.test(raw)?'vehicles':/member-apply(?:\.html)?/.test(raw)?'apply':null);
  // Keep the requested corporate page through LINE's authentication round trip.
  const key='gf_corporate_liff_target_v2';
  if(target==='vehicles'||target==='apply')sessionStorage.setItem(key,target);
  else if(q.has('liffClientId')||q.has('liff.state')||q.has('code'))target=sessionStorage.getItem(key);
  if(target==='vehicles'||target==='apply'){
    const dest=new URL(target==='vehicles'?'./member-vehicles.html':'./member-apply.html',location.href);
    for(const k of ['liffClientId','liffRedirectUri','code','state','friendship_status_changed']){
      if(q.has(k))dest.searchParams.set(k,q.get(k));
    }
    location.replace(dest.href);
    return;
  }
  // A LIFF redirect must never expose the GF staff login as a corporate page.
  if(q.has('liffClientId')||q.has('liff.state')){
    document.addEventListener('DOMContentLoaded',()=>{
      document.body.innerHTML='<main style="max-width:520px;margin:24px auto;padding:18px;font:16px system-ui"><h2>GOLD FIRST｜法人担当者</h2><p>ご利用のメニューを選んでください。</p><p><a href="./?member=vehicles" style="display:block;padding:16px;background:#f8f4eb;border-radius:12px">法人担当者マイページ</a></p><p><a href="./?member=apply" style="display:block;padding:16px;background:#f8f4eb;border-radius:12px">新規登録</a></p></main>';
    });
  }
})();
</script></head><body><header><a href="../index.html" style="display:inline-block;margin-bottom:12px;color:#fff;text-decoration:underline">← 業務システムのトップへ戻る</a><h1>GOLD FIRST 法人管理</h1></header><main><div class="card"><div id="emailAuth"><input id="email" type="email" autocomplete="email" placeholder="管理者メールアドレス"><button id="login">メールで認証コードを受け取る</button><div id="otpFields" hidden><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="メールに届いた認証コード"><button id="verify">コードでログイン</button></div></div><div class="status" id="message" role="status">ログインしてください。</div></div><div id="workspace" hidden><div class="tabs" role="tablist"><button class="active" data-tab="requests">担当者の承認</button><button data-tab="companies">法人管理</button><button data-tab="members">登録済み担当者</button></div><section id="companies" class="card" hidden><h2>法人一覧</h2><p class="muted">車両台帳「所属会社名」の件数を表示しています。不要な会社名は「一覧から除外」で非表示にできます（元の台帳は変更されません）。</p><div class="scroll"><table><thead><tr><th>法人名</th><th>台帳の車両台数</th><th>操作</th></tr></thead><tbody id="companyRows"></tbody></table></div><h2>除外済みの法人名（いつでも復元できます）</h2><p class="muted">「一覧に戻す」を押すと、上の法人一覧に再表示します。</p><div class="scroll"><table><thead><tr><th>除外した名前</th><th>台帳の車両台数</th><th>操作</th></tr></thead><tbody id="hiddenAffiliationRows"></tbody></table></div></section><section id="requests" class="card"><h2>担当者の登録申請</h2><p class="muted">LINEで申請した担当者を確認し、所属法人を確認してから承認してください。</p><div class="scroll"><table><thead><tr><th>担当者</th><th>申請会社名</th><th>電話番号</th><th>状態</th><th>承認先・操作</th></tr></thead><tbody id="requestRows"></tbody></table></div></section><section id="members" class="card" hidden><h2>登録済み担当者</h2><div class="scroll"><table><thead><tr><th>担当者</th><th>法人</th><th>電話番号</th><th>状態</th><th>操作</th></tr></thead><tbody id="memberRows"></tbody></table></div></section></div></main><script>
const endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-api-demo";
const client=supabase.createClient("https://tgxrnrqxafytyqfwwsag.supabase.co","sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW");
const msg=document.getElementById("message"),workspace=document.getElementById("workspace");
let state={companies:[],requests:[],members:[],vehicleCounts:[],candidates:[]};
function el(tag,value){const e=document.createElement(tag);e.textContent=value??"";return e;}
function td(row,value){row.append(el("td",value));}
function name(id){return state.companies.find(c=>c.id===id)?.company_name||"未登録の法人";}
async function call(action,fields={}){
 const {data:{session}}=await client.auth.getSession();const token=session?.access_token;if(!token)throw Error("管理者メールでログインしてください。");
 const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...fields})});
 const data=await res.json();if(!res.ok)throw Error(data.error||"処理に失敗しました");return data;
}
async function load(){
 const data=await call("dashboard");state=data;workspace.hidden=false;msg.textContent="メール認証済み（スタッフ管理者）";document.getElementById("emailAuth").hidden=true;render();
}
function render(){
 const companies=document.getElementById("companyRows"),hidden=document.getElementById("hiddenAffiliationRows");companies.replaceChildren();hidden.replaceChildren();
 const candidates=state.candidates||[],aliases=state.aliases||[];
 function matching(c){return candidates.filter(a=>a.affiliation===c.company_name||aliases.some(x=>x.company_id===c.id&&x.source_affiliation===a.affiliation));}
 function addToggle(cell,items,hiddenState){
  const button=el("button",hiddenState?"一覧に戻す":"一覧から除外");if(!hiddenState)button.className="danger";
  button.addEventListener("click",async()=>{
   if(!hiddenState&&!confirm("「"+items.map(x=>x.affiliation).join("・")+"」を一覧から除外しますか？"))return;
   button.disabled=true;
   try{
    for(const item of items)await call("set_affiliation_hidden",{affiliation:item.affiliation,hidden:!hiddenState});
    await load();
   }catch(e){msg.textContent="エラー："+e.message;button.disabled=false;}
  });cell.append(button);
 }


 // Persistent, staff-editable display names. Never change ledger affiliations or member company IDs.
 const overrides=new Map((state.displayOverrides||[]).map(x=>[x.source_affiliation,x.display_name]));
 const rowMap=new Map();
 for(const item of candidates){
   const label=overrides.get(item.affiliation)||item.affiliation;
   if(!rowMap.has(label))rowMap.set(label,[]);
   rowMap.get(label).push(item);
 }
 for(const c of state.companies){
   const label=overrides.get(c.company_name)||c.company_name;
   if(!rowMap.has(label))rowMap.set(label,[]);
 }
 const rows=[...rowMap].map(([label,items])=>({label,items,excluded:items.length>0&&items.every(x=>x.hidden)}));
 rows.sort((a,b)=>a.label.localeCompare(b.label,"ja"));
 function editButton(label,items,actions){
   const edit=el("button","名前を変更");
   edit.style.margin="3px";
   edit.addEventListener("click",async()=>{
     const next=prompt("法人管理画面で表示する会社名を入力してください。車両台帳は変更しません。",label);
     if(next===null)return;
     const name=next.trim();
     if(!name||name.length>120){alert("会社名は1〜120文字で入力してください");return;}
     if(name===label)return;
     if(!confirm("「"+label+"」を「"+name+"」に変更しますか？同じ名前の法人は一覧で統合表示されます。"))return;
     edit.disabled=true;
     try{
       for(const item of items)await call("set_display_name",{source_affiliation:item.affiliation,display_name:name});
       await load();msg.textContent="表示名を保存しました（車両台帳は変更していません）";
     }catch(e){msg.textContent="変更できませんでした："+e.message;edit.disabled=false;}
   });actions.append(edit);
   const merge=el("button","別の名前と統合");
   merge.style.margin="3px";
   merge.addEventListener("click",async()=>{
     const choices=rows.filter(x=>x.label!==label&&x.items.length).map(x=>x.label);
     if(!choices.length){alert("統合先がありません");return;}
     const selected=prompt("統合先の表示名を入力してください。\n候補：\n"+choices.join(" / "));
     if(selected===null)return;
     const target=selected.trim();
     if(!choices.includes(target)){alert("候補にある会社名を正確に入力してください");return;}
     if(!confirm("「"+label+"」を「"+target+"」へ統合表示しますか？元の台帳や担当者の権限は変更しません。"))return;
     merge.disabled=true;
     try{
       for(const item of items)await call("set_display_name",{source_affiliation:item.affiliation,display_name:target});
       await load();msg.textContent="法人一覧の統合表示を保存しました";
     }catch(e){msg.textContent="統合できませんでした："+e.message;merge.disabled=false;}
   });actions.append(merge);
   if(items.some(x=>overrides.has(x.affiliation))){
     const reset=el("button","元の表示に戻す");
     reset.style.margin="3px";
     reset.addEventListener("click",async()=>{
       if(!confirm("この表示名の変更・統合を解除しますか？"))return;
       reset.disabled=true;
       try{
         for(const item of items)await call("reset_display_name",{source_affiliation:item.affiliation});
         await load();msg.textContent="元の表示に戻しました";
       }catch(e){msg.textContent="戻せませんでした："+e.message;reset.disabled=false;}
     });actions.append(reset);
   }
 }
 for(const entry of rows){
   const tr=el("tr");td(tr,entry.label);
   td(tr,String(entry.items.reduce((sum,x)=>sum+(Number(x.vehicle_count)||0),0)));
   const actions=el("td");
   if(entry.items.length>1){const note=el("small","表記違い "+entry.items.length+"件を統合表示");actions.append(note,document.createElement("br"));}
   if(entry.items.length){
     editButton(entry.label,entry.items,actions);
     addToggle(actions,entry.items,entry.excluded);
   }
   tr.append(actions);
   (entry.excluded?hidden:companies).append(tr);
 }

 const requests=document.getElementById("requestRows");requests.replaceChildren();
 state.requests.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)).forEach(r=>{
 const tr=el("tr");td(tr,r.representative_name);td(tr,r.requested_company_name||name(r.company_id));td(tr,r.phone);td(tr,r.status==="pending"?"承認待ち":r.status==="approved"?"承認済み":"却下");
 const actions=el("td");let companySelect=null;if(r.status==="pending"){companySelect=document.createElement("select");companySelect.style.marginRight="8px";companySelect.style.padding="8px";companySelect.append(new Option("承認先法人を選択",""));state.companies.filter(c=>!(state.candidates||[]).some(a=>a.affiliation===c.company_name&&a.hidden)).forEach(c=>companySelect.add(new Option(c.company_name,c.id)));if(r.company_id)companySelect.value=r.company_id;actions.append(companySelect);for(const [decision,label,css] of [["approved","承認",""],["rejected","却下","danger"]]){const b=el("button",label);if(css)b.className=css;b.style.marginRight="6px";b.addEventListener("click",async()=>{if(decision==="approved"&&!companySelect.value){msg.textContent="承認先法人を選択してください";return;}if(!confirm(r.representative_name+"さんの申請会社名「"+(r.requested_company_name||"")+"」を確認し、"+(decision==="approved"?name(companySelect.value)+"に承認":"却下")+"しますか？"))return;b.disabled=true;try{await call("review_request",{request_id:r.id,decision,approved_company_id:companySelect?.value||null});await load()}catch(e){msg.textContent="エラー："+e.message;b.disabled=false}});actions.append(b)}}tr.append(actions);requests.append(tr)});
 const members=document.getElementById("memberRows");members.replaceChildren();state.members.forEach(m=>{const tr=el("tr");td(tr,m.representative_name);td(tr,name(m.company_id));td(tr,m.phone);td(tr,m.active?"有効":"停止中");const actions=el("td");const unlink=el("button","LINE紐付け解除");unlink.className="danger";unlink.addEventListener("click",async()=>{if(!confirm(m.representative_name+"さんのLINE紐付けを解除しますか？ 再登録が必要になります。"))return;unlink.disabled=true;try{await call("unlink_member",{member_line_id:m.line_user_id});await load();msg.textContent="LINE紐付けを解除しました";}catch(e){msg.textContent="エラー："+e.message;unlink.disabled=false;}});actions.append(unlink);tr.append(actions);members.append(tr)});
}
function selectTab(tab){document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));document.querySelectorAll("section").forEach(s=>s.hidden=s.id!==tab)}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>selectTab(b.dataset.tab)));
const requestedTab=new URLSearchParams(location.search).get("tab");if(["companies","requests","members"].includes(requestedTab))selectTab(requestedTab);
document.getElementById("login").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim();
 if(!email){msg.textContent="メールアドレスを入力してください";return;}
 msg.textContent="認証コードを送信しています…";
 const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
 if(error){msg.textContent="送信できませんでした："+error.message;return;}
 document.getElementById("otpFields").hidden=false;msg.textContent="メールに届いたコードを入力してください";
});
document.getElementById("verify").addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim(),token=document.getElementById("otp").value.trim();
 const {error}=await client.auth.verifyOtp({email,token,type:"email"});
 if(error){msg.textContent="認証エラー："+error.message;return;}
 try{await load()}catch(e){msg.textContent="管理者確認エラー："+e.message}
});
(async()=>{try{
 const {data:{session},error}=await client.auth.getSession();
 if(error)throw error;
 if(session){
   document.getElementById("emailAuth").hidden=true;
   msg.textContent="ログイン済みです。法人管理のデータを読み込んでいます…";
   try{await load()}catch(e){
     msg.textContent="法人管理データを取得できませんでした。通信状態を確認して、もう一度お試しください。";
     const retry=el("button","再読み込み");retry.addEventListener("click",()=>load().catch(()=>{msg.textContent="再取得に失敗しました。管理者にお問い合わせください。";}));
     msg.append(document.createElement("br"),retry);
     console.error("法人管理データ取得失敗",e);
   }
 }else msg.textContent="スタッフ管理者メールでログインしてください";
}catch(e){msg.textContent="ログイン状態を確認できませんでした。トップ画面から開き直してください。";console.error(e)}})();
</script></body></html>
