<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 法人管理</title><style>body{margin:0;background:#f4f7fb;color:#183449;font:16px system-ui,sans-serif}header{background:#12344d;color:white;padding:20px}main{max-width:980px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:20px;margin:16px 0}h1{font-size:23px;margin:0}h2{font-size:19px}button{border:0;background:#176d9a;color:white;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5}input{padding:11px;border:1px solid #b9cbd8;border-radius:8px;font:inherit;max-width:420px;width:100%;box-sizing:border-box}form{display:flex;gap:8px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e6edf2}small,.muted{color:#62788a}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#e7eef5;color:#24516b}.tabs button.active{background:#176d9a;color:white}section[hidden]{display:none}.danger{background:#a53f3f}.status{padding:12px;background:#eef5fa;border-radius:9px;margin:12px 0;white-space:pre-wrap}.scroll{overflow:auto}</style><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><header><h1>GOLD FIRST 法人管理</h1><div>LINE認証・デモ環境</div></header><main><div class="card"><button id="login">LINEで管理者ログイン</button><div class="status" id="message" role="status">ログインしてください。</div><small>管理者に登録されたLINEアカウントのみ利用可能。操作はサーバーで権限確認されます。</small></div><div id="workspace" hidden><div class="tabs" role="tablist"><button class="active" data-tab="companies">法人管理</button><button data-tab="requests">担当者の承認</button><button data-tab="members">登録済み担当者</button></div><section id="companies" class="card"><h2>法人登録</h2><form id="companyForm"><input id="companyName" maxlength="120" required minlength="2" placeholder="会社名" aria-label="会社名"><button type="submit">法人を登録</button></form><h2>登録済み法人</h2><div class="scroll"><table><thead><tr><th>会社名</th><th>車両件数</th></tr></thead><tbody id="companyRows"></tbody></table></div></section><section id="requests" class="card" hidden><h2>担当者の登録申請</h2><p class="muted">LINEで申請した担当者を確認し、所属法人を確認してから承認してください。</p><div class="scroll"><table><thead><tr><th>担当者</th><th>法人</th><th>電話番号</th><th>状態</th><th>操作</th></tr></thead><tbody id="requestRows"></tbody></table></div></section><section id="members" class="card" hidden><h2>登録済み担当者</h2><div class="scroll"><table><thead><tr><th>担当者</th><th>法人</th><th>電話番号</th><th>状態</th></tr></thead><tbody id="memberRows"></tbody></table></div><p class="muted">法人別の車両表示は別途LINE利用者用の閲覧APIと接続します。既存のメール認証版法人ポータルとはまだ連携していません。</p></section></div></main><script>
const liffId="2012058414-jYEPzMww",endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-api-demo";
const msg=document.getElementById("message"),workspace=document.getElementById("workspace");
let state={companies:[],requests:[],members:[],vehicleCounts:[]};
function el(tag,value){const e=document.createElement(tag);e.textContent=value??"";return e;}
function td(row,value){row.append(el("td",value));}
function name(id){return state.companies.find(c=>c.id===id)?.company_name||"未登録の法人";}
async function call(action,fields={}){
 const token=liff.getIDToken();if(!token)throw Error("LINEのIDトークンを取得できません。");
 const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({line_id_token:token,action,...fields})});
 const data=await res.json();if(!res.ok)throw Error(data.error||"処理に失敗しました");return data;
}
async function load(){
 const data=await call("dashboard");state=data;workspace.hidden=false;msg.textContent="管理者認証済み（"+(data.role==="owner"?"最高管理者":"管理者")+"）";render();
}
function render(){
 const companies=document.getElementById("companyRows");companies.replaceChildren();
 state.companies.forEach(c=>{const tr=el("tr");td(tr,c.company_name);td(tr,String(state.vehicleCounts.find(v=>v.company_id===c.id)?.count||0));companies.append(tr)});
 const requests=document.getElementById("requestRows");requests.replaceChildren();
 state.requests.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)).forEach(r=>{
 const tr=el("tr");td(tr,r.representative_name);td(tr,name(r.company_id));td(tr,r.phone);td(tr,r.status==="pending"?"承認待ち":r.status==="approved"?"承認済み":"却下");
 const actions=el("td");if(r.status==="pending"){for(const [decision,label,css] of [["approved","承認",""],["rejected","却下","danger"]]){const b=el("button",label);if(css)b.className=css;b.style.marginRight="6px";b.addEventListener("click",async()=>{if(!confirm(r.representative_name+"さんを"+name(r.company_id)+"として"+label+"しますか？"))return;b.disabled=true;try{await call("review_request",{request_id:r.id,decision});await load()}catch(e){msg.textContent="エラー："+e.message;b.disabled=false}});actions.append(b)}}tr.append(actions);requests.append(tr)});
 const members=document.getElementById("memberRows");members.replaceChildren();state.members.forEach(m=>{const tr=el("tr");td(tr,m.representative_name);td(tr,name(m.company_id));td(tr,m.phone);td(tr,m.active?"有効":"停止中");members.append(tr)});
}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll("section").forEach(s=>s.hidden=s.id!==b.dataset.tab)}));
document.getElementById("login").addEventListener("click",async()=>{msg.textContent="LINEで本人確認しています…";try{await liff.init({liffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.origin+location.pathname});return;}await load()}catch(e){msg.textContent="エラー："+e.message}});
document.getElementById("companyForm").addEventListener("submit",async e=>{e.preventDefault();const button=e.target.querySelector("button");button.disabled=true;try{await call("create_company",{company_name:document.getElementById("companyName").value});document.getElementById("companyName").value="";await load()}catch(err){msg.textContent="エラー："+err.message}finally{button.disabled=false}});
(async()=>{try{await liff.init({liffId});if(liff.isLoggedIn())await load()}catch(e){msg.textContent="LINEログイン待ち："+e.message}})();
</script></body></html>
