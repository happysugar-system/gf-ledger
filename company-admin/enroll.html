<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 管理者登録申請</title><style>body{background:#f3f6fa;color:#17354c;font:16px system-ui,sans-serif;margin:0}header{background:#12334d;color:white;padding:22px}main{max-width:560px;margin:30px auto;padding:0 18px}.card{background:white;border-radius:14px;padding:24px;box-shadow:0 2px 10px #1d365012}button{background:#126e9c;border:0;color:white;border-radius:9px;padding:13px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.7}.hint{color:#657685}</style><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><header><strong>GOLD FIRST</strong>｜管理者登録申請</header><main><div class="card"><h1>LINEで本人確認</h1><p>現在のLINEアカウントで管理者登録を申請します。申請しただけでは管理者権限は付与されません。</p><button id="start">LINEで登録申請</button><p id="status" role="status"></p><p class="hint">デモ環境専用。車両情報へのアクセス権は、管理者の確認後に設定されます。</p></div></main><script>
const liffId="2012058414-jYEPzMww";
const endpoint="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-enroll-demo";
const button=document.getElementById("start"),status=document.getElementById("status");
const pendingKey="gf_admin_enroll_pending";
const reviewMode=new URLSearchParams(location.search).get("mode")!=="enroll";
async function submitEnrollment(){
 button.disabled=true;status.textContent="LINE認証を確認しています…";
 try{
  await liff.init({liffId});
  if(!liff.isLoggedIn()){
   sessionStorage.setItem(pendingKey,"1");
   liff.login({redirectUri:location.origin+location.pathname});
   return;
  }
  sessionStorage.removeItem(pendingKey);
  const token=liff.getIDToken();
  if(!token)throw Error("LINEのIDトークンが取得できません。LIFFのopenid権限を確認してください。");
  status.textContent="管理者登録申請を送信しています…";
  const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({line_id_token:token})});
  const result=await response.json();
  if(!response.ok)throw Error(result.error||"申請できませんでした");
  status.textContent=result.status==="approved"?"管理者登録済みです。":result.status==="pending"?"申請を受け付けました。権限付与はまだ行われていません。":result.status==="rejected"?"この申請は承認されていません。":"状態を確認できませんでした。";
 }catch(e){status.textContent="エラー："+e.message;sessionStorage.removeItem(pendingKey);}
 finally{button.disabled=false;}
}
button.addEventListener("click",submitEnrollment);
if(!reviewMode && sessionStorage.getItem(pendingKey)==="1"){
 submitEnrollment();
}


if(reviewMode){
 document.title="GOLD FIRST｜法人担当者登録管理";
 document.querySelector("header").innerHTML="<strong>GOLD FIRST</strong>｜法人担当者登録管理";
 const originalCard=document.querySelector(".card");
 originalCard.querySelector("h1").textContent="法人担当者登録管理";
 Array.from(originalCard.children).forEach(x=>{if(x.tagName!=="H1")x.hidden=true});
 originalCard.insertAdjacentHTML("beforeend","<div id=\"reviewApp\" hidden><p class=\"hint\">GOLD FIRST｜スタッフ用・LINE認証</p><p id=\"reviewStatus\" role=\"status\">認証を確認しています…</p><div id=\"reviewPanel\" hidden><p><button id=\"reloadReview\">一覧を更新</button></p><h2>承認待ち申請 <span id=\"pendingCount\"></span></h2><div id=\"pendingList\"></div><h2>承認済み一覧</h2><div id=\"approvedList\"></div><h2>却下済み一覧</h2><div id=\"rejectedList\"></div></div></div>");
 document.getElementById("reviewApp").hidden=false;
 const api="https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-api-demo";
 const byId=id=>document.getElementById(id);
 const status=byId("reviewStatus");
 const text=(tag,value)=>{const x=document.createElement(tag);x.textContent=value??"";return x};
 const date=v=>v?new Date(v).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo"}):"未設定";
 let processing=false,companies=[];
 async function request(action,extra={}){
  const token=liff.getIDToken();
  if(!token)throw Error("LINE認証情報が取得できません");
  const res=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,line_id_token:token,...extra})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw Error(data.error||"処理に失敗しました ("+res.status+")");
  return data;
 }
 async function reload(){
  status.textContent="申請一覧を取得しています…";
  byId("reviewPanel").hidden=true;
  try{
   const data=await request("dashboard");
   companies=data.companies||[];
   const requests=data.requests||[];
   byId("pendingCount").textContent="("+requests.filter(x=>x.status==="pending").length+"件)";
   for(const [id,filter] of [["pendingList","pending"],["approvedList","approved"],["rejectedList","rejected"]]){
    const area=byId(id);area.replaceChildren();
    const items=requests.filter(x=>x.status===filter).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
    if(!items.length){area.append(text("p","該当する申請はありません。"));continue}
    for(const item of items){
     const card=document.createElement("div");card.style.cssText="border:1px solid #d9e3e8;border-radius:10px;padding:14px;margin:12px 0";
     card.append(text("strong",item.representative_name||"氏名未設定"));
     card.append(text("p","申請法人："+(item.requested_company_name||"未入力")));
     card.append(text("p","電話番号："+(item.phone||"未入力")));
     card.append(text("p","申請日時："+date(item.created_at)));
     if(filter==="pending"){
      const label=text("label","承認先の法人");label.style.display="block";
      const select=document.createElement("select");select.style.cssText="display:block;width:100%;padding:10px;margin:8px 0";
      const placeholder=document.createElement("option");placeholder.value="";placeholder.textContent="法人を選択してください";select.append(placeholder);
      for(const company of companies){const opt=document.createElement("option");opt.value=company.id;opt.textContent=company.company_name;select.append(opt)}
      const matching=companies.filter(c=>c.company_name===item.requested_company_name);
      if(matching.length===1)select.value=matching[0].id;
      label.append(select);card.append(label);
      const confirmation=document.createElement("label");confirmation.style.cssText="display:block;margin:10px 0";
      const check=document.createElement("input");check.type="checkbox";
      confirmation.append(check,document.createTextNode(" 本人・所属法人を確認しました"));card.append(confirmation);
      const approve=text("button","承認する"),reject=text("button","却下する");
      approve.disabled=true;check.onchange=()=>approve.disabled=!check.checked||processing;
      reject.style.marginLeft="8px";reject.style.background="#a33";
      const decide=async(decision)=>{
       if(processing)return;
       if(decision==="approved"&&(!check.checked||!select.value)){alert("本人確認と承認先法人の選択が必要です");return}
       if(!confirm((decision==="approved"?"承認":"却下")+"しますか？\n"+(item.representative_name||"")+" / "+(item.requested_company_name||"")))return;
       processing=true;approve.disabled=true;reject.disabled=true;
       try{await request("review_request",{request_id:item.id,decision,...(decision==="approved"?{approved_company_id:select.value}:{})});await reload()}
       catch(e){status.textContent="処理エラー："+e.message;approve.disabled=!check.checked;reject.disabled=false}
       finally{processing=false}
      };
      approve.onclick=()=>decide("approved");reject.onclick=()=>decide("rejected");
      card.append(approve,reject);
     }
     area.append(card);
    }
   }
   status.textContent="法人担当者の登録申請を表示しています。";
   byId("reviewPanel").hidden=false;
  }catch(e){status.textContent="取得できませんでした："+e.message}
 }
 byId("reloadReview").onclick=reload;
 (async()=>{
  try{
   await liff.init({liffId});
   if(!liff.isLoggedIn()){
    status.textContent="LINEでログインしてください。";
    const btn=text("button","LINEでログイン");
    btn.onclick=()=>liff.login({redirectUri:location.origin+location.pathname+location.search});
    byId("reviewApp").append(btn);
    return;
   }
   await reload();
  }catch(e){status.textContent="LINE認証エラー："+e.message}
 })();
}
</script></body></html>
