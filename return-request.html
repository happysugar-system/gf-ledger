<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLD FIRST｜車両返却申込</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#17212e;background:#f4f6fa}*{box-sizing:border-box}
main{max-width:660px;margin:auto;padding:18px 14px 50px}h1{font-size:23px;margin:12px 0 8px}.sub{color:#566477;line-height:1.7}
section{background:white;border:1px solid #e0e5ed;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 2px 8px #00000006}
label{display:block;font-weight:700;margin:13px 0 6px}input,textarea{font:inherit;width:100%;padding:13px;border:1px solid #b8c4d3;border-radius:10px;background:white}
textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slot{border:1px solid #d7e0ec;border-radius:12px;padding:12px;min-width:0}.slot strong{display:block;margin-bottom:8px}.preview{width:100%;height:120px;object-fit:cover;border-radius:9px;background:#e9eef4;display:none}
.pickers{display:flex;gap:6px;margin-top:8px}.pickers button{font-size:12px;flex:1;padding:10px 4px;background:#edf2f9;color:#22334b;border:1px solid #d6e1ed}
button{border:0;border-radius:10px;padding:15px;background:#1e5fae;color:white;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#send{width:100%;margin-top:16px;font-weight:700}
#progress{margin-top:12px;line-height:1.7;font-weight:700;white-space:pre-line}progress{width:100%;height:16px;margin-top:10px}#done{display:none;background:#e8f7ee;padding:14px;border-radius:10px;margin-top:14px}.warning{background:#fff5e5;padding:12px;border-radius:10px;font-size:13px;line-height:1.6}.small{font-size:12px;color:#667488}
@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>🚗 車両返却のお申し込み</h1><p class="sub">必要事項と車両の写真8方向を登録してください。カメラ撮影・保存済み写真のどちらも使えます。</p>
<div class="warning">これは返却の<strong>受付</strong>です。スタッフの確認前に返却完了にはなりません。送信中は画面を閉じずにお待ちください。</div>
<section><h2>お申し込み内容</h2>
<label for="car">車番 *</label><input id="car" placeholder="例：習志野 480 あ 1234" required maxlength="60">
<label for="name">氏名 *</label><input id="name" autocomplete="name" required maxlength="80">
<label for="phone">電話番号 *</label><input id="phone" inputmode="tel" autocomplete="tel" required>
<label for="date">返却希望日 *</label><input id="date" type="date" required>
<label for="memo">備考（任意）</label><textarea id="memo" maxlength="500" placeholder="気になる傷や返却時の連絡事項など"></textarea>
</section><section><h2>車両の写真（8方向）</h2><p class="small">各方向を1枚ずつ選択してください。選択後は画像を確認・差し替えできます。</p><div class="grid" id="slots"></div></section>
<button id="send" type="button">写真8枚を保存して申し込む</button>
<progress id="bar" value="0" max="8" hidden></progress><div id="progress" role="status" aria-live="polite"></div><div id="done">✅ 返却申込を受け付けました。スタッフからの連絡をお待ちください。</div>
<iframe id="transport" name="gf191_transport" hidden title="データ送信"></iframe>
</main><script>
'use strict';
// 車両管理GASの公開デプロイURL（更新時はここだけ変更）
const ENDPOINT='https://script.google.com/macros/s/AKfycbzDrU44saPdqQLxP3yyTPA8UgGkbw0fWSkNcUZp9XCEF2QErzk5uQki4_4eVDVwl4Hw0g/exec';
const DIRS=['正面','右前','右側','右後','後面','左後','左側','左前'];
const token=new URLSearchParams(location.search).get('t')||'';
const files={};const $=id=>document.getElementById(id);
let busy=false;
DIRS.forEach((dir,i)=>{
 const div=document.createElement('div');div.className='slot';
 const title=document.createElement('strong');title.textContent=(i+1)+'. '+dir;
 const img=document.createElement('img');img.className='preview';img.alt=dir+'の選択写真';
 const camera=document.createElement('input');camera.type='file';camera.accept='image/*';camera.setAttribute('capture','environment');camera.hidden=true;
 const library=document.createElement('input');library.type='file';library.accept='image/*';library.hidden=true;
 const buttons=document.createElement('div');buttons.className='pickers';
 for(const [label,input] of [['📷 撮影',camera],['🖼️ 写真から選ぶ',library]]){
   const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{if(!busy)input.click()};buttons.append(b);
   input.addEventListener('change',()=>{const f=input.files&&input.files[0];if(!f)return;files[dir]=f;if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);img.dataset.url=URL.createObjectURL(f);img.src=img.dataset.url;img.style.display='block';$('progress').textContent=dir+'の写真を選択しました';});
 }
 div.append(title,img,buttons,camera,library);$('slots').append(div);
});
function status(s){$('progress').textContent=s}
function randomNonce(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
// CORS制限を避けるため、GASのHTMLレスポンスを非表示iframeで受信する。
// サーバー側の署名検証が認証の本体。nonceとframe sourceは応答の取り違え防止。
function callGAS(action,fields,timeout=120000){return new Promise((resolve,reject)=>{
 const nonce=randomNonce(),frame=$('transport');let settled=false;
 const timer=setTimeout(()=>finish(new Error('通信がタイムアウトしました。もう一度お試しください。')),timeout);
 function finish(err,val){if(settled)return;settled=true;clearTimeout(timer);removeEventListener('message',onMessage);form.remove();err?reject(err):resolve(val)}
 function onMessage(e){if(e.source!==frame.contentWindow)return;const d=e.data;if(!d||d.type!=='GF191_RESULT'||d.nonce!==nonce)return;if(d.payload&&d.payload.ok)finish(null,d.payload.result);else finish(new Error(d.payload?.error||'保存に失敗しました'))}
 addEventListener('message',onMessage);
 const form=document.createElement('form');form.method='POST';form.action=ENDPOINT;form.target='gf191_transport';form.style.display='none';
 for(const [k,v] of Object.entries({gf191_action:action,nonce,...fields})){const input=document.createElement('input');input.name=k;input.value=String(v);form.append(input)}
 document.body.append(form);form.submit();
})}
function readAsDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(Error('写真を読み取れませんでした'));r.readAsDataURL(blob)})}
async function jpegBase64(file){
 // 通常のスマホ写真はブラウザで縮小。HEICなどブラウザが表示できない形式は明確に案内。
 const src=URL.createObjectURL(file);
 try{
  const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('この写真形式は読み取れません。JPEGなどに変換して選択してください。'));img.src=src});
  const max=1800,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.82));if(!blob)throw Error('写真の変換に失敗しました');
  if(blob.size>6000000)throw Error('写真が大きすぎます');return (await readAsDataURL(blob)).split(',')[1];
 }finally{URL.revokeObjectURL(src)}
}
$('send').onclick=async()=>{
 if(busy)return;
 if(!token){status('LINEから案内された専用リンクで開いてください。');return}
 const data={car:$('car').value.trim(),name:$('name').value.trim(),phone:$('phone').value.trim(),date:$('date').value,memo:$('memo').value.trim()};
 if(!data.car||!data.name||!/^0[0-9\-\s]{9,14}$/.test(data.phone)||!data.date){status('車番・氏名・電話番号・返却希望日を確認してください。');return}
 const missing=DIRS.filter(d=>!files[d]);if(missing.length){status('写真が未選択です：'+missing.join('、'));return}
 busy=true;$('send').disabled=true;$('bar').hidden=false;
 try{
  status('受付情報を確認しています…');const started=await callGAS('start',{token,data:JSON.stringify(data)});
  const saved=started.saved||{};
  if(started.done){$('bar').value=8;$('done').style.display='block';status('この受付はすでに完了しています。');return}
  let n=DIRS.filter(d=>saved[d]).length;$('bar').value=n;
  for(const dir of DIRS){if(saved[dir])continue;
   status('写真を保存中：'+dir+'（'+n+'/8枚完了）');const b64=await jpegBase64(files[dir]);
   // 送信失敗時は同じ受付キー・方向で再送可能。サーバーが重複を防ぐ。
   await callGAS('photo',{token,key:started.key,direction:dir,base64:b64});n++;$('bar').value=n;
  }
  status('8枚保存済み。受付を確定しています…');await callGAS('finish',{token,key:started.key});
  status('受付が完了しました。');$('done').style.display='block';$('send').textContent='受付完了';
 }catch(err){status('⚠️ '+err.message+'\n保存済みの写真は残っています。画面を閉じずに、もう一度「保存して申し込む」を押してください。');$('send').disabled=false}
 finally{busy=false;if($('done').style.display!=='block')$('send').disabled=false}
};
</script></body></html>
