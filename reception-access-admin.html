<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST | 受付スタッフ権限管理</title><style>body{font-family:system-ui,sans-serif;background:#f1f4f8;color:#172333;margin:0}main{max-width:780px;margin:24px auto;padding:20px;background:white;border-radius:16px}input,select,button{font:inherit;padding:10px;margin:4px;border:1px solid #bac6d4;border-radius:8px}button{background:#143b66;color:white;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}input[type=email]{width:min(95%,340px)}.muted{color:#64748b}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#msg{min-height:2em}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style id="gf-mobile-theme">
html,body{background:#fff;color:#303438;max-width:100%;overflow-x:hidden}
main{max-width:900px;margin:0 auto;padding:18px 14px 90px;background:#fff;border-radius:0}
h1{font-size:23px;color:#333}h2{font-size:19px;margin-top:24px}
a{color:#866628}
button{background:#c49a43;color:#fff;border:1px solid #c49a43;min-height:44px;border-radius:10px}
#accessTab,#shiftTab{background:#f8f4eb;color:#6b5636;border:1px solid #e7d8bb;flex:1 1 170px}
input,select{background:#fff;color:#333;border:1px solid #d8d3ca;min-height:44px;font-size:16px}
#add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#add input,#add select,#add button{width:100%;min-width:0;margin:0}
#add #email{grid-column:1/-1;max-width:none}
#add #name{grid-column:1/-1}
#add button{grid-column:1/-1}
#accessSection>div[style*="overflow"],#shiftSection>div[style*="overflow"]{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{min-width:640px;font-size:14px}td,th{border-bottom:1px solid #eee5d7;padding:10px 7px}
td input,td select{min-width:105px;max-width:170px}
.muted{color:#79746b}
@media(max-width:600px){main{padding:14px 10px 80px}h1{font-size:21px}h2{font-size:18px}.row{gap:8px}button{font-size:14px}td,th{padding:8px 6px}}
</style></head><body><main><a href="./line-reception-admin.html">← 受付管理へ戻る</a><h1>スタッフ・権限管理</h1><p>最高管理者はメールアドレスの追加・権限変更・利用停止ができます。新しい方は登録後、そのメールアドレスで共通ログインしてください。</p><p id="msg">ログイン・権限を確認中…</p><section id="panel" hidden><div class="row" style="margin:16px 0"><button type="button" id="accessTab">権限・ログイン管理</button><button type="button" id="shiftTab">シフトスタッフマスター</button></div><section id="accessSection"><h2>スタッフを追加</h2><form id="add" class="row"><input id="name" type="text" maxlength="100" placeholder="スタッフ名"><input id="email" type="email" required placeholder="メールアドレス"><select id="role"><option value="staff">スタッフ</option><option value="owner">最高管理者</option></select><button type="submit">登録して有効化</button></form><h2>登録済み一覧</h2><p><button id="syncSheet" type="button">スプシから権限を取り込む</button></p><p><button id="provision" type="button">登録済みスタッフの初回ログインを準備</button></p><div style="overflow:auto"><table><thead><tr><th>スタッフ名</th><th>メールアドレス</th><th>権限</th><th>状態</th><th>操作</th></tr></thead><tbody id="members"></tbody></table></div></section><section id="shiftSection" hidden><h2>シフトスタッフマスター</h2><p class="muted">シフト管理スプレッドシートの「スタッフマスター」を直接編集します。名前・カレンダー色・時給のみ変更し、登録日・メモ・過去のシフト・打刻履歴は変更しません。名前変更後は既存シフトとの名前の不一致に注意してください。</p><button type="button" id="shiftReload">最新のスタッフ一覧を読み込む</button><p id="shiftMsg"></p><div style="overflow:auto"><table><thead><tr><th>スタッフ名</th><th>カレンダー色</th><th>時給</th><th>操作</th></tr></thead><tbody id="shiftRows"></tbody></table></div></section></main><script>
const client=window.supabase.createClient('https://tgxrnrqxafytyqfwwsag.supabase.co','sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW');
const msg=document.getElementById('msg'),panel=document.getElementById('panel'),tbody=document.getElementById('members');
async function api(action,payload={}){const {data:{session}}=await client.auth.getSession();if(!session?.access_token)throw Error('共通ログインが必要です。アプリのトップからログインしてください。');const r=await fetch('https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-line-reception-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW'},body:JSON.stringify({action,...payload})});const data=await r.json();if(!r.ok)throw Error(r.status===403?'最高管理者権限が必要です。':data.error||'APIエラー '+r.status);return data}
async function load(){try{const data=await api('members');tbody.replaceChildren();for(const member of data.members){const tr=document.createElement('tr'),nameCell=document.createElement('td'),nameInput=document.createElement('input');nameInput.type='text';nameInput.maxLength=100;nameInput.value=member.staff_name||'';nameInput.placeholder='スタッフ名';nameCell.append(nameInput);tr.append(nameCell);const td=document.createElement('td');td.textContent=member.email;tr.append(td);const roleCell=document.createElement('td'),role=document.createElement('select');for(const [value,label] of [['staff','スタッフ'],['owner','最高管理者']]){const o=new Option(label,value);role.add(o)}role.value=member.role;roleCell.append(role);tr.append(roleCell);const statusCell=document.createElement('td'),enabled=document.createElement('input');enabled.type='checkbox';enabled.checked=member.enabled;statusCell.append(enabled);tr.append(statusCell);const action=document.createElement('td'),btn=document.createElement('button');btn.textContent='変更を保存';btn.onclick=async()=>{btn.disabled=true;try{await api('set_member',{email:member.email,role:role.value,enabled:enabled.checked,staff_name:nameInput.value.trim()});msg.textContent=member.email+' の設定を保存しました';await load()}catch(e){msg.textContent=e.message}finally{btn.disabled=false}};action.append(btn);tr.append(action);tbody.append(tr)}panel.hidden=false;msg.textContent='登録済み '+data.members.length+' 件'}catch(e){panel.hidden=true;msg.textContent=e.message}}
const accessTab=document.getElementById('accessTab'),shiftTab=document.getElementById('shiftTab');
function selectTab(which){document.getElementById('accessSection').hidden=which!=='access';document.getElementById('shiftSection').hidden=which!=='shift';if(which==='shift')loadShift()}
accessTab.onclick=()=>selectTab('access');shiftTab.onclick=()=>selectTab('shift');
async function loadShift(){
 const label=document.getElementById('shiftMsg'),tbody=document.getElementById('shiftRows');
 label.textContent='読み込み中…';
 try{
  const data=await api('shift_staff_list');tbody.replaceChildren();
  for(const item of data.staff){
   const tr=document.createElement('tr'),controls=[];
   for(const [field,value] of [['name',item.name],['color',item.color],['hourly_wage',item.hourly_wage]]){
    const td=document.createElement('td'),input=document.createElement('input');input.value=value||'';input.dataset.field=field;
    if(field==='hourly_wage'){input.inputMode='decimal';input.placeholder='未設定'}
    if(field==='name')input.required=true;
    td.append(input);tr.append(td);controls.push(input);
   }
   const td=document.createElement('td'),button=document.createElement('button');button.textContent='保存';
   button.onclick=async()=>{
    if(!controls[0].value.trim()){label.textContent='スタッフ名は必須です';return}
    if(controls[0].value.trim()!==item.name&&!confirm('スタッフ名を変更します。過去のシフトや打刻履歴は変更されないため、名前の不一致が生じる場合があります。続けますか？'))return;
    button.disabled=true;try{
     await api('shift_staff_save',{row:item.row,old_name:item.name,old_color:item.color,old_wage:item.hourly_wage,name:controls[0].value.trim(),color:controls[1].value.trim(),hourly_wage:controls[2].value.trim()});
     await loadShift();label.textContent='スタッフマスターを更新しました（行 '+item.row+'）';
    }catch(e){label.textContent=e.message}finally{button.disabled=false}
   };td.append(button);tr.append(td);tbody.append(tr);
  }
  label.textContent='スタッフ '+data.staff.length+' 件を読み込みました';
 }catch(e){label.textContent=e.message==='shift_sheet_access_unavailable'?'シフトスプシへの連携権限がありません。システム管理者に共有設定を確認してください。':e.message}
}
document.getElementById('shiftReload').onclick=loadShift;
document.getElementById('syncSheet').onclick=async()=>{const btn=document.getElementById('syncSheet');if(!confirm('スタッフ権限管理スプシの内容をSupabaseへ反映します。続けますか？'))return;btn.disabled=true;try{const data=await api('sync_members_from_sheet');await load();msg.textContent='スプシから '+data.count+' 件の権限を取り込みました'}catch(e){msg.textContent='同期できませんでした：'+e.message}finally{btn.disabled=false}};document.getElementById('provision').onclick=async()=>{const btn=document.getElementById('provision');btn.disabled=true;try{const data=await api('provision');msg.textContent='ログイン準備完了：新規 '+data.created.length+' 件、未完了 '+data.failed.length+' 件'+(data.failed.length?'（'+data.failed.join('、')+'）':'')}catch(e){msg.textContent=e.message}finally{btn.disabled=false}};document.getElementById('add').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{await api('set_member',{email:document.getElementById('email').value.trim(),role:document.getElementById('role').value,enabled:true,staff_name:document.getElementById('name').value.trim()});document.getElementById('email').value='';document.getElementById('name').value='';await load()}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};load();
</script></body></html>
