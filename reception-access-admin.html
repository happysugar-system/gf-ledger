<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST | 受付スタッフ権限管理</title><style>body{font-family:system-ui,sans-serif;background:#f1f4f8;color:#172333;margin:0}main{max-width:780px;margin:24px auto;padding:20px;background:white;border-radius:16px}input,select,button{font:inherit;padding:10px;margin:4px;border:1px solid #bac6d4;border-radius:8px}button{background:#143b66;color:white;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}input[type=email]{width:min(95%,340px)}.muted{color:#64748b}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#msg{min-height:2em}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><a href="./line-reception-admin.html">← 受付管理へ戻る</a><h1>受付スタッフ権限管理</h1><p>最高管理者はメールアドレスの追加・権限変更・利用停止ができます。新しい方は登録後、そのメールアドレスで共通ログインしてください。</p><p id="msg">ログイン・権限を確認中…</p><section id="panel" hidden><h2>スタッフを追加</h2><form id="add" class="row"><input id="email" type="email" required placeholder="メールアドレス"><select id="role"><option value="staff">スタッフ</option><option value="owner">最高管理者</option></select><button type="submit">登録して有効化</button></form><h2>登録済み一覧</h2><div style="overflow:auto"><table><thead><tr><th>メールアドレス</th><th>権限</th><th>状態</th><th>操作</th></tr></thead><tbody id="members"></tbody></table></div></section></main><script>
const client=window.supabase.createClient('https://tgxrnrqxafytyqfwwsag.supabase.co','sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW');
const msg=document.getElementById('msg'),panel=document.getElementById('panel'),tbody=document.getElementById('members');
async function api(action,payload={}){const {data:{session}}=await client.auth.getSession();if(!session?.access_token)throw Error('共通ログインが必要です。アプリのトップからログインしてください。');const r=await fetch('https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-line-reception-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW'},body:JSON.stringify({action,...payload})});const data=await r.json();if(!r.ok)throw Error(r.status===403?'最高管理者権限が必要です。':data.error||'APIエラー '+r.status);return data}
async function load(){try{const data=await api('members');tbody.replaceChildren();for(const member of data.members){const tr=document.createElement('tr'),td=document.createElement('td');td.textContent=member.email;tr.append(td);const roleCell=document.createElement('td'),role=document.createElement('select');for(const [value,label] of [['staff','スタッフ'],['owner','最高管理者']]){const o=new Option(label,value);role.add(o)}role.value=member.role;roleCell.append(role);tr.append(roleCell);const statusCell=document.createElement('td'),enabled=document.createElement('input');enabled.type='checkbox';enabled.checked=member.enabled;statusCell.append(enabled);tr.append(statusCell);const action=document.createElement('td'),btn=document.createElement('button');btn.textContent='変更を保存';btn.onclick=async()=>{btn.disabled=true;try{await api('set_member',{email:member.email,role:role.value,enabled:enabled.checked});msg.textContent=member.email+' の設定を保存しました';await load()}catch(e){msg.textContent=e.message}finally{btn.disabled=false}};action.append(btn);tr.append(action);tbody.append(tr)}panel.hidden=false;msg.textContent='登録済み '+data.members.length+' 件'}catch(e){panel.hidden=true;msg.textContent=e.message}}
document.getElementById('add').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{await api('set_member',{email:document.getElementById('email').value.trim(),role:document.getElementById('role').value,enabled:true});document.getElementById('email').value='';await load()}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};load();
</script></body></html>
