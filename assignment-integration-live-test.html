<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST 割当統合検証</title><style>body{font:16px system-ui;background:#f4f5f7;color:#222;margin:0}main{max-width:540px;margin:30px auto;padding:24px;background:white;border-radius:16px}label,input,button{display:block;box-sizing:border-box;width:100%;margin:10px 0}input,button{padding:12px;font:inherit}button{cursor:pointer}button:disabled{opacity:.5}small{color:#666}</style><main><h1>車両割当・取消テスト</h1><small>検証専用・本番データには接続しません</small><p>TEST-001 ／ テスト運転者A ／ D999901</p><form id="login"><label>テスト用メール<input id="email" type="email" required autocomplete="username"></label><label>パスワード<input id="pw" type="password" required autocomplete="current-password"></label><button>ログイン</button></form><button id="assign" disabled>車両割当</button><button id="cancel" disabled>割当取消</button><button id="check" disabled>保存状況を確認</button><p id="msg" role="status" aria-live="polite">ログインしてください</p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://zwprphmfgobkektzsuti.supabase.co',key='sb_publishable__wtlccECQwOVd3-LvRVFYQ_2dCUlPVR',client=createClient(url,key,{auth:{persistSession:false}});
const el=id=>document.getElementById(id);let user,busy=false;
const storage=()=> 'gfi-ui-test:'+user.id;
const buttons=()=>{const pending=user&&localStorage.getItem(storage());el('assign').disabled=el('cancel').disabled=!user||busy||!!pending;el('check').disabled=!user||busy||!pending;};
async function api(action,id){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('再ログインしてください');const r=await fetch(url+'/functions/v1/gf-assignment-integration-ui-test',{method:'POST',headers:{authorization:'Bearer '+session.access_token,apikey:key,'content-type':'application/json'},body:JSON.stringify({action,request_id:id,vehicle_id:'TEST-V01'}),signal:AbortSignal.timeout(20000)});if(!r.ok){const e=Error('受付確認エラー HTTP '+r.status);e.status=r.status;throw e}return r.json()}
async function run(fn){if(busy)return;busy=true;buttons();try{await fn()}catch(e){el('msg').textContent=e.message}finally{busy=false;buttons()}}
async function poll(p){for(let i=0;i<40;i++){let r;try{r=await api('status',p.id)}catch(e){if(e.status===404){el('msg').textContent='未受付のため同じ受付IDで再送します';await api(p.action,p.id);continue}throw e}if(r.state==='verified'&&r.verified_at&&r.action===p.action&&r.vehicle_id==='TEST-V01'){localStorage.removeItem(storage());el('msg').textContent=(p.action==='assign'?'割当':'取消')+'：台帳・Supabase反映確認済み';return}if(['reconciliation_required','rejected'].includes(r.state)){el('msg').textContent='管理者確認が必要です。再送しないでください。';return}el('msg').textContent='自動同期待ち：'+r.state;await new Promise(r=>setTimeout(r,5000))}el('msg').textContent='確認待ちです。保存状況を確認してください。'}
el('login').onsubmit=e=>{e.preventDefault();run(async()=>{const r=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('pw').value});el('pw').value='';if(r.error)throw Error('ログイン失敗');user=r.data.user;el('login').hidden=true;el('msg').textContent='ログイン成功。操作を選択してください。';if(localStorage.getItem(storage()))await poll(JSON.parse(localStorage.getItem(storage())))})};
for(const action of ['assign','cancel'])el(action).onclick=()=>run(async()=>{if(localStorage.getItem(storage()))throw Error('受付確認中');if(!confirm(action==='assign'?'テスト車両を割り当てますか？':'テスト車両の割当を取り消しますか？'))return;const p={id:crypto.randomUUID(),action};localStorage.setItem(storage(),JSON.stringify(p));await api(action,p.id);await poll(p)});
el('check').onclick=()=>run(async()=>{const p=JSON.parse(localStorage.getItem(storage())||'null');if(p)await poll(p)});
</script></html>
