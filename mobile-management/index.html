<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLD FIRST 車両一覧｜開発確認用</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#18304b;margin:0}.wrap{max-width:650px;margin:auto;padding:18px}header{background:#173b64;color:#fff;padding:18px}h1{font-size:20px;margin:0}.card{background:white;border:1px solid #dce4ee;border-radius:14px;padding:15px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #c8d5e3}input{width:100%;box-sizing:border-box}button{background:#176cbd;color:white;cursor:pointer;border:0;margin-top:8px}button:disabled{opacity:.5}.small{font-size:12px;color:#5c7084}.error{color:#b32020}.plate{font-size:18px;font-weight:700}.row{display:flex;justify-content:space-between;gap:10px}.tag{background:#e7f1ff;border-radius:12px;padding:3px 8px;font-size:12px}</style>
</head><body><header><h1>🚗 GOLD FIRST 車両検索｜開発確認用</h1></header>
<div class="wrap"><div class="card"><b>🔒 読込み専用・スタッフ限定</b><p class="small">現在のスマホ管理アプリとは別の検証画面です。車両の変更・保存はできません。既存ログイン画面との統合前のため、認証済みSupabaseアクセストークンを一時的に入力する技術検証用です。トークンは保存しません。第三者に渡さないでください。</p>
<label for="token">アクセストークン（検証担当者のみ）</label><input id="token" type="password" autocomplete="off" placeholder="Supabaseのログイン済みアクセストークン">
<button id="load">認証して車両を読み込む</button><p id="status" role="status" class="small">未接続</p></div>
<div class="card"><label for="q">車番・使用者・車種・VehicleIDで検索</label><input id="q" placeholder="車番などを入力" disabled><div class="row"><span id="count" class="small">0件</span><button id="more" hidden>次の100件を読み込む</button></div></div><div id="list"></div></div>
<script type="module">
import { fetchVehicles, filterVehicles } from './vehicle-reader.mjs';
const endpoint='https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-mobile-vehicles-read';
const $=id=>document.getElementById(id);
const rows=[];let cursor=null,busy=false,loaded=false,token='';
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const found=filterVehicles(rows,$('q').value);$('count').textContent=found.length+'件表示（取得済み '+rows.length+'件）';$('list').innerHTML=found.map(v=>'<div class="card"><div class="row"><span class="plate">'+escapeHTML(v['車番'])+'</span><span class="tag">'+escapeHTML(v['区分/ステータス'])+'</span></div><p>使用者：'+escapeHTML(v['現在使用者']||'なし')+'</p><p class="small">'+escapeHTML(v.VehicleID)+' / '+escapeHTML(v['車種'])+' / '+escapeHTML(v['管理区分'])+'</p></div>').join('')||'<p class="small">該当車両がありません</p>';}
async function load(reset=false){if(busy)return;busy=true;$('load').disabled=true;$('more').disabled=true;$('status').textContent='認証・読込み中…';
try{const result=await fetchVehicles({apiBase:endpoint,accessToken:token,cursor:reset?null:cursor,limit:100});if(reset)rows.length=0;rows.push(...result.vehicles);cursor=result.nextCursor;loaded=true;$('q').disabled=false;$('more').hidden=!cursor;$('status').textContent='取得成功（読込み専用）';render();}
catch(e){$('status').textContent='取得できません：'+(e.message||'通信エラー');$('status').className='small error';$('more').hidden=true;}
finally{busy=false;$('load').disabled=false;$('more').disabled=false;}}
$('load').addEventListener('click',()=>{token=$('token').value.trim();$('token').value='';if(!token){$('status').textContent='認証済みトークンが必要です';return;}cursor=null;rows.length=0;load(true);});
$('more').addEventListener('click',()=>load());$('q').addEventListener('input',render);
</script></body></html>
