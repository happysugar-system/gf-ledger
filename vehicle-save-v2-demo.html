<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>車両保存 V2 デモ</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172334;margin:0}main{max-width:480px;margin:24px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin:12px 0}input:not([type=checkbox]),textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px}button{margin:6px 0;background:#173b60;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}#message{white-space:pre-wrap}</style><main><h2>車両情報編集 V2</h2><p>DEMO / V999999 専用</p><form id="login"><label>メール<input id="email" type="email" required autocomplete="username"></label><label>パスワード<input id="password" type="password" required autocomplete="current-password"></label><button>ログイン</button></form><section id="editor" hidden><label><input id="gps" type="checkbox"> GPS有無</label><label>代車貸出先<input id="company" maxlength="1000"></label><label>代車貸出エリア<input id="area" maxlength="1000"></label><label>代車貸出備考<textarea id="note" maxlength="1000"></textarea></label><button id="save">変更を保存</button><button id="refresh">最新状態・保存状況を確認</button><button id="logout">ログアウト</button></section><p id="message" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://zwprphmfgobkektzsuti.supabase.co',key='sb_publishable__wtlccECQwOVd3-LvRVFYQ_2dCUlPVR',client=createClient(url,key,{auth:{persistSession:false}});
const $=id=>document.getElementById(id),msg=t=>$('message').textContent=t,ids={'GPS有無':'gps','代車貸出先':'company','代車貸出エリア':'area','代車貸出備考':'note'};
let original=null,pending=null,busy=false;
function lock(v){busy=v;for(const id of [...Object.values(ids),'save','refresh','logout'])$(id).disabled=v; if(!v&&pending)for(const id of Object.values(ids))$(id).disabled=true;}
async function api(action,extra={}){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('ログインが必要です');const r=await fetch(url+'/functions/v1/gf-vehicle-demo-editor-v2',{method:'POST',headers:{authorization:'Bearer '+session.access_token,apikey:key,'content-type':'application/json'},body:JSON.stringify({action,vehicle_id:'V999999',...extra}),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok){const e=Error(d.error||'API error');e.status=r.status;throw e;}return d;}
async function read(){const r=await api('read');for(const [k,id] of Object.entries(ids)){const v=r.fields?.[k];if(typeof v!==(id==='gps'?'boolean':'string'))throw Error('不正なデータ');if(id==='gps')$(id).checked=v;else $(id).value=v;}original=r.fields;}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error)throw r.error;await read();$('login').hidden=true;$('editor').hidden=false;msg('最新値を取得しました');}catch(e){await client.auth.signOut();msg(e.message);}finally{b.disabled=false;}};
async function poll(){for(let i=0;i<24;i++){const r=await api('status',{request_id:pending.request_id});if(r.state==='replica_verified'&&r.verified_at&&Object.keys(pending.changes).every(k=>r.changes?.[k]===pending.changes[k])){pending=null;await read();msg('スプシ保存・Supabase反映を確認しました');return;}if(['conflict','rejected','reconciliation_required'].includes(r.state)){pending=null;await read();msg('保存未完了：'+r.state+'。管理者確認が必要な場合があります');return;}msg('保存処理中… '+r.state);await new Promise(r=>setTimeout(r,5000));}msg('確認待ち：最新状態・保存状況を確認してください');}
$('save').onclick=async()=>{if(busy)return;lock(true);try{if(!pending){const expected={},changes={};for(const [k,id] of Object.entries(ids)){const v=id==='gps'?$(id).checked:$(id).value;if(v===original[k])continue;if(typeof v==='string'&&/^\s*[=+@-]/.test(v))throw Error('不正な入力：'+k);expected[k]=original[k];changes[k]=v;}if(!Object.keys(changes).length){msg('変更なし');return;}pending={request_id:crypto.randomUUID(),expected,changes};}try{await api('save',pending);}catch(e){if(e.status===400){pending=null;throw e;}if(e.status===409){try{await api('status',{request_id:pending.request_id});}catch(s){if(s.status===404)pending=null;throw e;}}else throw e;}await poll();}catch(e){msg('保存未確認：'+e.message);}finally{lock(false);}};
$('refresh').onclick=async()=>{if(busy)return;lock(true);try{if(pending)await poll();else{await read();msg('最新値を取得しました');}}catch(e){msg(e.message);}finally{lock(false);}};
$('logout').onclick=async()=>{if(pending){msg('保存状況を先に確認してください');return;}await client.auth.signOut();$('editor').hidden=true;$('login').hidden=false;msg('ログアウトしました');};
</script></html>
