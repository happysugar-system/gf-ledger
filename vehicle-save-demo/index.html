<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST GPS保存デモ</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172334;margin:0}main{max-width:460px;margin:32px auto;padding:24px;background:white;border-radius:16px}input,button{font:inherit;padding:12px;margin:8px 0;box-sizing:border-box}input:not([type=checkbox]),button{width:100%}button{background:#173b60;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}#message{white-space:pre-wrap}label{display:block}</style><main><h2>車両管理・GPS保存テスト</h2><p>DEMO / V999999 専用</p><form id="login"><label>メール<input id="email" type="email" required autocomplete="username"></label><label>パスワード<input id="password" type="password" required autocomplete="current-password"></label><button>ログイン</button></form><section id="editor" hidden><label><input type="checkbox" id="gps"> GPS有無</label><button id="save">変更を保存</button><button id="refresh">最新状態を取得</button><button id="health">即時接続テスト</button><button id="logout">ログアウト</button></section><p id="message" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const url='https://zwprphmfgobkektzsuti.supabase.co',key='sb_publishable__wtlccECQwOVd3-LvRVFYQ_2dCUlPVR';
const client=createClient(url,key,{auth:{persistSession:false}});
const $=id=>document.getElementById(id),msg=t=>$('message').textContent=t;
let expected=null,pending=null,busy=false;
function lock(v){busy=v;for(const id of ['gps','save','refresh','health','logout'])$(id).disabled=v;}
async function api(action,extra={}){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('ログインが必要です');const res=await fetch(url+'/functions/v1/gf-vehicle-demo-editor',{method:'POST',headers:{authorization:'Bearer '+session.access_token,apikey:key,'content-type':'application/json'},body:JSON.stringify({action,vehicle_id:'V999999',...extra})});const data=await res.json();if(!res.ok)throw Error('API '+res.status+' '+(data.error||''));return data;}
async function read(){const r=await api('read');if(typeof r.gps!=='boolean')throw Error('GPS値が不正です');expected=r.gps;$('gps').checked=expected;msg('最新値を取得しました');}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error)throw r.error;await read();$('login').hidden=true;$('editor').hidden=false;}catch(e){await client.auth.signOut();msg(e.message);}finally{b.disabled=false;}};
async function poll(){for(let i=0;i<36;i++){const r=await api('status',{request_id:pending.request_id});if(['conflict','rejected','reconciliation_required'].includes(r.state)){pending=null;await read();msg('保存未完了：'+r.state+'。最新値を確認してください');return;}if(r.state==='sheet_verified'&&r.gps===pending.desired&&Date.parse(r.observed_at)>=Date.parse(r.created_at)){pending=null;await read();msg('スプシ保存・Supabase反映を確認しました');return;}msg('保存処理中… '+r.state);await new Promise(r=>setTimeout(r,5000));}msg('確認待ち。最新状態を取得して再確認してください。');}
$('save').onclick=async()=>{if(busy)return;lock(true);try{if(!pending){if(expected===$('gps').checked){msg('変更はありません');return;}pending={request_id:crypto.randomUUID(),expected,desired:$('gps').checked};}await api('save',pending);await poll();}catch(e){msg('保存完了未確認：'+e.message+'。同じ保存要求で再確認できます。');}finally{lock(false);}};
$('refresh').onclick=async()=>{if(busy)return;lock(true);try{if(pending)await poll();else await read();}catch(e){msg(e.message);}finally{lock(false);}};
$('health').onclick=async()=>{if(busy)return;lock(true);msg('GAS接続確認中…');try{const r=await api('gas_health');if(r.ok!==true||r.vehicle_id!=='V999999')throw Error('応答不一致');msg('即時接続成功：V999999');}catch(e){msg('即時接続失敗：'+e.message);}finally{lock(false);}};
$('logout').onclick=async()=>{if(pending){msg('保存確認が終わってからログアウトしてください');return;}await client.auth.signOut();$('editor').hidden=true;$('login').hidden=false;msg('ログアウトしました');};
</script></html>
