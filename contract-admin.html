<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLDFIRST 契約管理｜デモ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Segoe UI",sans-serif;color:#192333;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#172332;color:white;padding:22px 18px}header>div,main{max-width:950px;margin:auto}header h1{margin:3px 0;font-size:24px}header p{margin:5px 0;color:#d3dce7;font-size:13px}.demo{display:inline-block;background:#f8e6ac;color:#634400;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}main{padding:18px 12px 60px}.notice{padding:13px 16px;border:1px solid #e8d9a4;border-radius:12px;background:#fff9e7;font-size:13px;line-height:1.7;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.stat{background:white;padding:15px;border-radius:13px;box-shadow:0 1px 8px #1e293b0d}.stat strong{display:block;font-size:25px;margin-top:7px}.stat small{color:#64748b}.bar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0}.bar h2{margin:0;font-size:19px}button,select,input{font:inherit}button{border:0;border-radius:10px;min-height:42px;padding:10px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#e8edf3;color:#233347}.dark{background:#172332;color:#fff}.good{background:#166534;color:white}.cards{display:grid;gap:13px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px #1e293b0d}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:850}.id{font-size:11px;color:#718096;overflow-wrap:anywhere;margin-top:5px}.pill{font-size:12px;border-radius:99px;padding:7px 10px;font-weight:800;white-space:nowrap;background:#e8edf3;color:#344054}.pill.pre{background:#dceafe;color:#18488a}.pill.wait{background:#fff1ce;color:#855b00}.pill.done{background:#dcfce7;color:#166534}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:17px 0;padding:14px;background:#f6f8fb;border-radius:10px;font-size:13px}.info span{display:block;color:#667085;font-size:11px;margin-bottom:4px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}.history{border-top:1px solid #e6eaf0;margin-top:16px;padding-top:10px}.history summary{font-size:13px;color:#475569;cursor:pointer;font-weight:700}.history li{font-size:12px;line-height:1.8;color:#475569}.foot{font-size:12px;color:#64748b;line-height:1.7;margin-top:20px}.empty{padding:40px;text-align:center;color:#667085;background:white;border-radius:12px}@media(max-width:520px){header h1{font-size:21px}.stats{gap:6px}.stat{padding:12px}.stat strong{font-size:22px}.info{grid-template-columns:1fr}.top{align-items:flex-start}.actions button{width:100%}}
</style></head><body>
<header><div><span class="demo">操作体験専用・デモ</span><h1>GOLDFIRST 契約管理</h1><p>スタッフ用 契約進捗管理画面</p></div></header>
<main><div class="notice"><strong>⚠️ 本物の契約処理ではありません。</strong> 画面の操作結果は、このブラウザ内にだけ保存します。Googleスプレッドシート、GAS、電子契約サービスには接続しません。実際の契約メールも送信しません。</div>
<div class="stats"><div class="stat"><small>事前確認済</small><strong id="preCount">0</strong></div><div class="stat"><small>署名待ち</small><strong id="waitCount">0</strong></div><div class="stat"><small>締結済（デモ）</small><strong id="doneCount">0</strong></div></div>
<div class="bar"><h2>契約一覧</h2><div style="display:flex;gap:8px"><select id="filter" aria-label="ステータスで絞り込み" onchange="render()"><option value="">すべて</option><option value="事前確認済">事前確認済</option><option value="署名待ち">署名待ち</option><option value="締結済（デモ）">締結済（デモ）</option></select><button class="ghost" onclick="resetDemo()">デモを初期化</button></div></div>
<div id="cards" class="cards"></div><p class="foot">※表示しているドライバーはすべて架空です。受付ID「LR-CONTRACT-WEB-DEMO-001」は、先ほどのテストシートと同じ文字列を画面見本として使っていますが、シートのデータを読み取っているわけではありません。</p></main>
<script>
'use strict';
const KEY='gf_contract_admin_demo_v1';
const defaults=[{id:'LR-CONTRACT-WEB-DEMO-001',name:'WEB事前確認テスト（架空）',status:'事前確認済',version:'DEMO-20261013-01',checked:'2026/10/13 09:39',sent:'',signed:'',history:['2026/10/13 09:39　事前確認済（サンプル）']},{id:'LR-CONTRACT-SAMPLE-002',name:'契約テスト 花子（架空）',status:'事前確認済',version:'DEMO-20261013-01',checked:'2026/10/13 09:45',sent:'',signed:'',history:['2026/10/13 09:45　事前確認済（サンプル）']}];
function fresh(){return JSON.parse(JSON.stringify(defaults))}
let data=load();
function load(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a)&&a.length===2&&a.every(x=>typeof x.id==='string'&&Array.isArray(x.history)))return a}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('このブラウザでは操作結果を保存できません。再読み込みすると初期化される場合があります。')}}
function time(){return new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function cell(parent,label,value){const d=el('div');d.append(el('span','',label),document.createTextNode(value||'—'));parent.append(d)}
function action(label,cls,fn){const b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b}
function transition(id,to){const x=data.find(v=>v.id===id);if(!x)return;if(to==='署名待ち'&&x.status!=='事前確認済')return;if(to==='締結済（デモ）'&&x.status!=='署名待ち')return;const msg=to==='署名待ち'?'【デモ】契約送信したことにします。実際のメール送信は行いません。':'【デモ】署名が完了したことにします。法的な契約締結ではありません。';if(!confirm(msg+'\n進めますか？'))return;const t=time();x.status=to;if(to==='署名待ち')x.sent=t;else x.signed=t;x.history.unshift(t+'　'+(to==='署名待ち'?'模擬送信 → 署名待ち':'模擬締結 → 締結済（デモ）'));save();render()}
function resetDemo(){if(!confirm('このブラウザのデモ操作履歴を初期状態に戻しますか？\n実際のスプシは変更しません。'))return;data=fresh();save();render()}
function render(){document.getElementById('preCount').textContent=data.filter(x=>x.status==='事前確認済').length;document.getElementById('waitCount').textContent=data.filter(x=>x.status==='署名待ち').length;document.getElementById('doneCount').textContent=data.filter(x=>x.status==='締結済（デモ）').length;const root=document.getElementById('cards');root.replaceChildren();const filter=document.getElementById('filter').value;const visible=data.filter(x=>!filter||x.status===filter);if(!visible.length){root.append(el('div','empty','該当する契約はありません。'));return}for(const x of visible){const c=el('article','card');const top=el('div','top');const left=el('div');left.append(el('div','name',x.name),el('div','id',x.id));const pill=el('span','pill '+(x.status==='事前確認済'?'pre':x.status==='署名待ち'?'wait':'done'),x.status);top.append(left,pill);c.append(top);const info=el('div','info');cell(info,'事前確認日時',x.checked);cell(info,'契約書バージョン',x.version);cell(info,'模擬送信日時',x.sent);cell(info,'模擬締結日時',x.signed);c.append(info);const buttons=el('div','actions');if(x.status==='事前確認済')buttons.append(action('✉️ 契約を模擬送信','dark',()=>transition(x.id,'署名待ち')));if(x.status==='署名待ち')buttons.append(action('✓ 模擬締結を完了','good',()=>transition(x.id,'締結済（デモ）')));if(x.status==='締結済（デモ）')buttons.append(el('div','', '✅ デモの契約フローが完了しました'));c.append(buttons);const details=el('details','history');const summary=el('summary','','操作履歴を見る');const ul=el('ul');for(const h of x.history)ul.append(el('li','',h));details.append(summary,ul);c.append(details);root.append(c)}}
render();
</script></body></html>
