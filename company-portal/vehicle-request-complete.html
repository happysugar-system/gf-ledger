<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><title>GOLD FIRST｜車両依頼受付完了</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#223249;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}.wrap{max-width:620px;margin:0 auto;padding:28px 16px 54px}.card{background:#fff;border-radius:22px;padding:38px 24px;box-shadow:0 6px 30px #23384d0a;text-align:center}.tick{font-size:64px;color:#198754;line-height:1.2}.title{font-size:25px;font-weight:800;margin:18px 0 22px}.thanks{font-size:18px}.receipt{font-size:18px;font-weight:800;overflow-wrap:anywhere;margin:24px 0 30px}.panel{background:#f0f5fb;border-radius:16px;text-align:left;padding:24px 20px;line-height:1.95}.panel strong{display:block;font-size:18px;text-align:center;margin-bottom:14px}.btn{display:block;background:#1769ac;color:#fff;text-decoration:none;font-size:18px;font-weight:800;border-radius:13px;padding:20px 12px;margin:28px 0 18px}.small{color:#536578;font-size:14px;line-height:1.9}.error{font-weight:700;color:#9b3d25}h1{font-size:16px;text-align:center;margin:0 0 22px}@media(max-width:420px){.card{padding:30px 16px}.title{font-size:22px}}

(function(){'use strict';const p=new URLSearchParams(location.search);const receipt=p.get('receipt')||'';const valid=/^TEST145-[0-9]{14}-[a-f0-9]{8,}$/i.test(receipt);const root=document.getElementById('result');if(!valid){root.innerHTML='<div class="error">受付完了情報を確認できません</div><p class="small">このページは車両依頼の送信完了後に表示されます。公式LINEから申込み状況をご確認ください。</p>';return;}const el=document.createElement('div');el.className='receipt';el.textContent='受付番号：'+receipt;root.innerHTML='<div class="tick" aria-hidden="true">✓</div><div class="title">車両依頼を受け付けました</div><p class="thanks">お申し込みありがとうございます。</p><div id="receipt-slot"></div><div class="panel"><strong>次は、ドライバーマイページの初回登録へ</strong>お申し込み状況や車両情報は、専用マイページから確認できます。<p>メールに届く認証コードで本人確認を行い、初回登録を申請してください。</p></div><a class="btn" href="https://liff.line.me/2012058414-9wPp65Lt">マイページの初回登録へ進む</a><p class="small">登録後は、車両のお申し込み状況や、貸出中の車両の現在状況などをご確認いただけます。</p>';document.getElementById('receipt-slot').appendChild(el);})();
</script></body></html>
