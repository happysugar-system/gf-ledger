<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happysugar 業務アプリポータル（準備版）</title>
<style>body{margin:0;background:#f5f7fb;color:#20364a;font:16px system-ui,sans-serif}header{background:#173d59;color:white;padding:22px}main{max-width:820px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid #dce5ec;border-radius:14px;padding:22px;margin-bottom:16px}input,button{font:inherit;padding:12px;border-radius:8px}input{border:1px solid #b8c8d5;max-width:350px;width:90%}button{border:0;background:#146f9c;color:white;cursor:pointer}button:disabled{opacity:.5}.muted{color:#617587}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.app{border:1px solid #dce5ec;border-radius:10px;padding:16px}.app a{color:#11638d;font-weight:bold}#otpBox[hidden],#appsBox[hidden]{display:none}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script></head>
<body><header><h1>Happysugar 業務アプリポータル</h1><div>共通ログイン基盤・準備版</div></header><main>
<div class="panel"><p><strong>現在は共通ログインの動作確認用です。</strong> 各アプリへのシングルサインオンとスプレッドシート権限同期は未接続です。ログインだけで管理権限が付与されることはありません。</p></div>
<div class="panel" id="loginBox"><h2>メール認証</h2><input id="email" type="email" autocomplete="email" placeholder="メールアドレス"><button id="send">認証コードを送る</button>
<div id="otpBox" hidden><p>メールに届いた認証コードを入力</p><input id="otp" inputmode="numeric" autocomplete="one-time-code"><button id="verify">確認</button></div><p id="status" role="status" aria-live="polite"></p></div>
<div class="panel" id="appsBox" hidden><h2>アプリ一覧（接続準備中）</h2><p id="identity"></p><p class="muted">以下は案内リンクです。権限確認と共通ログインの連携が完了するまで、アプリ側の既存認証が必要です。</p>
<div class="apps"><div class="app"><a href="../">車両・業務管理</a><p>既存アプリへ移動</p></div><div class="app"><a href="../staff-approvals.html">申請承認・法人管理</a><p>既存アプリへ移動</p></div></div><p><button id="logout">ログアウト</button></p></div>
</main><script>
const auth=supabase.createClient("https://tgxrnrqxafytyqfwwsag.supabase.co","sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW");
const $=id=>document.getElementById(id),say=s=>$("status").textContent=s;
function show(session){$("appsBox").hidden=!session;$("loginBox").hidden=!!session;$("identity").textContent=session?"ログイン中: "+(session.user.email||""):"";}
$("send").onclick=async()=>{const email=$("email").value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){say("メールアドレスを確認してください");return;} $("send").disabled=true;try{const {error}=await auth.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;$("otpBox").hidden=false;say("認証メールを送信しました。メール内のリンクまたはコードで認証してください。");}catch(e){say("送信できません: "+e.message);}finally{$("send").disabled=false;}};
$("verify").onclick=async()=>{const email=$("email").value.trim().toLowerCase(),token=$("otp").value.trim();if(!token){say("認証コードを入力してください");return;}const {data,error}=await auth.auth.verifyOtp({email,token,type:"email"});if(error){say("認証できません: "+error.message);return;}show(data.session);};
$("logout").onclick=async()=>{await auth.auth.signOut();show(null);};
auth.auth.getSession().then(({data})=>show(data.session));auth.auth.onAuthStateChange((_event,session)=>show(session));
</script></body></html>
