<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOLDFIRST | スタッフ招待テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#1d1d1d;background:radial-gradient(circle at 10% 5%,#f4ead0,transparent 35%),#fffdf9}main{max-width:480px;margin:0 auto;min-height:100vh;padding:32px 20px 50px;text-align:center}.logo{width:140px;height:140px;object-fit:contain}.line{height:2px;width:62px;background:#bd9232;margin:12px auto 22px}h1{font-size:27px;margin:0 0 8px}.sub{color:#777;font-size:14px;line-height:1.6}.panel{text-align:left;background:white;border:1px solid #eee;border-radius:22px;padding:24px;box-shadow:0 12px 32px #0000000c;margin-top:24px}label{font-weight:700;font-size:14px;display:block;margin:16px 0 7px}input,select{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{cursor:pointer;border:0;border-radius:11px;padding:14px 12px;font-weight:700;font-size:15px;width:100%;margin-top:14px}button:disabled{opacity:.6;cursor:wait}.primary{background:#222;color:#fff}.google{background:#fff;border:1px solid #d5d5d5;color:#222}.link{background:transparent;color:#8c681d;font-size:13px;padding:7px}.note{margin-top:22px;background:#fff8e6;border-radius:12px;padding:14px;color:#765a20;font-size:12px;line-height:1.8}.message{font-size:13px;min-height:22px;margin-top:12px;line-height:1.6;overflow-wrap:anywhere}.error{color:#ad2727}.success{color:#216e42}.profile{word-break:break-word;line-height:1.8}hr{border:0;border-top:1px solid #eee;margin:22px 0}small{color:#777}#signedIn,#checking,#inviteForm{display:none}.state{font-weight:700;margin-bottom:12px}.denied{color:#a32929}.allowed{color:#216e42}
</style>
</head>
<body><main>
<img class="logo" src="./icon.png" alt="GOLDFIRST" onerror="this.style.display='none'">
<div class="line"></div><h1>スタッフ招待</h1><p class="sub">GOLDFIRST Firebase 招待画面テスト</p>
<section class="panel" id="signedOut"><h2 style="margin:0">管理者ログイン</h2>
<label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="example@gmail.com">
<label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
<button class="primary" id="emailLogin">メールでログイン</button><button class="google" id="googleLogin">Googleでログイン</button>
<button class="link" id="resetPassword">パスワードを忘れた方</button><div id="message" class="message" role="status" aria-live="polite"></div></section>
<section class="panel" id="checking"><h2>管理者権限を確認中…</h2><p class="sub">Firestoreの登録情報を照合しています。</p></section>
<section class="panel" id="signedIn"><h2 style="margin:0 0 12px">管理者確認</h2><p id="accessState" class="state" role="status"></p><div class="profile" id="profile"></div>
<div id="inviteForm"><hr>
<h2>GAS側の管理者接続テスト</h2>
<p class="sub">管理者としてGASでも認証できるか確認します。招待は送信しません。</p>
<button class="google" id="gasCheck">GASの管理者確認をテスト</button>
<div id="gasStatus" class="message" role="status" aria-live="polite"></div>
<iframe name="gfGasCheckFrame" title="GAS管理者確認結果" id="gasResultFrame" style="display:none;width:100%;height:120px;border:1px solid #eee;border-radius:10px;margin-top:10px"></iframe>
<hr><h2>招待内容の確認（送信なし）</h2>
<label for="staffName">スタッフ名</label><input id="staffName" maxlength="80" autocomplete="off" placeholder="例：テストスタッフ">
<label for="staffEmail">招待先メールアドレス</label><input id="staffEmail" type="email" maxlength="254" autocomplete="off" placeholder="test@example.com">
<label for="staffRole">役割</label><select id="staffRole"><option value="staff">スタッフ</option><option value="accounting">経理</option><option value="admin">管理者</option></select>
<button class="primary" id="preview">入力内容を確認する</button><div id="previewResult" class="message" role="status" aria-live="polite"></div>
</div><hr><button class="google" id="logout">ログアウト</button></section>
<div class="note">🔒 第1段階の画面テストです。招待内容を入力・確認できますが、<strong>招待メール送信、ユーザー作成、権限変更は行いません</strong>。Firestoreによる画面上の権限判定だけで、GAS側の管理者認証はまだ接続していません。実スタッフの個人情報は入力しないでください。</div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBkwuHDs1XRq8WXhDOeSIgK7X7WcYLnrCM',authDomain:'goldfirst-auth-test.firebaseapp.com',projectId:'goldfirst-auth-test',storageBucket:'goldfirst-auth-test.firebasestorage.app',messagingSenderId:'1079109139578',appId:'1:1079109139578:web:4c400be3aab323d7b0cfc3',measurementId:'G-V19ZKK82P6'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);let checkSeq=0;
const controls=['emailLogin','googleLogin','resetPassword'];
function busy(v){controls.forEach(id=>$(id).disabled=v)}
function msg(t,ok=false){$('message').textContent=t;$('message').className='message '+(ok?'success':'error')}
function err(e){const c=e?.code||'';if(c==='auth/unauthorized-domain')return 'このサイトのドメインがFirebaseで許可されていません。';if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(c))return 'メールアドレスまたはパスワードを確認してください。';if(c==='auth/popup-blocked')return 'ポップアップがブロックされました。';if(c==='auth/popup-closed-by-user')return 'Googleログイン画面が閉じられました。';if(c==='auth/operation-not-allowed')return 'Firebaseでこのログイン方法が無効です。';if(c==='auth/too-many-requests')return '試行回数が多いため、しばらく待ってください。';return '処理できませんでした（'+(c||'通信エラー')+'）。'}
$('emailLogin').addEventListener('click',async()=>{const email=$('email').value.trim(),pass=$('password').value;if(!email||!pass){msg('メールアドレスとパスワードを入力してください。');return}busy(true);msg('');try{await signInWithEmailAndPassword(auth,email,pass)}catch(e){msg(err(e))}finally{busy(false)}});
$('googleLogin').addEventListener('click',async()=>{busy(true);msg('');try{await signInWithPopup(auth,provider)}catch(e){msg(err(e))}finally{busy(false)}});
$('resetPassword').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){msg('上の欄にメールアドレスを入力してください。');return}busy(true);try{await sendPasswordResetEmail(auth,email);msg('登録済みのアドレスであれば、再設定メールが届きます。',true)}catch(e){msg(err(e))}finally{busy(false)}});
$('logout').addEventListener('click',async()=>{try{await signOut(auth)}catch(e){alert('ログアウトできませんでした。')}});
function showPanel(p){for(const id of ['signedOut','signedIn','checking'])$(id).style.display=id===p?'block':'none'}
function showAccess(user,allowed,detail){showPanel('signedIn');$('accessState').textContent=allowed?'✓ 管理者確認OK（画面テスト）':'利用権限がありません';$('accessState').className='state '+(allowed?'allowed':'denied');$('profile').replaceChildren();const p=document.createElement('p');p.textContent='ログイン中：'+(user.email||'メール未登録');const q=document.createElement('small');q.textContent=detail;$('profile').append(p,q);$('inviteForm').style.display=allowed?'block':'none';$('previewResult').textContent='';$('gasStatus').textContent='';$('gasResultFrame').style.display='none';$('password').value=''}
$('gasCheck').addEventListener('click',async()=>{
  const user=auth.currentUser;
  if(!user || $('inviteForm').style.display==='none')return;
  const btn=$('gasCheck');btn.disabled=true;
  $('gasStatus').textContent='GASで管理者確認中…';
  try{
    const token=await user.getIdToken();
    if(auth.currentUser?.uid!==user.uid)throw new Error('ログイン状態が変わりました。');
    const form=document.createElement('form');
    form.method='POST';form.action='https://script.google.com/macros/s/AKfycbyiQj1xzTDk5JHmtjfThfVp7PLPBymuG-kWHu0fRzaEgsv3X6WbDSBPq8NUZmOxPACM3w/exec';form.target='gfGasCheckFrame';
    const field=document.createElement('input');field.type='hidden';field.name='idToken';field.value=token;
    form.append(field);document.body.append(form);
    $('gasResultFrame').style.display='block';
    form.submit();form.remove();
    $('gasStatus').textContent='下の枠にGAS側の確認結果が表示されます。';
  }catch(e){$('gasStatus').textContent='確認できませんでした。再ログインして試してください。';}
  finally{btn.disabled=false;}
});
$('preview').addEventListener('click',()=>{const name=$('staffName').value.trim(),email=$('staffEmail').value.trim(),role=$('staffRole').value;const out=$('previewResult');out.className='message error';if(!name||!email||!$('staffEmail').checkValidity()||!['staff','accounting','admin'].includes(role)){out.textContent='スタッフ名、正しいメールアドレス、役割を確認してください。';return}out.className='message success';out.textContent='入力確認OK（未送信）\n氏名：'+name+'\nメール：'+email+'\n役割：'+({staff:'スタッフ',accounting:'経理',admin:'管理者'}[role])+'\n※メール送信や登録は行っていません。'});
onAuthStateChanged(auth,async user=>{const seq=++checkSeq;if(!user){showPanel('signedOut');$('inviteForm').style.display='none';return}showPanel('checking');try{const snap=await getDoc(doc(db,'staffAccess',user.uid));if(seq!==checkSeq||auth.currentUser?.uid!==user.uid)return;const a=snap.exists()?snap.data():null;const allowed=a?.role==='admin'&&a?.status==='active'&&a?.enabled===true;showAccess(user,allowed,allowed?'Firestoreの本人UIDに紐づく管理者権限を確認しました。GAS側の確認は未接続です。':'本人の管理者権限が登録されていないか、無効になっています。')}catch(e){if(seq!==checkSeq||auth.currentUser?.uid!==user.uid)return;showAccess(user,false,'権限確認に失敗しました。（'+(e?.code||'error')+'）')}});
</script></body></html>
