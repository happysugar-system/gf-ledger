<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>車両依頼受付 | GOLD FIRST</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20252b;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;padding:24px}main{background:white;border:1px solid #e1e4e8;border-radius:18px;padding:36px 24px;max-width:440px;width:100%;text-align:center}small{letter-spacing:.15em;color:#555}h1{font-size:24px}p{line-height:1.8;font-size:15px}.mark{font-size:48px;color:#237a48;margin-top:20px}#receipt{overflow-wrap:anywhere;font-size:12px;color:#555}
</style></head><body><main><small>GOLD FIRST</small><div id="mark" class="mark" aria-hidden="true"></div><h1 id="heading">車両依頼受付</h1><p id="message">受付番号を確認できません。再送信せず、担当者に受付状況をご確認ください。</p><p id="receipt"></p></main><script>
const receipt=new URLSearchParams(location.search).get('receipt')||'';

document.getElementById('receipt').textContent='受付番号：'+receipt;
}
</script></body></html>
