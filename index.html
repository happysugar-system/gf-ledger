<script>
/*
 * GF157｜PWA内メールコード認証＋通知バッジ
 *
 * 公開可能なPublishableキーのみ使用。
 * Secretキー・service_roleキーは禁止。
 */

const SUPABASE_URL =
  'https://tgxrnrqxafytyqfwwsag.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW';

const REGISTRATION_URL =
  'https://happysugar-system.github.io/gf-mypage-demo/admin-registrations.html';

const $ = id => document.getElementById(id);

let gfClient = null;
let adminVerified = false;
let refreshInProgress = false;
let authSequence = 0;
let pendingOtpEmail = '';
let currentLineCount = null;
let currentRegistrationCount = null;
let authCheckInProgress = false;

// 既存リンクは変更しない
function openLedger(){
  window.location.href =
    'https://script.google.com/macros/s/AKfycbzDrU44saPdqQLxP3yyTPA8UgGkbw0fWSkNcUZp9XCEF2QErzk5uQki4_4eVDVwl4Hw0g/exec';
}

async function refreshOwnerAccessMenu(){
 const menu=$('ownerAccessMenu');if(!menu||!gfClient)return;
 menu.classList.add('hidden');
 try{
  const {data:{session}}=await gfClient.auth.getSession();
  if(!session?.access_token)return;
  const res=await fetch('https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-line-reception-admin',{
   method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_PUBLISHABLE_KEY},
   body:JSON.stringify({action:'members'})
  });
  if(res.ok)menu.classList.remove('hidden');
 }catch(e){console.info('権限メニュー判定を再試行してください')}
}
function openReception(){
  window.location.href =
    './line-reception-admin.html';
}

function openShift(){
  window.location.href =
    'https://script.google.com/macros/s/AKfycbxg5vAgqOAFFoss2u6Sso_O7_z0UMg4Hu0ku6PQ9KLIm9i3_VMwxBTXI9AbktSuHRSg/exec';
}

function openDriverRegistrations(){
  window.location.href = REGISTRATION_URL;
}

function showAuthSection(id){
  $('authBox').classList.toggle('hidden', id !== 'authLoggedIn');
  ['authLoading','authLogin','authLoggedIn']
    .forEach(name => {
      $(name).classList.toggle('hidden',name !== id);
    });
}

function setAuthStatus(message){
  $('authStatus').textContent = message;
}

function updateBadge(count, badgeId = 'registrationBadge'){
  const badge = $(badgeId);
  if(!badge) return;

  if(!Number.isInteger(count) || count <= 0){
    badge.classList.add('hidden');
    badge.textContent = '';
    badge.setAttribute('aria-label','承認待ち0件');
    return;
  }

  badge.textContent = count > 99 ? '99+' : String(count);
  badge.setAttribute('aria-label','通知'+count+'件');
  badge.classList.remove('hidden');
}

// アイコンバッジはiOS側の通知許可などが整っている場合のみ反映される。
// Web Push未設定のため、アプリを閉じている間の更新は保証しない。
async function updateAppIconBadge(){
  if(!('setAppBadge' in navigator)) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  if(currentLineCount === null || currentRegistrationCount === null) return;
  try{
    const total = currentLineCount + currentRegistrationCount;
    if(total > 0) await navigator.setAppBadge(total);
    else if('clearAppBadge' in navigator) await navigator.clearAppBadge();
  }catch(err){
    console.info('アイコンバッジは利用できません',err);
  }
}

/*
 * 既存の管理者専用RPCを利用して
 * 管理者権限を確認する。
 *
 * 非管理者はRPC側で拒否される。
 */
async function verifyAdmin(){
 const {data,error}=await gfClient.rpc('gf_staff_access_self');
 if(error)return false;
 return !!data?.[0]?.access_granted && data[0].staff_role === '最高管理者';
}

async function checkAdminSession(){
  if(!gfClient) return;

  const seq = ++authSequence;

  showAuthSection('authLoading');
  setAuthStatus('');
  // 認証確認中は古い件数を消さず、再取得成功時に更新する。
  adminVerified = false;

  try{
    const {data,error} = await gfClient.auth.getUser();

    if(seq !== authSequence) return;
    if(error || !data.user){
      currentLineCount = null;
      currentRegistrationCount = null;
      updateBadge(0);
      updateBadge(0,'lineBadge');
      showAuthSection('authLogin');
      return;
    }

    const allowed = await verifyAdmin();

    if(seq !== authSequence) return;

    if(!allowed){
      currentLineCount = null;
      currentRegistrationCount = null;
      updateBadge(0);
      updateBadge(0,'lineBadge');
      showAuthSection('authLogin');
      setAuthStatus(
        'ログイン済みですが、管理者権限がありません。' +
        '管理者として登録されたメールアドレスでログインしてください。'
      );
      return;
    }

    adminVerified = true;
    showAuthSection('authLoggedIn');

    $('loggedInText').textContent =
      '管理者ログイン中：' + (data.user.email || '');

    await refreshNotifications();

  }catch(err){
    if(seq !== authSequence) return;

    showAuthSection('authLogin');
    setAuthStatus(
      'ログイン状態を確認できませんでした。' +
      '通信状態を確認して再度お試しください。'
    );

    console.error(
      'GF155認証確認エラー',
      err.code || err.name || 'unknown'
    );
  }
}

/*
 * RLSにより閲覧可能な承認待ち申請だけ数える。
 * 件数取得に失敗した場合は0件と誤表示しない。
 */
async function refreshNotifications(){
  if(!gfClient || !adminVerified || refreshInProgress){
    return;
  }

  refreshInProgress = true;
  const seq = authSequence;

  try{
    // 法人担当者の未処理申請のみを数える（旧ドライバー申請は含めない）。
    // スタッフ認証トークンで法人管理APIに照会し、失敗時は0件と断定しない。
    const {data:{session:corporateSession}}=await gfClient.auth.getSession();
    if(!corporateSession?.access_token)throw Error('スタッフ認証を確認できません');
    const corporateResponse=await fetch(
      'https://zwprphmfgobkektzsuti.supabase.co/functions/v1/gf-company-admin-api-demo',
      {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+corporateSession.access_token},
       body:JSON.stringify({action:'dashboard'})}
    );
    if(seq !== authSequence || !adminVerified)return;
    if(corporateResponse.ok){
      const corporateData=await corporateResponse.json();
      currentRegistrationCount=(corporateData.requests||[]).filter(x=>x.status==='pending').length;
      updateBadge(currentRegistrationCount);
    }else{
      currentRegistrationCount=null;
      updateBadge(0);
      console.warn('法人担当者の承認待ち件数を取得できませんでした',corporateResponse.status);
    }

    // GF156: GASがSupabaseに同期したLINE受付の未完了件数
    const {data:lineData,error:lineError} = await gfClient
      .from('gf_portal_notification_counts')
      .select('pending_count')
      .eq('notification_type','line_reception')
      .maybeSingle();

    if(seq !== authSequence || !adminVerified) return;
    if(lineError) {
      currentLineCount = null;
      updateBadge(0,'lineBadge');
      console.error('GF156 LINE通知取得エラー',lineError.message);
    } else if(lineData && Number.isSafeInteger(lineData.pending_count)) {
      currentLineCount = lineData.pending_count;
      updateBadge(lineData.pending_count,'lineBadge');
    } else {
      currentLineCount = null;
      updateBadge(0,'lineBadge');
    }

    await updateAppIconBadge();

    setAuthStatus(
      currentRegistrationCount===null?'法人担当者の承認件数を取得できませんでした。時間をおいて再度更新してください。':'法人担当者の承認待ち：'+currentRegistrationCount+'件'
    );

  }catch(err){
    if(seq !== authSequence) return;

    currentLineCount = null;
    currentRegistrationCount = null;
    updateBadge(0);
    updateBadge(0,'lineBadge');
    setAuthStatus(
      '承認待ち件数を取得できませんでした。' +
      '「承認待ち件数を更新」を押してください。'
    );

    console.error(
      'GF155通知取得エラー',
      err.code || err.name || 'unknown'
    );
  }finally{
    refreshInProgress = false;
  }
}

/*
 * Supabase Email OTP: メールテンプレートに {{ .Token }} が必要。
 * マジックリンクを開く必要がないのでPWA内で認証が完結する。
 */
async function sendAdminLogin(){
  if(!gfClient) return;
  const email = $('adminEmail').value.trim();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    setAuthStatus('メールアドレスを確認してください。');
    return;
  }
  $('loginButton').disabled = true;
  setAuthStatus('認証コードを送信しています…');
  try{
    const {error} = await gfClient.auth.signInWithOtp({
      email,
      options:{shouldCreateUser:false}
    });
    if(error) throw error;
    pendingOtpEmail = email;
    $('otpArea').classList.remove('hidden');
    setAuthStatus('メールに届いた認証コードを、このアプリに入力してください。');
    $('otpCode').focus();
  }catch(err){
    setAuthStatus('送信できませんでした：' + (err.message || '認証エラー'));
  }finally{
    $('loginButton').disabled = false;
  }
}

async function verifyAdminOtp(){
  if(!gfClient) return;
  const email = pendingOtpEmail || $('adminEmail').value.trim();
  const token = $('otpCode').value.trim().replace(/\s/g,'');
  if(!email || !/^\d{6,8}$/.test(token)){
    setAuthStatus('メールに届いた6〜8桁の数字を入力してください。');
    return;
  }
  $('verifyButton').disabled = true;
  setAuthStatus('認証中…');
  try{
    const {error} = await gfClient.auth.verifyOtp({email,token,type:'email'});
    if(error) throw error;
    $('otpCode').value = '';
    pendingOtpEmail = '';
    await checkAdminSession();
  }catch(err){
    setAuthStatus('認証できませんでした：' + (err.message || 'コードを確認してください'));
  }finally{
    $('verifyButton').disabled = false;
  }
}

async function logoutAdmin(){
  if(!gfClient) return;

  ++authSequence;
  adminVerified = false;
  currentLineCount = null;
  currentRegistrationCount = null;
  updateBadge(0);
  updateBadge(0,'lineBadge');

  const {error} = await gfClient.auth.signOut();

  if(error){
    setAuthStatus('ログアウトできませんでした。');
    await checkAdminSession();
    return;
  }

  showAuthSection('authLogin');
  $('otpArea').classList.add('hidden');
  setAuthStatus('ログアウトしました。');
}

async function initGF155(){
  if(!window.supabase){
    showAuthSection('authLogin');
    setAuthStatus('認証ライブラリを読み込めませんでした。');
    return;
  }

  gfClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

  // 先に認証イベントを登録する。
  // コールバック内ではSupabaseへの問い合わせを直接行わない。
  gfClient.auth.onAuthStateChange((event) => {
    if(event === 'SIGNED_IN' ||
       event === 'SIGNED_OUT'){
      setTimeout(() => {checkAdminSession();refreshOwnerAccessMenu()},0);
    }
  });

  await checkAdminSession();
  await refreshOwnerAccessMenu();

  // 60秒ごとに件数更新
  setInterval(() => {
    if(!document.hidden){
      refreshNotifications();
    }
  },60000);

  // アプリに戻ったときに更新
  document.addEventListener('visibilitychange',() => {
    if(!document.hidden){
      checkAdminSession();
      refreshOwnerAccessMenu();
    }
  });

  window.addEventListener('pageshow',(event) => {
    if(event.persisted){
      checkAdminSession();
      refreshOwnerAccessMenu();
    }
  });
}

async function logoutStaff(){
 const btn=document.querySelector('.staffLogout');
