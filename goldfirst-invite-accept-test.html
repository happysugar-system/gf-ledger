<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLDFIRST 招待承認テスト</title><style>body{font-family:system-ui,sans-serif;background:#fffaf0;color:#222;margin:0}main{max-width:480px;margin:30px auto;padding:24px;background:#fff;border-radius:18px;box-shadow:0 8px 24px #0001}label{display:block;margin:16px 0 6px}input,button{font-size:16px;padding:12px;width:100%;box-sizing:border-box;border-radius:9px}input{border:1px solid #bbb}button{border:0;background:#222;color:#fff;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#eee;color:#222}p{line-height:1.6}iframe{width:100%;height:150px;border:1px solid #ddd;border-radius:8px}</style></head><body><main><h1>GOLDFIRST 招待承認</h1><p>テスト環境専用。招待済みのメールアドレスでログインしてください。メール送信はありません。</p><div id="login"><label>メールアドレス</label><input id="email" type="email" autocomplete="email"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="emailBtn">メールでログイン</button><button id="googleBtn" class="secondary">Googleでログイン</button></div><div id="signed" hidden><p id="who"></p><button id="accept">招待を承認して利用開始</button><button id="logout" class="secondary">ログアウト</button></div><p id="msg" role="status"></p><section id="results" hidden><h2>GASの処理結果</h2><iframe name="gf_accept_result" title="承認結果"></iframe></section></main><form id="post" method="POST" target="gf_accept_result" action="https://script.google.com/macros/s/AKfycbyiQj1xzTDk5JHmtjfThfVp7PLPBymuG-kWHu0fRzaEgsv3X6WbDSBPq8NUZmOxPACM3w/exec" hidden><input name="action" value="invite_accept_v1"><input name="idToken"></form><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyBkwuHDs1XRq8WXhDOeSIgK7X7WcYLnrCM',authDomain:'goldfirst-auth-test.firebaseapp.com',projectId:'goldfirst-auth-test',appId:'1:1079109139578:web:4c400be3aab323d7b0cfc3'});
const auth=getAuth(app),$=id=>document.getElementById(id);let busy=false;
$('emailBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('msg').textContent='ログイン失敗: '+e.code}};
$('googleBtn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('msg').textContent='ログイン失敗: '+e.code}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{$('login').hidden=!!user;$('signed').hidden=!user;$('results').hidden=true;busy=false;$('accept').disabled=false;$('who').textContent=user?'ログイン中: '+(user.email||'') : '';$('msg').textContent=user?(user.emailVerified?'メール確認済み。招待されていれば承認できます。':'メール認証が必要です。'):'ログインしてください。'});
$('accept').onclick=async()=>{if(busy)return;const user=auth.currentUser;if(!user)return;if(!user.emailVerified){$('msg').textContent='メール認証が必要です。';return}if(!confirm('このメールアドレスの招待を承認しますか？\n'+user.email))return;busy=true;$('accept').disabled=true;try{const token=await user.getIdToken(true);if(auth.currentUser?.uid!==user.uid)return;const form=$('post');form.elements.namedItem('idToken').value=token;$('results').hidden=false;form.submit();form.elements.namedItem('idToken').value='';$('msg').textContent='送信しました。下の結果を確認してください。再送信はしないでください。';}catch(e){busy=false;$('accept').disabled=false;$('msg').textContent='送信失敗: '+(e.code||'error')}};
</script></body></html>
