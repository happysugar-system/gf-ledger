<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLDFIRST スタッフ招待（画面デモ）</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans JP',sans-serif;background:linear-gradient(130deg,#f6edda,#fffdfa 48%);color:#222}main{max-width:500px;margin:auto;padding:35px 18px 55px;text-align:center}.logo{width:120px;height:120px;object-fit:contain}.line{height:2px;width:62px;background:#bc9135;margin:8px auto 20px}h1{font-size:25px;margin:0 0 8px}.sub{font-size:13px;color:#777;line-height:1.7}.card{background:#fff;border:1px solid #eee1cb;border-radius:20px;padding:24px;text-align:left;margin-top:24px;box-shadow:0 10px 30px #00000009}label{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}input,select{width:100%;font:inherit;padding:13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}button{width:100%;padding:14px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:700;font-size:15px;margin-top:23px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.hint{font-size:12px;color:#666;line-height:1.8}.warn{background:#fff4d8;border-radius:10px;padding:13px;font-size:12px;line-height:1.8;margin-top:18px;color:#795a20}.ok{color:#1d713a;font-weight:700}.err{color:#b42318;font-weight:700}#form,#result{display:none}#result{line-height:1.8;overflow-wrap:anywhere}a{color:#8a641e}small{font-size:12px;color:#777}</style></head><body><main>
<img class="logo" src="./icon.png" alt="GOLDFIRST"><div class="line"></div><h1>スタッフ招待</h1><div class="sub">Firebase 管理者確認付き・画面デモ</div>
<div class="card" id="status" aria-live="polite">Firebaseのログイン状態を確認しています…</div>
<section class="card" id="form"><h2 style="margin:0">招待内容を作成</h2><p class="hint">招待メールの送信やデータ登録は、まだ行いません。</p>
<label for="email">招待先メールアドレス</label><input id="email" type="email" autocomplete="off" placeholder="staff@example.com" required>
<label for="role">担当区分</label><select id="role"><option value="vehicle">車両担当</option><option value="office">事務担当</option><option value="admin">管理者</option></select>
<label for="memo">メモ（任意）</label><input id="memo" maxlength="100" placeholder="例：デモスタッフ">
<button id="preview">招待内容を確認（送信しない）</button><div class="warn">🔒 この画面はプレビュー専用です。メール送信・Firestore書き込み・アカウント作成は行いません。実スタッフの個人情報は入力しないでください。</div></section>
<section class="card" id="result" aria-live="polite"></section>
</main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBkwuHDs1XRq8WXhDOeSIgK7X7WcYLnrCM',authDomain:'goldfirst-auth-test.firebaseapp.com',projectId:'goldfirst-auth-test',storageBucket:'goldfirst-auth-test.firebasestorage.app',messagingSenderId:'1079109139578',appId:'1:1079109139578:web:4c400be3aab323d7b0cfc3',measurementId:'G-V19ZKK82P6'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let allowed=false,seq=0;
onAuthStateChanged(auth,async user=>{const s=++seq;allowed=false;$('form').style.display='none';$('result').style.display='none';if(!user){$('status').textContent='ログインしていません。先に管理者確認テスト画面からログインしてください。';const a=document.createElement('a');a.href='./goldfirst-firebase-login-test.html';a.textContent=' ログイン画面を開く';$('status').append(a);return} $('status').textContent='管理者権限を確認しています…';try{const snap=await getDoc(doc(db,'staffAccess',user.uid));if(s!==seq)return;const data=snap.exists()?snap.data():{};allowed=data.role==='admin'&&data.status==='active'&&data.enabled===true;$('status').textContent=allowed?'✓ 管理者確認OK（画面デモ）':'利用権限がありません。';$('status').className='card '+(allowed?'ok':'err');$('form').style.display=allowed?'block':'none'}catch(e){if(s!==seq)return;$('status').textContent='権限確認に失敗しました（'+(e.code||'通信エラー')+'）。';$('status').className='card err'}});
$('preview').addEventListener('click',()=>{if(!allowed)return;const email=$('email').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('email').reportValidity();return}const names={vehicle:'車両担当',office:'事務担当',admin:'管理者'};const result=$('result');result.replaceChildren();const h=document.createElement('h2');h.textContent='招待内容の確認（未送信）';result.append(h);for(const t of ['送信先：'+email,'担当区分：'+names[$('role').value],'メモ：'+($('memo').value||'なし')]){const p=document.createElement('p');p.textContent=t;result.append(p)}const small=document.createElement('small');small.textContent='メールは送信されていません。Firestoreにも保存していません。';result.append(small);result.style.display='block'});
</script></body></html>
