<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GOLD FIRST">
<title>GOLD FIRST 業務システム【テスト】</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#171717}
body{background:radial-gradient(circle at 10% 8%,rgba(207,164,64,.12),transparent 22%),radial-gradient(circle at 95% 62%,rgba(207,164,64,.10),transparent 25%),linear-gradient(180deg,#fff 0%,#fffdf8 100%)}
main{min-height:100vh;display:flex;justify-content:center;padding:44px 22px 34px}.portal{width:min(440px,100%);text-align:center}.logo{width:190px;height:190px;object-fit:contain;margin:8px auto 8px;display:block}.goldline{width:62px;height:2px;background:#c69a2d;margin:4px auto 26px}h1{font-size:34px;line-height:1.25;margin:0 0 14px;font-weight:800;letter-spacing:.02em}.sub{font-size:16px;line-height:1.7;color:#777;margin:0 0 38px}
.menu{width:100%;border:1px solid #eee;background:rgba(255,255,255,.96);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px;text-align:left;box-shadow:0 10px 26px rgba(0,0,0,.08);cursor:pointer;-webkit-tap-highlight-color:transparent;margin:0 0 14px}.menu:active{transform:scale(.99)}.menuIcon{width:64px;height:64px;border-radius:17px;background:#fff4d8;display:grid;place-items:center;font-size:31px;flex:none}.menuText{flex:1;min-width:0}.menuTitle{display:block;font-size:20px;font-weight:800}.menuSub{display:block;font-size:14px;color:#777;margin-top:5px}.arrow{font-size:34px;color:#c49a31;line-height:1}.note{margin-top:42px;padding:16px 18px;border-radius:15px;background:rgba(255,255,255,.72);color:#888;font-size:13px;line-height:1.7}
.card{border:1px solid #eee;border-radius:20px;background:white;padding:22px;margin-bottom:20px;text-align:left;box-shadow:0 8px 22px #0000000b}.card h2{font-size:20px;margin:0 0 16px}.field{display:block;font-size:14px;margin-bottom:12px}.field input{display:block;width:100%;font:inherit;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:6px}.action{width:100%;border:0;border-radius:12px;background:#b48a25;color:white;padding:14px;font:inherit;font-weight:700;cursor:pointer;margin-top:7px}.action.secondary{background:#f7f2e8;color:#4d3a16}.action:disabled{opacity:.55}.status{font-size:13px;line-height:1.6;color:#666;white-space:pre-wrap}.error{color:#ae2929}.user{font-size:13px;color:#777;margin:0 0 14px}.hidden{display:none!important}
</style>
</head>
<body>
<main><div class="portal">
<img class="logo" src="./icon.png" alt="GOLD FIRST"><div class="goldline"></div><h1>業務システム</h1>
<p class="sub">GOLD FIRST の各種システムに<br>アクセスできます。</p><div style="padding:10px;margin-bottom:16px;background:#fff0ca;border-radius:12px;font-weight:700;color:#805400">テスト環境：本番トップ画面は変更していません</div>
<div id="loading" class="status">ログイン状態を確認しています…</div>
<section id="login" class="card hidden" aria-label="スタッフログイン">
<h2>スタッフログイン</h2>
<label class="field">メールアドレス<input id="email" type="email" autocomplete="username"></label>
<label class="field">パスワード<input id="password" type="password" autocomplete="current-password"></label>
<button class="action" id="emailLogin" type="button">メールでログイン</button>
<button class="action secondary" id="googleLogin" type="button">Googleでログイン</button>
<p id="loginMessage" class="status" role="status"></p>
</section>
<section id="home" class="hidden">
<p class="user" id="who"></p>
<p id="accessMessage" class="status" role="status"></p>
<div id="menus" class="hidden">
<button class="menu" type="button" id="ledger"><span class="menuIcon">🚗</span><span class="menuText"><span class="menuTitle">車両・ドライバー管理</span><span class="menuSub">開く</span></span><span class="arrow">›</span></button>
<a class="menu hidden" id="invite" href="./goldfirst-staff-invite-step4.html" style="text-decoration:none;color:inherit"><span class="menuIcon">👥</span><span class="menuText"><span class="menuTitle">スタッフ招待管理</span><span class="menuSub">管理者のみ（テスト）</span></span><span class="arrow">›</span></a>
</div>
<button class="action secondary" type="button" id="logout">ログアウト</button>
</section>
<div class="note">ログイン後、車両管理の画面確認版に移動します。保存・更新は無効です。本番GASのアクセス制御は未接続です。</div>
</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
// 既存の動作確認済みFirebaseテスト設定。秘密鍵ではありません。
const app=initializeApp({apiKey:'AIzaSyBkwuHDs1XRq8WXhDOeSIgK7X7WcYLnrCM',authDomain:'goldfirst-auth-test.firebaseapp.com',projectId:'goldfirst-auth-test',appId:'1:1079109139578:web:4c400be3aab323d7b0cfc3'});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const ledgerUrl='./vehicle-test.html';
let sequence=0;
$('ledger').onclick=()=>{location.href=ledgerUrl};
$('emailLogin').onclick=async()=>{try{$('loginMessage').textContent='';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginMessage').textContent='ログインできませんでした：'+(e.code||'エラー')}};
$('googleLogin').onclick=async()=>{try{$('loginMessage').textContent='';await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('loginMessage').textContent='ログインできませんでした：'+(e.code||'エラー')}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
 const n=++sequence;$('loading').classList.add('hidden');$('login').classList.toggle('hidden',!!user);$('home').classList.toggle('hidden',!user);$('menus').classList.add('hidden');$('invite').classList.add('hidden');
 if(!user)return;
 $('who').textContent=user.email||'ログイン中';$('accessMessage').textContent='利用権限を確認しています…';
 try{
  const snap=await getDoc(doc(db,'staffAccess',user.uid));if(n!==sequence)return;
  const access=snap.exists()?snap.data():null;
  const valid=access?.enabled===true&&access?.status==='active'&&['admin','staff','accounting'].includes(access?.role)&&user.emailVerified===true;
  if(!valid){$('accessMessage').textContent='利用権限がありません。管理者に確認してください。';return}
  $('accessMessage').textContent='ログイン中';$('menus').classList.remove('hidden');
  if(access.role==='admin')$('invite').classList.remove('hidden');
 }catch(e){if(n===sequence)$('accessMessage').textContent='権限を確認できませんでした。再度お試しください。'}
});
</script>
</body></html>
