<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLD FIRST｜任意保険申込み</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#20242b;font:16px/1.55 -apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}header{background:#17212e;color:white;padding:22px 18px}header small{opacity:.8}header h1{font-size:22px;margin:4px 0}main{max-width:540px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px #0001}label{display:block;font-weight:700;margin:17px 0 7px}input[type=text],input[type=tel]{width:100%;padding:13px;border:1px solid #cbd2db;border-radius:10px;font:inherit}.help{font-size:13px;color:#657181}.photo{border:1px solid #dce1e8;border-radius:12px;padding:12px;margin-top:12px}.photo b{display:block;margin-bottom:9px}.photo img{display:none;width:100%;max-height:260px;object-fit:contain;margin:10px auto;border-radius:8px}.photo.done img{display:block}.photo .status{font-size:13px;color:#596575}.btn{width:100%;background:#18212c;color:#fff;border:0;border-radius:11px;padding:14px;font:700 16px/1.4 inherit;cursor:pointer}.btn:disabled{opacity:.5}.photo .btn{background:#eef1f5;color:#222}.photo .library{margin-top:8px;background:#fff;border:1px solid #cbd2db}.photo .library-input{display:none}.submit{background:#06c755;margin-top:18px}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0c1017;color:white;padding:16px;flex-direction:column}.modal.on{display:flex}.camera-top{display:flex;justify-content:space-between;align-items:center}.camera-top button{background:#353c46;color:white;border:0;border-radius:9px;padding:9px 13px}.stage{position:relative;flex:1;min-height:180px;display:grid;place-items:center;overflow:hidden;margin:15px 0;background:#222;border-radius:12px}.stage video{position:absolute;width:100%;height:100%;object-fit:cover}.guide{position:absolute;width:88%;aspect-ratio:1.586;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 100vmax #0005;pointer-events:none}.guide.a4{width:auto;height:min(78%, 68vh);max-width:88%;aspect-ratio:210 / 297;border-radius:5px}.camera-help{font-size:13px;text-align:center}.shutter{border:5px solid white;background:#fff5;width:72px;height:72px;border-radius:50%;margin:12px auto}.fallback{display:block;text-align:center;padding:12px;background:#303b49;border-radius:10px}.fallback input{display:none}#result{white-space:pre-line;text-align:center;font-weight:700;padding:10px}.hidden{display:none!important}</style></head><body>
<header><small>GOLD FIRST</small><h1>任意保険 お見積もり・加入申込み</h1></header><main><div class="card"><p>必要事項と書類をご登録ください。内容を確認後、担当スタッフよりご連絡いたします。</p><form id="form" method="POST" target="gf197_receiver"><input type="hidden" name="action" value="gf197_insurance_submit"><input type="hidden" name="gf_ins_entry" id="entry"><input type="hidden" name="sendKey" id="sendKey"><label for="name">氏名 <span style="color:#c33">*</span></label><input id="name" name="name" type="text" maxlength="80" autocomplete="name" required><label for="phone">電話番号 <span style="color:#c33">*</span></label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required><h3>提出書類</h3><p class="help">書類の文字が読めるように撮影してください。毎回のご提出をお願いします。</p>
<div class="photo" id="registrationBox"><b>① 車検証</b><button type="button" class="btn" onclick="openCamera('registration')">カメラで撮影する</button><button type="button" class="btn library" onclick="openLibrary('registration')">写真ライブラリから選ぶ</button><input class="library-input" id="registrationLibrary" type="file" accept="image/*" onchange="selectFile(this,'registration')"><img id="registrationPreview" alt="車検証プレビュー"><div class="status" id="registrationStatus">未撮影</div><input type="hidden" name="registration" id="registrationData"></div>
<div class="photo" id="frontBox"><b>② 運転免許証・表</b><button type="button" class="btn" onclick="openCamera('front')">カメラで撮影する</button><button type="button" class="btn library" onclick="openLibrary('front')">写真ライブラリから選ぶ</button><input class="library-input" id="frontLibrary" type="file" accept="image/*" onchange="selectFile(this,'front')"><img id="frontPreview" alt="免許証表プレビュー"><div class="status" id="frontStatus">未撮影</div><input type="hidden" name="front" id="frontData"></div>
<div class="photo" id="backBox"><b>③ 運転免許証・裏</b><button type="button" class="btn" onclick="openCamera('back')">カメラで撮影する</button><button type="button" class="btn library" onclick="openLibrary('back')">写真ライブラリから選ぶ</button><input class="library-input" id="backLibrary" type="file" accept="image/*" onchange="selectFile(this,'back')"><img id="backPreview" alt="免許証裏プレビュー"><div class="status" id="backStatus">未撮影</div><input type="hidden" name="back" id="backData"></div>
<button type="submit" class="btn submit" id="submit">この内容で申し込む</button><p class="help">送信完了が表示されるまで画面を閉じないでください。</p></form><div id="result" role="status"></div></div></main>
<div class="modal" id="cameraModal"><div class="camera-top"><b id="cameraTitle">書類を撮影</b><button type="button" onclick="closeCamera()">閉じる</button></div><div class="stage"><video id="video" playsinline autoplay muted></video><div class="guide" id="guide"></div></div><div class="camera-help" id="cameraHint">枠内に書類を合わせて撮影してください。</div><button class="shutter" type="button" onclick="takePhoto()" aria-label="撮影"></button><label class="fallback">写真ライブラリから選ぶ<input id="fallback" type="file" accept="image/*" onchange="selectFile(this,current)"></label></div><canvas id="canvas" class="hidden"></canvas><iframe name="gf197_receiver" id="receiver" class="hidden" title="送信先"></iframe>
<script>
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);let current='',stream=null,busy=false,completed=false;
const entry=params.get('gf_ins_entry')||''; $('entry').value=entry;
const existingKey=sessionStorage.getItem('gf197_key_'+entry);const key=existingKey||Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('gf197_key_'+entry,key);$('sendKey').value=key;
const gasURL='__GAS_EXEC_URL__'; // GASの /exec URLに置換する
$('form').action=gasURL;
async function openCamera(side){current=side;$('cameraTitle').textContent=side==='registration'?'車検証を撮影':side==='front'?'免許証・表を撮影':'免許証・裏を撮影';$('cameraHint').textContent=side==='registration'?'A4の車検証を縦向きの枠に合わせて撮影してください。':'免許証を横向きの枠に合わせて撮影してください。';$('guide').classList.toggle('a4',side==='registration');$('cameraModal').classList.add('on');document.body.style.overflow='hidden';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('カメラ非対応');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;await $('video').play()}catch(e){$('cameraHint').textContent='カメラを使用できません。下の「写真ライブラリから選ぶ」から写真を選択してください。'}}
function closeCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('cameraModal').classList.remove('on');document.body.style.overflow=''}
function setPhoto(side,data){$(side+'Data').value=data;$(side+'Preview').src=data;$(side+'Box').classList.add('done');$(side+'Status').textContent='✓ 撮影済み（押すと撮り直せます）';closeCamera()}
function takePhoto(){const v=$('video'),g=$('guide');if(!v.videoWidth)return alert('カメラを準備中です');const vr=v.getBoundingClientRect(),gr=g.getBoundingClientRect();const scale=Math.max(vr.width/v.videoWidth,vr.height/v.videoHeight);const rw=v.videoWidth*scale,rh=v.videoHeight*scale;const sx=Math.max(0,(gr.left-vr.left+(rw-vr.width)/2)/scale),sy=Math.max(0,(gr.top-vr.top+(rh-vr.height)/2)/scale),sw=Math.min(v.videoWidth-sx,gr.width/scale),sh=Math.min(v.videoHeight-sy,gr.height/scale);const c=$('canvas');c.width=1280;c.height=Math.round(1280*sh/sw);c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);setPhoto(current,c.toDataURL('image/jpeg',.83))}
function openLibrary(side){$(side+'Library').click()}
function selectFile(input,side){const f=input.files?.[0];if(!f)return;if(!/^image\//.test(f.type))return alert('画像ファイルを選んでください');const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const c=$('canvas'),ratio=Math.min(1,1600/img.width,1600/img.height);c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);setPhoto(side,c.toDataURL('image/jpeg',.8));input.value=''};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした')};img.src=url}
$('form').addEventListener('submit',e=>{if(completed||busy){e.preventDefault();return}if(!/^[a-f0-9]{64}$/i.test(entry)){e.preventDefault();return alert('LINEの任意保険メニューから開き直してください')}if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(gasURL)){e.preventDefault();return alert('送信先が未設定です')}for(const id of ['registration','front','back'])if(!$(id+'Data').value){e.preventDefault();return alert('車検証・免許証の表裏を撮影してください')}if(!confirm('この内容で任意保険を申し込みますか？')){e.preventDefault();return}busy=true;$('submit').disabled=true;$('submit').textContent='送信中…';$('result').textContent='送信しています。画面を閉じないでください。';setTimeout(()=>{if(!completed&&busy){busy=false;$('submit').disabled=false;$('submit').textContent='再送信する';$('result').textContent='結果の確認に時間がかかっています。受付が重複しないよう同じ送信キーで再送信します。'}},90000)});
window.addEventListener('message',e=>{if(e.origin!=='https://script.google.com'&&e.origin!=='https://script.googleusercontent.com')return;const d=e.data;if(!d||d.source!=='GF197_INSURANCE')return;busy=false;if(d.ok){completed=true;$('form').classList.add('hidden');$('result').textContent='受付が完了しました。\n受付番号：'+d.receipt+'\n担当スタッフよりご連絡いたします。';sessionStorage.removeItem('gf197_key_'+entry)}else{$('submit').disabled=false;$('submit').textContent='もう一度送信する';$('result').textContent='送信できませんでした：'+(d.message||'しばらくしてから再度お試しください')}});
</script></body></html>
