<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD FIRST｜マイページ進捗管理</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f5f6f2;color:#20342d}header{background:#164b3c;color:white;padding:20px}main{max-width:850px;margin:auto;padding:18px}section{background:white;padding:20px;border-radius:15px;margin:16px 0;box-shadow:0 2px 10px #0001}input,select,button{font:inherit;padding:12px;border:1px solid #cbd5d1;border-radius:8px;max-width:100%}input,select{width:100%}button{background:#19634e;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:block;margin:16px 0 6px;font-weight:bold}.muted{color:#63736f;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.warning{color:#9b3425;font-weight:bold}a{color:inherit}#editor[hidden]{display:none}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head>
<body><header><a href="./line-reception-admin.html">← 受付管理に戻る</a><h2>ドライバーマイページ｜車両進捗</h2></header><main>
<section><p class="muted">スタッフ権限でログインした利用者だけが操作できます。車両台帳の「空車・貸出中」「管理区分」は変更しません。</p><button id="reload">車両一覧を更新</button><p id="message" role="status">権限を確認中…</p></section>
<section id="editor" hidden><label for="search">車番・DriverIDで検索</label><input id="search" placeholder="車番またはDriverID"><label for="vehicle">対象車両</label><select id="vehicle"></select>
<div class="grid"><div><label for="stage">マイページの進捗</label><select id="stage"><option>車両準備中</option><option>車両手配済み</option><option>名義変更前</option><option>名義変更中</option><option>名義変更済み</option></select></div><div><label>DriverID</label><p id="driverId"></p></div></div>
<div class="grid"><div><label for="available">納車可能日（この日以降）</label><input type="date" id="available"></div><div><label for="confirmed">納車確定日</label><input type="date" id="confirmed"></div></div>
<p id="warning" class="warning"></p><p id="footnote" class="muted">保存すると本人のマイページに進捗が反映されます。納車可能日・確定日は必要に応じて入力してください。</p>
<button id="save">進捗を保存</button></section>
</main><script>
const $=id=>document.getElementById(id);
const client=supabase.createClient('https://tgxrnrqxafytyqfwwsag.supabase.co','sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW');
const url='https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-vehicle-progress-admin';
let vehicles=[],progress=[],current=null;
async function api(action,payload={}){const {data:{session},error}=await client.auth.getSession();if(error||!session?.access_token)throw Error('共通ログインが必要です。トップ画面からログインしてください。');
const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_Xu-kPNJqnHFGoGb9rI5SVg_h1B2f-dW'},body:JSON.stringify({action,...payload})});const data=await res.json();if(!res.ok)throw Error(({not_authorized:'受付スタッフ権限がありません',contract_not_completed:'契約が完了していません',vehicle_driver_link_mismatch:'車両とDriverIDの紐付けが変更されました',vehicle_reassignment_needs_review:'別車両の進捗が登録済みです。管理者確認が必要です'}[data.error])||data.error||'APIエラー');return data}
function options(){const q=$('search').value.trim().toLowerCase();$('vehicle').replaceChildren();const matches=vehicles.filter(v=>(v.vehicle_number+' '+v.driver_id).toLowerCase().includes(q));$('vehicle').add(new Option('車両を選択してください',''));for(const v of matches.slice(0,150))$('vehicle').add(new Option(v.vehicle_number+' / '+v.driver_id,v.vehicle_id));}
function selectVehicle(){const v=vehicles.find(v=>v.vehicle_id===$('vehicle').value);current=v||null;$('driverId').textContent=v?.driver_id||'未選択';const p=progress.find(x=>x.driver_id===v?.driver_id && x.vehicle_id===v?.vehicle_id);$('stage').value=p?.stage||'車両準備中';$('available').value=p?.delivery_available_date||'';$('confirmed').value=p?.delivery_confirmed_date||'';check()}
function check(){const ready=current && $('stage').value==='名義変更済み' && !$('available').value;$('warning').textContent=ready?'名義変更が完了しています。納車可能日も入力してください。':'';$('save').disabled=!current}
async function load(){ $('message').textContent='読み込み中…';$('reload').disabled=true;try{const d=await api('list');vehicles=d.vehicles||[];progress=d.progress||[];$('editor').hidden=false;options();selectVehicle();
const requestedVehicle=new URLSearchParams(window.location.search).get('vehicle_id');
if(requestedVehicle){
 const selected=vehicles.find(v=>v.vehicle_id===requestedVehicle);
 if(selected){$('search').value=selected.vehicle_number;options();$('vehicle').value=selected.vehicle_id;selectVehicle()}
 else $('message').textContent='対象車両は見つかりません。車番で検索してください。';
}
if(!requestedVehicle||vehicles.some(v=>v.vehicle_id===requestedVehicle))$('message').textContent='DriverID付き車両 '+vehicles.length+' 件を読み込みました'}catch(e){$('editor').hidden=true;$('message').textContent='読み込み失敗：'+e.message}finally{$('reload').disabled=false}}
$('search').addEventListener('input',()=>{options();selectVehicle()});$('vehicle').addEventListener('change',selectVehicle);$('stage').addEventListener('change',check);$('available').addEventListener('change',check);$('reload').onclick=load;
$('save').onclick=async()=>{if(!current)return;const v=current,stage=$('stage').value,available=$('available').value,confirmed=$('confirmed').value;if(available&&confirmed&&confirmed<available){alert('納車確定日は納車可能日以降にしてください');return}if(!confirm(v.vehicle_number+' / '+v.driver_id+' の進捗を「'+stage+'」にしますか？'))return;$('save').disabled=true;$('message').textContent='保存しています…';try{await api('save',{vehicle_id:v.vehicle_id,driver_id:v.driver_id,stage,delivery_available_date:available,delivery_confirmed_date:confirmed});await load();$('search').value=v.vehicle_number;options();$('vehicle').value=v.vehicle_id;selectVehicle();$('message').textContent='保存しました。本人マイページへの反映は再読み込み後に確認できます。'}catch(e){$('message').textContent='保存できませんでした：'+e.message;check()}};
load();
</script></body></html>
