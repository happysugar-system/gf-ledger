<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLD FIRST｜代車手配申込（デモ）</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font:16px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:620px;margin:auto;padding:16px 12px 40px}.card{background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 3px 14px #0001}.availability{background:#edf5f1;border-radius:14px;text-align:center;padding:18px;margin-bottom:22px}.count{font-size:40px;font-weight:800;color:#17684e}h1{font-size:24px;margin:0 0 12px}label{display:block;font-weight:700;margin:17px 0 6px}input,select,textarea{width:100%;font:inherit;padding:13px;border:1px solid #ccd1d6;border-radius:10px;background:white}textarea{min-height:90px}.muted{font-size:13px;color:#667}.warn{background:#fff7e8;border-radius:10px;padding:12px;font-size:14px}button{border:0;background:#222;color:white;border-radius:12px;padding:15px;font:inherit;font-weight:700;width:100%;margin-top:20px}button:disabled{background:#aaa}#status{margin-top:12px;white-space:pre-wrap}</style><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><main class="wrap"><section class="card"><h1>🚗 代車手配のお申し込み</h1><div class="availability"><div>ただいま手配可能な代車</div><div class="count" id="count">確認中</div><div class="muted">車両台帳の「空車」から取得。申込時の確保を保証するものではありません。</div></div><div class="warn" id="notice">ご登録済みの情報は自動表示されます。表示されない場合は、お名前と電話番号をご入力ください。※デモ受付として保存されます。代車の予約はまだ確定しません。</div><form id="form"><label for="name">お名前</label><input id="name" autocomplete="name" required maxlength="80" placeholder="お名前を入力してください"><div class="muted" id="identity">登録情報を確認しています。マイページ未登録の方も入力できます。</div><label for="phone">電話番号</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" required placeholder="電話番号を入力してください"><label id="phoneChangedLabel" style="font-weight:400;display:none"><input id="phoneChanged" type="checkbox" style="width:auto"> 登録済みの電話番号を変更したい</label><div class="muted" id="phoneHelp">電話番号が表示されない場合はご入力ください。変更・登録の反映は送信機能の完成後に対応します。</div><label for="lease">現在GOLD FIRSTのリースをご利用中ですか？</label><select id="lease" required><option value="">選択してください</option><option>はい</option><option>いいえ</option><option>わからない</option></select><label for="repair">GOLD FIRSTへ修理入庫予定はありますか？</label><select id="repair" required><option value="">選択してください</option><option>はい</option><option>いいえ</option><option>未定</option></select><label for="start">利用開始希望日</label><input id="start" type="date" required><label style="font-weight:400"><input id="startUnknown" type="checkbox" style="width:auto"> 利用開始日はまだ決まっていない</label><label for="period">利用予定期間</label><select id="period" required><option value="">選択してください</option><option>1日</option><option>2〜3日</option><option>4〜7日</option><option>1週間以上</option><option>未定</option></select><label for="memo">その他のご希望（任意）</label><textarea id="memo"></textarea><button id="login" type="button" hidden>LINEで本人確認して申し込む</button><button id="submit" disabled>確認中…</button><div id="status" role="status"></div></form></section></main><script>
'use strict';
// 静的GitHub Pagesに秘密鍵を置かないこと。認証・台数取得・登録はサーバー側で実装する。
// 接続先とLIFF認証の検証が完了するまでは個人情報の送信を禁止する。
// 既存の車両依頼が利用するLINE受付GASの公開URL。新しいGASデプロイ反映後に動作する。
const GF161_AVAILABILITY_URL = 'https://script.google.com/macros/s/AKfycbyl6ZvZMtbKNMBZZSgol-sI8BbRI9c3K_a0oGX6Z6hzekP5Lio_lLFOfKSPYUd4prbccw/exec';
let gf161AvailabilityReceived = false;
window.GF161Availability = function(data) {
  if (!data || data.ok !== true || !Number.isSafeInteger(data.count) || data.count < 0) return;
  gf161AvailabilityReceived = true;
  document.getElementById('count').textContent = data.count + '台';
};
function gf161LoadAvailability() {
  document.getElementById('count').textContent = '確認中';
  const script = document.createElement('script');
  script.src = GF161_AVAILABILITY_URL + '?action=gf161_availability';
  script.onerror = function() { document.getElementById('count').textContent = '取得できません'; };
  document.head.appendChild(script);
  setTimeout(function() {
    if (!gf161AvailabilityReceived) document.getElementById('count').textContent = '取得できません';
    script.remove();
  }, 10000);
}
gf161LoadAvailability();
const startInput=document.getElementById('start');
const startUnknown=document.getElementById('startUnknown');
startUnknown.addEventListener('change',()=>{startInput.disabled=startUnknown.checked;startInput.required=!startUnknown.checked;if(startUnknown.checked)startInput.value='';});
const phoneInput=document.getElementById('phone');
const phoneChanged=document.getElementById('phoneChanged');
const phoneChangedLabel=document.getElementById('phoneChangedLabel');
const nameInput=document.getElementById('name');
const identity=document.getElementById('identity');
const notice=document.getElementById('notice');
const PROFILE_ENDPOINT='https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-line-driver-profile-stage';
const LIFF_ID='2012058414-9wPp65Lt';
const INTAKE_ENDPOINT='https://tgxrnrqxafytyqfwwsag.supabase.co/functions/v1/gf-replacement-request-demo';
const loginButton=document.getElementById('login');
const submitButton=document.getElementById('submit');
const statusBox=document.getElementById('status');
let readyForSubmit=false;
let pendingRequestId='';
function gfEnableSubmit(){readyForSubmit=true;submitButton.disabled=false;submitButton.textContent='デモ受付に申し込む';loginButton.hidden=true;}
function gfRequireLogin(){readyForSubmit=false;submitButton.disabled=true;submitButton.textContent='LINE本人確認後に申込できます';loginButton.hidden=false;}
let originalPhone='';
phoneChanged.addEventListener('change',()=>{
  phoneInput.readOnly=!!originalPhone&&!phoneChanged.checked;
  if(originalPhone&&!phoneChanged.checked)phoneInput.value=originalPhone;
});
function gfManualEntry(message){
 nameInput.readOnly=false;
 phoneInput.readOnly=false;
 phoneChanged.checked=false;
 phoneChangedLabel.style.display='none';
 identity.textContent=message||'マイページ未登録の方も、お名前と電話番号を入力して進められます。';
 notice.textContent='ご登録済みの情報は自動表示されます。表示されない場合は、お名前と電話番号をご入力ください。※デモ受付として保存されます。代車の予約はまだ確定しません。';
}
async function gfLoadVerifiedDriver(){
 try{
  if(!window.liff)throw Error('LINE認証SDKを読み込めませんでした');
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){
   gfManualEntry('マイページ未登録の方もお申し込みできます。LINE本人確認後に送信してください。');
   gfRequireLogin();return;
  }
  const token=liff.getIDToken();
  if(!token)throw Error('LINE本人確認情報がありません');
  gfEnableSubmit();
  const response=await fetch(PROFILE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'read',line_id_token:token})});
  const data=await response.json();
  if(!response.ok||!data.driver)throw Error(data.error||'本人情報を取得できませんでした');
  const driver=data.driver;
  nameInput.value=driver.full_name||'';
  nameInput.readOnly=!!driver.full_name;
  originalPhone=String(driver.phone_number||'').trim();
  phoneInput.value=originalPhone;
  phoneInput.readOnly=!!originalPhone;
  phoneChanged.checked=false;
  phoneChanged.disabled=!originalPhone;
  phoneChangedLabel.style.display=originalPhone?'block':'none';
  identity.textContent='マイページの登録情報を表示しています。';
  document.getElementById('phoneHelp').textContent=originalPhone?'電話番号は登録済みです。変更する場合はチェックを入れてください（送信・変更反映はまだ準備中）。':'電話番号が未登録です。入力してください（保存連携はまだ準備中）。';
  notice.textContent='ご登録済みの情報を表示しました。未登録の項目はご入力ください。※デモ受付として保存されます。代車の予約はまだ確定しません。';
 }catch(err){
  gfManualEntry('登録情報を自動表示できませんでした。マイページ未登録の方も、お名前と電話番号を入力できます。');
  if(window.liff&&liff.isLoggedIn()&&liff.getIDToken())gfEnableSubmit();else gfRequireLogin();
  console.info('プロフィール自動取得を利用できませんでした:',String(err.message||err));
 }
}
gfLoadVerifiedDriver();
loginButton.addEventListener('click',()=>{if(window.liff)liff.login({redirectUri:location.href.split('#')[0]});else statusBox.textContent='LINEの認証画面を開けませんでした。';});
document.getElementById('form').addEventListener('input',()=>{pendingRequestId='';});
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!readyForSubmit||!window.liff||!liff.isLoggedIn()||!liff.getIDToken()){gfRequireLogin();return;}
 if(!e.currentTarget.reportValidity())return;
 const phone=phoneInput.value.replace(/[\\s\\-()]/g,'');
 if(!/^0\\d{9,10}$/.test(phone)){statusBox.textContent='電話番号を確認してください。';return;}
 if(!pendingRequestId)pendingRequestId=crypto.randomUUID();
 submitButton.disabled=true;statusBox.textContent='デモ受付に保存しています…';
 try{
  const response=await fetch(INTAKE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   action:'submit',request_id:pendingRequestId,line_id_token:liff.getIDToken(),
   name:nameInput.value,phone,lease:document.getElementById('lease').value,
   repair:document.getElementById('repair').value,
   start:startUnknown.checked?'未定':startInput.value,
   period:document.getElementById('period').value,memo:document.getElementById('memo').value
  })});
  const data=await response.json();
  if(!response.ok||!data.ok)throw Error(data.error||'保存できませんでした');
  statusBox.textContent='デモ受付に保存しました。\\n受付識別子：'+data.request_id+'\\n※LINE受付管理への反映と代車予約の確定はまだ行われていません。';
  submitButton.textContent='デモ受付保存済み';submitButton.disabled=true;readyForSubmit=false;
 }catch(err){statusBox.textContent=String(err.message||err);submitButton.disabled=false;}
});
</script></body></html>
