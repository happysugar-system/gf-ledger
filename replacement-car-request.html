<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GOLD FIRST｜代車手配申込（デモ）</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font:16px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:620px;margin:auto;padding:16px 12px 40px}.card{background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 3px 14px #0001}.availability{background:#edf5f1;border-radius:14px;text-align:center;padding:18px;margin-bottom:22px}.count{font-size:40px;font-weight:800;color:#17684e}h1{font-size:24px;margin:0 0 12px}label{display:block;font-weight:700;margin:17px 0 6px}input,select,textarea{width:100%;font:inherit;padding:13px;border:1px solid #ccd1d6;border-radius:10px;background:white}textarea{min-height:90px}.muted{font-size:13px;color:#667}.warn{background:#fff7e8;border-radius:10px;padding:12px;font-size:14px}button{border:0;background:#222;color:white;border-radius:12px;padding:15px;font:inherit;font-weight:700;width:100%;margin-top:20px}button:disabled{background:#aaa}#status{margin-top:12px;white-space:pre-wrap}</style></head><body><main class="wrap"><section class="card"><h1>🚗 代車手配のお申し込み</h1><div class="availability"><div>ただいま手配可能な代車</div><div class="count" id="count">確認中</div><div class="muted">車両台帳の「空車」から取得。申込時の確保を保証するものではありません。</div></div><div class="warn" id="notice">【デモ準備中】本人認証・受付APIの接続確認が完了するまで送信できません。</div><form id="form"><label for="name">お名前</label><input id="name" autocomplete="name" required><div class="muted" id="identity">LINE連携情報を確認中</div><label for="phone">電話番号</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" required><label style="font-weight:400"><input id="phoneChanged" type="checkbox" style="width:auto"> 電話番号を変更する</label><div class="muted">変更時は本人認証を確認し、既存の連絡先変更処理と同期します。</div><label for="lease">現在GOLD FIRSTのリースをご利用中ですか？</label><select id="lease" required><option value="">選択してください</option><option>はい</option><option>いいえ</option><option>不明</option></select><label for="repair">GOLD FIRSTへ修理入庫予定はありますか？</label><select id="repair" required><option value="">選択してください</option><option>はい</option><option>いいえ</option><option>未定</option></select><label for="start">利用開始希望日</label><input id="start" type="date" required><label for="period">利用予定期間</label><select id="period" required><option value="">選択してください</option><option>1日</option><option>2〜3日</option><option>4〜7日</option><option>1週間以上</option><option>未定</option></select><label for="memo">その他のご希望（任意）</label><textarea id="memo"></textarea><button id="submit" disabled>受付連携準備中</button><div id="status" role="status"></div></form></section></main><script>
'use strict';
// 静的GitHub Pagesに秘密鍵を置かないこと。認証・台数取得・登録はサーバー側で実装する。
// 接続先とLIFF認証の検証が完了するまでは個人情報の送信を禁止する。
// 既存の車両依頼が利用するLINE受付GASの公開URL。新しいGASデプロイ反映後に動作する。
const GF161_AVAILABILITY_URL = 'https://script.google.com/macros/s/AKfycbyl6ZvZMtbKNMBZZSgol-sI8BbRI9c3K_a0oGX6Z6hzekP5Lio_lLFOfKSPYUd4prbccw/exec';
let gf161AvailabilityReceived = false;
window.GF161Availability = function(data) {
  if (!data || data.ok !== true || !Number.isSafeInteger(data.count) || data.count < 0) return;
  gf161AvailabilityReceived = true;
  document.getElementById('count').textContent = data.count + '台';
};
function gf161LoadAvailability() {
  document.getElementById('count').textContent = '確認中';
  const script = document.createElement('script');
  script.src = GF161_AVAILABILITY_URL + '?action=gf161_availability';
  script.onerror = function() { document.getElementById('count').textContent = '取得できません'; };
  document.head.appendChild(script);
  setTimeout(function() {
    if (!gf161AvailabilityReceived) document.getElementById('count').textContent = '取得できません';
    script.remove();
  }, 10000);
}
gf161LoadAvailability();
document.getElementById('identity').textContent='未連携：お名前と電話番号の自動入力はまだ利用できません';
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('status').textContent='現在はデモ画面です。受付データは送信されません。';});
</script></body></html>
